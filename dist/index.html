/* ---------- 本番の演出 ---------- */
function startShow(c) {
  const r = c.result, song = findSong(c.songId), hall = findHall(c.hallId);
  const sc = Music.createScore(song, { seed: hashStr(c.id + song.id), sections: songSections(song).filter(s => membersOfSection(s).length) });
  UI.showing = true; UI.caption = '開演前';
  Music.setMuted(!soundOn());
  render();
  Stage3D.setCamera('front');
  const total = Stage3D.playShow({
    score: sc, quality: showQuality(c), acoustics: hall.acoustics,
    fill: clamp(r.settlement.audience / hall.capacity, 0, 1),
    applause: { S: 1, A: 0.85, B: 0.65, C: 0.45, D: 0.3 }[r.rank], standing: r.rank === 'S' || r.rank === 'A',
    applauseLabel: r.rank === 'S' || r.rank === 'A' ? 'スタンディングオベーション！' : r.success ? '観客の拍手' : '控えめな拍手',
    onCaption: (label) => { UI.caption = label; const el = document.getElementById('cap3d'); if (el) { el.textContent = label; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } },
    onEnd: () => { if (!UI.showing) return; UI.showing = false; clearTimeout(UI.showGuard); render(); toast(`結果発表：総合評価 ${r.rank}`); },
  });
  // 見張り：何らかの理由で演出が終わらない場合でも、演出の長さ＋余裕を過ぎたら結果へ進める（永遠に待たない）
  clearTimeout(UI.showGuard);
  if (UI.showing && Number.isFinite(total)) UI.showGuard = setTimeout(() => {
    if (!UI.showing) return;
    console.warn('本番の演出が時間内に終わらなかったため、結果へ進みます');
    if (Stage3D.isShowing()) Stage3D.skipShow(); else { UI.showing = false; render(); }
  }, (total + 20) * 1000);
}

/* ---------- 操作（演奏会タブ） ---------- */
function closeToSetup(msg) { cmdHome(); UI.previewHall = null; render(); if (msg) toast(msg); }
Object.assign(ACTIONS, {
  startConcert() { startSetup(activeConcert()); UI.cmd = null; render(); },
  cgo(d) {
    const scr = { s: d.v };
    if (d.g) scr.g = d.g; if (d.id) scr.id = d.id; if (d.sec) scr.sec = d.sec;
    if (d.v === 'hallDetail') UI.previewHall = d.id;
    if (d.v === 'tutti' || d.v === 'section' || d.v === 'indivPick') UI.draft.menu = d.v === 'indivPick' ? 'individual' : d.v;
    cmdGo(scr); render();
  },
  cback() { const t = cmdTop(); if (t.s === 'hallDetail') UI.previewHall = null; cmdBack(); render(); },
  cHome() { cmdHome(); render(); },
  cRoot() { UI.cmd = null; render(); },
  ctab(d) { const t = cmdTop(); if (t.s === 'indivPick') { cmdSet({ sec: d.v, page: 0 }); UI.indSec = d.v; } else cmdSet({ tab: d.v }); render(); },
  cpage(d) { cmdSet({ page: (cmdTop().page || 0) + Number(d.d) }); render(); },
  chooseSong(d) { if (confirmSong(activeConcert(), d.id)) closeToSetup(`選曲：『${findSong(d.id).title}』に決定しました`); },
  reserveHall(d) { const h = findHall(d.id); if (selectHall(activeConcert(), d.id)) closeToSetup(`${h.name}を予約しました${h.fee ? `（${yen(h.fee)}）` : ''}`); else render(); },
  chooseCond(d) { if (selectConcertConductor(activeConcert(), d.id)) closeToSetup(`${activeConductor().name}が今回の指揮を担当します`); },
  goHireCond() { UI.tab = 'members'; UI.memView = 'conductors'; render(); scrollTop(); },
  toPractice() { const c = activeConcert(); if (startPractice(c)) { UI.cmd = null; render(); toast('準備完了！ 練習期間に入ります'); } },
  runPractice(d) {
    UI.draft.menu = d.m;
    const c = activeConcert();
    const r = runPractice(c, JSON.parse(JSON.stringify(buildPlan())));
    if (r.error) { toast(r.error); return; }
    UI.lastLog = r.log;
    if (d.m === 'section') SECTIONS.forEach(s => UI.draft.sections[s.id] = autoSectionFocus(c, s.id));   // 次回用に再提案
    // 練習の成果画面を表示（段階が本番準備に変わっていても、まず成果を見せる）
    UI.cmd = { cid: c.id, phase: c.phase, stack: [rootScreen(c), { s: 'log' }] };
    render();
    if (use3D()) Stage3D.playPractice(r.log.plan, practiceQuality(c));
    if (c.phase === 'prep') toast('10回の練習が終了しました');
  },
});
/* ---------- 指揮者 ---------- */
const traitOf = cd => CTRAIT[cd.trait] || { name: '—', desc: '' };
function condStats(cd) { return CONDUCTOR_ABILITIES.map(a => stat(a.name, cd.abilities[a.id], cd.potential[a.id], 'wine')).join(''); }
function renderConductorCard(cd, opts = {}) {
  const tr = traitOf(cd), fee = conductorFee(cd), active = STATE.conductorId === cd.id;
  return `<div class="card ${active ? 'gold' : ''}"><div class="row">${badge(condRank(cd))}<div class="grow" style="min-width:0">
      <div style="font-family:var(--serif);font-size:16px">${esc(cd.name)}${cd.original ? ' <span class="tag gold">オリジナル</span>' : ''}${active ? ' <span class="tag ok">担当中</span>' : ''}</div>
      <div class="muted">${tr.name}・出演料 ${fee ? yen(fee) + '/回' : '無償（常任）'}・指揮 ${cd.concerts || 0}回</div></div>${opts.cost ? `<div class="cost">${yen(opts.cost)}</div>` : ''}</div>
    <p class="sub" style="margin:6px 0">${esc(cd.profile || tr.desc)}</p>
    <div class="muted" style="margin-bottom:4px">個性：${esc(tr.desc)}</div>
    ${condStats(cd)}
    ${opts.actions || ''}</div>`;
}
function renderConductors() {
  const M = STATE.conductorMarket;
  const hired = STATE.conductors.map(cd => {
    const dr = dismissConductorBlockReason(cd.id);
    const actions = STATE.conductorId === cd.id ? '' : `<div class="row" style="margin-top:8px"><button class="btn gold grow" data-act="condSet" data-id="${cd.id}">担当にする</button><button class="btn grow" data-act="condFire" data-id="${cd.id}" ${dr ? 'disabled' : ''}>契約解除</button></div>`;
    return renderConductorCard(cd, { actions });
  }).join('');
  const cands = M.candidates.map(cd => {
    const why = conductorHireBlockReason(cd), done = M.hired.includes(cd.id);
    return renderConductorCard(cd, { cost: cd.cost, actions: done ? '<button class="btn block" disabled>契約済み</button>' : `<div style="height:8px"></div><button class="btn ${why ? '' : 'gold'} block" data-act="condHire" data-id="${cd.id}" ${why ? 'disabled' : ''}>契約する</button>${why ? `<div class="reason">契約できません：${esc(why)}</div>` : ''}` });
  }).join('');
  return `<div class="row sp" style="margin:6px 0 10px"><button class="btn sm" data-act="closeCond">← 団員一覧に戻る</button><span class="muted">資金 <b class="num">${yen(STATE.funds)}</b></span></div>
  <h2>指揮者</h2>
  <p class="sub" style="margin-top:-6px">担当指揮者の能力は、合奏練習の効率・本番の仕上がりと評価・集客に影響します。指揮者は演奏会を重ねると成長し、「育成」タブで鍛えることもできます。</p>
  <h3>契約中（${STATE.conductors.length}/${CONFIG.conductor.maxHired}）</h3>${hired}
  <h3 style="margin-top:16px">指揮者候補</h3>${cands}
  <div class="card"><div class="row sp"><div><div>候補の再調査</div><div class="muted">候補者を入れ替えます（${yen(CONFIG.conductor.rerollCost)}）。新しい演奏会が始まると無料で入れ替わります。</div></div>
    <button class="btn sm" data-act="condReroll" ${STATE.funds < CONFIG.conductor.rerollCost ? 'disabled' : ''}>再調査</button></div></div>
  <button class="btn block" data-act="closeCond">閉じる</button>`;
}
function conductorSummary() {
  const cd = activeConductor(); if (!cd) return '';
  return `<div class="card condcta"><div class="row sp"><div class="grow" style="min-width:0"><div class="muted">担当指揮者</div>
    <div style="font-family:var(--serif);font-size:16px;color:var(--gold2)">${esc(cd.name)} <span class="muted" style="font-size:12px">${traitOf(cd).name}</span></div>
    <div class="muted">${CONDUCTOR_ABILITIES.map(a => `${a.short} ${cd.abilities[a.id]}`).join('・')}</div></div>
    <button class="btn" data-act="openCond">指揮者</button></div></div>`;

/* =========================================================
 * UI_TABS — ホーム・団員・育成・記録の4タブ（スクロールしない階層型の固定画面）
 *
 *   上部：共通ステータス（資金・評判・団員数・演奏会の段階）
 *   見出し：左上に戻るボタン／いまの階層
 *   中央：その階層の内容だけを表示（多いものはカテゴリー分け・ページ分割）
 *   下部：操作ボタン・ページ送り ＋ 既存の5タブメニュー
 *
 *   各タブの階層はタブごとに保持し、別タブへ移動して戻っても同じ画面から再開する。
 *   ゲームの処理はすべて既存の logic.js の関数を呼ぶだけで、計算・データ構造は変えない。
 *   ※ 演奏会タブ（ui3d.js）には一切関与しない。
 * ========================================================= */

/* ---------- 画面の階層（タブごとのスタック） ---------- */
const TAB_ROOT = { home: 'hRoot', members: 'mRoot', train: 'tRoot', records: 'rRoot' };
function tstack(tab = UI.tab) {
  UI.tnav = UI.tnav || {};
  if (!UI.tnav[tab] || !UI.tnav[tab].length) UI.tnav[tab] = [{ s: TAB_ROOT[tab] }];
  return UI.tnav[tab];
}
const ttop = (tab = UI.tab) => { const st = tstack(tab); return st[st.length - 1]; };
function tpush(scr, tab = UI.tab) { tstack(tab).push(scr); }
function tpop(tab = UI.tab) { const st = tstack(tab); if (st.length > 1) st.pop(); }
function tset(patch) { Object.assign(ttop(), patch); }
// 別タブの特定の画面へ移動（ホームのお知らせ・団員詳細の「育成する」など）
function tjump(tab, path) { UI.tnav = UI.tnav || {}; UI.tnav[tab] = [{ s: TAB_ROOT[tab] }, ...path]; UI.tab = tab; }

/* ---------- 画面サイズ（ページ分割の件数を決める） ---------- */
let SAFE = null;
function safeInsets() {
  if (SAFE) return SAFE;
  try {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(d);
    const cs = getComputedStyle(d); SAFE = { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
    d.remove();
  } catch (e) { SAFE = { top: 0, bottom: 0 }; }
  return SAFE;
}
const TV = { sbar: 58, head: 50, foot: 64, nav: 65, pad: 24 };
function tvBodyH(hasFoot = true) {
  const s = safeInsets();
  return (window.innerHeight || 780) - s.top - s.bottom - TV.sbar - TV.head - TV.nav - (hasFoot ? TV.foot : 0) - TV.pad;
}
// 1ページの行数：本文の高さから、その画面固有の上部要素（extra）を引いて行の高さで割る
function tvPer(rowH, extra = 0, hasFoot = true) { return Math.max(1, Math.floor((tvBodyH(hasFoot) - extra + 8) / (rowH + 8))); }
function tvPage(list, page, per) {
  const pages = Math.max(1, Math.ceil(list.length / per)), p = clamp(page || 0, 0, pages - 1);
  return { items: list.slice(p * per, p * per + per), page: p, pages, total: list.length };
}
const tvPager = pg => pg.pages > 1 ? `<div class="tpager"><button data-act="tpage" data-d="-1" ${pg.page <= 0 ? 'disabled' : ''} aria-label="前のページ">‹ 前へ</button><span>${pg.page + 1} / ${pg.pages}</span><button data-act="tpage" data-d="1" ${pg.page >= pg.pages - 1 ? 'disabled' : ''} aria-label="次のページ">次へ ›</button></div>` : '';
const tvTabs = (list, cur) => `<div class="tsub">${list.map(([id, n]) => `<button class="${cur === id ? 'on' : ''}" data-act="tsub" data-v="${id}">${n}</button>`).join('')}</div>`;
const tvRow = (act, attrs, main, sub, right = '', cls = '') => `<button class="trow ${cls}" data-act="${act}" ${attrs}><span class="tr-m"><span class="tr-t">${main}</span>${sub ? `<span class="tr-s">${sub}</span>` : ''}</span>${right}<span class="chev">›</span></button>`;
const tvGo = (v, extra = '') => `data-v="${v}" ${extra}`;
const kv = (k, v, cls = '') => `<div class="tkv"><span>${k}</span><span class="${cls}">${v}</span></div>`;
const spark = m => `<span class="spark" aria-hidden="true">${ABILITIES.map(a => `<i style="height:${Math.max(2, m.abilities[a.id] / 100 * 22)}px"></i>`).join('')}</span>`;

/* ---------- 共通レイアウト ---------- */
function renderTabsUI(c) {
  const scr = ttop();
  const def = TSCREENS[scr.s] || TSCREENS[TAB_ROOT[UI.tab]];
  const out = def(c, scr);

  const funds = sh ? STATE.funds - c.result.settlement.net : STATE.funds, rep = sh ? c.result.repBefore : STATE.reputation;

    <div class="tbody ${out.foot ? '' : 'nofoot'}">${out.body}</div>

/* ---------- お知らせ（現在の状況から自動生成） ---------- */
function notices(c) {
  const out = [];
  const add = (level, text, tab, path) => out.push({ level, text, tab, path });
  if (c.phase === 'setup') {
    const st = setupStatus(c);
    if (!c.started) add('go', `${c.title}の準備を始めましょう`, 'concert');
    else { const left = [!st.song && '選曲', !st.hall && '会場の予約', !st.conductor && '指揮者の選択'].filter(Boolean); add(left.length ? 'go' : 'ok', left.length ? `準備が残っています：${left.join('・')}` : '準備が整いました。練習期間へ進めます', 'concert'); }
  }
  if (c.phase === 'practice') add('go', `練習期間です（${c.practiceDone}/${CONFIG.practiceCount}回 完了）`, 'concert');
  if (c.phase === 'prep') add('go', `本番の準備ができています（成功確率 ${Math.round(successInfo(c).prob * 100)}%）`, 'concert');
  if (c.phase === 'result') add('ok', `${c.title}の結果が出ています（評価 ${c.result.rank}）`, 'concert');
  if (c.songId) { const sh = shortageOf(findSong(c.songId)); if (sh.items.length) add('warn', `今回の曲で編成が不足：${sh.items.map(i => `${INST[i.inst].abbr} ${i.lack}名`).join('、')}`, 'members', [{ s: 'recruit' }, { s: 'recMembers' }]); }
  if (STATE.funds < 50000) add('warn', `資金が少なくなっています（${yen(STATE.funds)}）`, 'home', [{ s: 'hFinance' }]);
  const open = STATE.recruit.candidates.filter(x => !STATE.recruit.hired.includes(x.id)).length;
  if (open) add('info', `団員の募集候補が${open}名います`, 'members', [{ s: 'recruit' }, { s: 'recMembers' }]);
  const oc = STATE.recruit.candidates.filter(x => x.original && !STATE.recruit.hired.includes(x.id));
  if (oc.length) add('info', `注目の候補：${oc.map(x => x.name).join('、')}（オリジナル）`, 'members', [{ s: 'recruit' }, { s: 'recMembers' }]);
  if (STATE.conductors.length < CONFIG.conductor.maxHired) add('info', `指揮者候補が${STATE.conductorMarket.candidates.filter(x => !STATE.conductorMarket.hired.includes(x.id)).length}名います（契約 ${STATE.conductors.length}/${CONFIG.conductor.maxHired}名）`, 'members', [{ s: 'recruit' }, { s: 'recConds' }]);
  if (c.phase !== 'result' && c.phase !== 'done' && !c.trainingLog.length) add('info', '今回の演奏会ではまだ育成をしていません', 'train');
  const last = pastConcerts()[0];

  return out;
}

  tTarget(c, scr) {

      const sec = scr.sec || (UI.trPre && memberById(UI.trPre) ? INST[memberById(UI.trPre).inst].section : 'hs');
      const ms = sortMembers(membersOfSection(sec)), pg = tvPage(ms, scr.page, tvPer(56, 50));
      body = tvTabs(SECTIONS.map(s => [s.id, s.name]), sec) + pg.items.map(m => { const room = Math.round(memberPotAvg(m) - memberAvg(m)); return `<button class="trow ${UI.trPre === m.id ? 'sel' : ''}" data-act="tTargetPick" data-id="${m.id}">${badge(memberRank(m))}<span class="tr-m"><span class="tr-t">${esc(m.name)} <small class="muted">${INST[m.inst].abbr}</small></span><span class="tr-s">平均 ${Math.round(memberAvg(m))}・伸びしろ +${room}${t.id === 'instrument' ? `・${CONFIG.instrumentGrades[m.instrumentGrade || 0].name}` : ''}</span></span>${tag(m.id)}<span class="chev">›</span></button>`; }).join('');
      foot = tvPager(pg);
      if (!scr.sec) scr.sec = sec;
    }
    return { parent: t.name, title, body, foot };
  },
  tAbility(c, scr) {
    const t = findTraining(scr.t), m = memberById(scr.id);
    return {
      parent: `${t.name}・${esc(m.name)}`, title: '伸ばす能力',
      body: `<div class="tnote">選んだ能力が +${t.gains._focus[0]}〜${t.gains._focus[1]}（潜在能力まで）。ほかの能力も伸びることがあります。</div><div class="tabil">` +
        ABILITIES.map(a => `<button class="${scr.ab === a.id ? 'on' : ''}" data-act="tAbilityPick" data-v="${a.id}" ${m.potential[a.id] <= m.abilities[a.id] ? 'disabled' : ''}><b>${a.name}</b><span>${m.abilities[a.id]} / ${m.potential[a.id]}</span></button>`).join('') + '</div>',
    };
  },
  tConfirm(c, scr) {
    const t = findTraining(scr.t), ms = trainingTargets(t, scr.id);
    const why = trainingBlockReason(c, t.id, scr.id, t.chooseAbility ? scr.ab : null);
    const cost = ms.length ? trainingCost(t, scr.id) : 0;
    const targetName = t.target === 'section' ? `${SEC[scr.id].name}セクション（${ms.length}名）` : ms[0] ? esc(ms[0].name) : '—';
    let effect;
    if (t.chooseAbility) effect = `${ABIL[scr.ab].name} +${t.gains._focus[0]}〜${t.gains._focus[1]}、ほかの能力も伸びることがある`;
    else { const g = t.id === 'instrument' ? (ms[0] ? trainingGains(t, ms[0]) : {}) : t.gains; effect = Object.entries(g).map(([a, [x, y, p]]) => `${abilShort(a)} +${x === y ? x : x + '〜' + y}${p < 1 ? `（${Math.round(p * 100)}%）` : ''}`).join('、') + (t.target === 'section' ? '（各団員）' : ''); }
    const cur = t.target === 'member' && ms[0] ? (t.chooseAbility ? `${ABIL[scr.ab].name} ${ms[0].abilities[scr.ab]} / ${ms[0].potential[scr.ab]}` : t.id === 'instrument' ? `${CONFIG.instrumentGrades[ms[0].instrumentGrade || 0].name} → ${(CONFIG.instrumentGrades[(ms[0].instrumentGrade || 0) + 1] || { name: '—' }).name}` : '') : t.target === 'conductor' && ms[0] ? CONDUCTOR_ABILITIES.map(a => `${a.short}${ms[0].abilities[a.id]}/${ms[0].potential[a.id]}`).join(' ') : `平均能力 ${Math.round(mean(ms.map(memberAvg)) || 0)}`;
    return {
      parent: t.name, title: '内容の確認',
      body: `<div class="tconfirm left"><div class="tc-msg">${esc(t.desc)}</div>
        ${kv('育成内容', t.name)}${kv('育成対象', targetName)}${cur ? kv('現在', cur) : ''}${kv('期待される効果', effect)}${kv('必要な費用', `<b>${cost ? yen(cost) : '—'}</b>`)}${kv('資金', `${yen(STATE.funds)} → ${yen(STATE.funds - cost)}`, STATE.funds - cost < 0 ? 'neg' : '')}
        ${t.limit === 'concert' ? '<div class="tnote">同じ対象には1演奏会につき1回まで</div>' : ''}</div>
        ${why ? `<div class="treason">実行できません：${esc(why)}</div>` : ''}`,
      foot: `<button class="tbtn" data-act="tback">戻る</button><button class="tbtn pri" data-act="tTrainRun" ${why ? 'disabled' : ''}>育成を実行 ${cost ? yen(cost) : ''}</button>`,
    };
  },
  tResult(c, scr) {
    const e = c.trainingLog[scr.i];
    const by = {}; e.gains.forEach(g => { (by[g.id] = by[g.id] || { name: g.name, a: [] }).a.push(`${abilShort(g.abil)}+${g.to - g.from}`); });
    const rows = Object.values(by), pg = tvPage(rows, scr.page, tvPer(44, 120));
    const total = e.gains.reduce((s, g) => s + g.to - g.from, 0);
    return {
      parent: e.name, title: '育成の成果',
      body: `<div class="tresmsg">${esc(e.message)}</div><div class="tnote center">${esc(e.target)}・${yen(e.cost)}${e.extra ? `<br>${esc(e.extra)}` : ''}</div>
        ${total ? pg.items.map(x => `<div class="trow static slim"><span class="tr-m"><span class="tr-t">${esc(x.name)}</span></span><span class="growl">${x.a.map(s => `<span class="tag ok">${s}</span>`).join('')}</span></div>`).join('') + `<div class="tnote center">能力の合計 +${total}</div>` : '<div class="tempty">今回は目に見える成果が出なかった…（伸びしろが少ない対象もいる）</div>'}`,
      foot: `${tvPager(pg)}<button class="tbtn pri" data-act="tTrainDone">育成メニューへ</button>`,
    };
  },
  tHistory(c, scr) {
    const list = c.trainingLog.map((l, i) => ({ l, i })).reverse(), pg = tvPage(list, scr.page, tvPer(56));
    return {
      parent: '育成', title: '今回の育成履歴',
      body: pg.items.map(({ l, i }) => tvRow('tgo', tvGo('tResult', `data-i="${i}"`), esc(l.name), `${esc(l.target)}・${yen(l.cost)}`, `<span class="tr-r pos">+${l.gains.reduce((s, g) => s + g.to - g.from, 0)}</span>`)).join('') || '<div class="tempty">まだ育成していません</div>',
      foot: tvPager(pg),
    };
  },

  /* ===== 記録 ===== */
  rRoot(c) {
    const past = pastConcerts();
    const cats = [
      ['rConcerts', '過去の演奏会', `${past.length}回開催`],
      ['rFinance', '財務記録', `資金 ${yen(STATE.funds)}`],
      ['rTraining', '育成の記録', `${STATE.concertOrder.reduce((s, id) => s + STATE.concertPrograms[id].trainingLog.length, 0)}件`],
      ['rConds', '指揮者の記録', `契約中 ${STATE.conductors.length}名`],
      ['rQuiz', '音楽クイズの記録', `回答 ${Object.values(ensureQuizState().songs).reduce((n, s) => n + s.answered, 0)}問・連続正解 ${STATE.quiz.streak}`],
      ['rSettings', '設定・保存データ', `楽団名・データの初期化`],
    ];
    return { title: '記録', body: cats.map(([v, n, s]) => tvRow('tgo', tvGo(v), n, s)).join('') };
  },
  rConcerts(c, scr) {
    const list = STATE.concertOrder.map(id => STATE.concertPrograms[id]).slice().reverse(), pg = tvPage(list, scr.page, tvPer(56));
    return {
      parent: '記録', title: '過去の演奏会',
      body: pg.items.map(x => tvRow('tgo', tvGo('rConcert', `data-id="${x.id}"`), esc(x.title), x.songId ? esc(findSong(x.songId).title) : '曲目未定', x.result ? `${badge(x.result.rank)}<span class="tr-r ${x.result.settlement.net < 0 ? 'neg' : 'pos'}">${yenS(x.result.settlement.net)}</span>` : `<span class="tr-r">${phaseName(x.phase)}中</span>`)).join(''),
      foot: tvPager(pg),
    };
  },
  rConcert(c, scr) {
    const x = STATE.concertPrograms[scr.id], r = x.result, tab = scr.tab || 'sum';
    let body = '', pg = null;
    if (tab === 'sum') {
      body = `${kv('会場', x.hallId ? esc(findHall(x.hallId).name) : '未定')}${kv('曲目', x.songId ? esc(findSong(x.songId).title) : '未定')}${kv('指揮者', r ? esc(r.conductorName || '—') : esc(condById(x.conductorId)?.name || '未定'))}`
        + (r ? `${kv('評価', `${r.rank}（${r.total}点）・${r.success ? '演奏成功' : '演奏に乱れ'}`)}${kv('成功確率', `${Math.round(r.prob * 100)}%・${CONFIG.policies[r.policy].name}${r.rehearsal ? '・ホール練習あり' : ''}`)}${kv('評判', `${Math.round(r.repBefore)} → ${Math.round(r.repAfter)}`)}${kv('来場者', `${r.settlement.audience}名`)}` : kv('段階', `${phaseName(x.phase)}（練習 ${x.practiceDone}/${CONFIG.practiceCount}回）`));
    } else {
      const lists = {
        money: x.ledger.map(l => `<div class="tline"><span>${esc(l.label)}</span><b class="${l.amount < 0 ? 'neg' : 'pos'}">${yenS(l.amount)}</b></div>`),
        prac: x.practices.map(l => `<div class="tline"><span><b class="gold">${l.no === 'H' ? 'ホール' : '第' + l.no + '回'}</b> ${esc(l.summary)}</span></div>`),
        train: x.trainingLog.map(l => `<div class="tline"><span><b class="gold">${esc(l.name)}</b> ${esc(l.target)}</span><b class="pos">+${l.gains.reduce((s, g) => s + g.to - g.from, 0)}</b></div>`),
        rev: r ? r.reviews.map(l => `<div class="tline rv2"><span><b class="gold">${esc(l.k)}</b> ${esc(l.t)}</span></div>`) : [],
      }[tab];

      pg = tvPage(lists, scr.page, tvPer(rowH, 50));
      body = pg.items.join('') || '<div class="tempty">記録がありません</div>';
      if (tab === 'money' && x.ledger.length) body += `<div class="tline total"><span>収支合計</span><b class="${ledgerSum(x.ledger) < 0 ? 'neg' : 'pos'}">${yenS(ledgerSum(x.ledger))}</b></div>`;
    }
    return {
      parent: '過去の演奏会', title: esc(x.title), badge: r ? badge(r.rank) : '',
      body: tvTabs([['sum', '概要'], ['money', '収支'], ['prac', '練習'], ['train', '育成'], ['rev', '講評']], tab) + body,
      foot: pg ? tvPager(pg) : '',
    };
  },
  rFinance(c, scr) {
    const rows = [{ id: '_general', t: '団員募集・指揮者契約', s: `${STATE.ledger.length}件`, v: ledgerSum(STATE.ledger) },
      ...STATE.concertOrder.map(id => STATE.concertPrograms[id]).slice().reverse().map(x => ({ id: x.id, t: x.title, s: `${x.ledger.length}件${x.result ? '' : '（進行中）'}`, v: ledgerSum(x.ledger) }))];
    const pg = tvPage(rows, scr.page, tvPer(56, 60));
    return {
      parent: '記録', title: '財務記録',
      body: `<div class="tbig sm"><small>現在の資金</small><b>${yen(STATE.funds)}</b></div>` + pg.items.map(x => tvRow('tgo', tvGo('rLedger', `data-id="${x.id}"`), esc(x.t), x.s, `<span class="tr-r ${x.v < 0 ? 'neg' : 'pos'}">${yenS(x.v)}</span>`)).join(''),
      foot: tvPager(pg),
    };
  },
  rLedger(c, scr) {
    const L = scr.id === '_general' ? STATE.ledger.slice().reverse() : STATE.concertPrograms[scr.id].ledger;
    const pg = tvPage(L, scr.page, tvPer(46, 44));
    return {
      parent: '財務記録', title: scr.id === '_general' ? '団員募集・指揮者契約' : esc(STATE.concertPrograms[scr.id].title),
      body: (pg.items.map(l => `<div class="tline"><span>${esc(l.label)}</span><b class="${l.amount < 0 ? 'neg' : 'pos'}">${yenS(l.amount)}</b></div>`).join('') || '<div class="tempty">記録がありません</div>') + `<div class="tline total"><span>合計</span><b class="${ledgerSum(L) < 0 ? 'neg' : 'pos'}">${yenS(ledgerSum(L))}</b></div>`,
      foot: tvPager(pg),
    };
  },
  rTraining(c, scr) {
    const list = STATE.concertOrder.map(id => STATE.concertPrograms[id]).slice().reverse(), pg = tvPage(list, scr.page, tvPer(56));
    return {
      parent: '記録', title: '育成の記録',
      body: pg.items.map(x => tvRow('tgo', tvGo('rConcert', `data-id="${x.id}" data-tab="train"`), esc(x.title), `${x.trainingLog.length}件・費用 ${yen(x.trainingLog.reduce((s, l) => s + l.cost, 0))}`, `<span class="tr-r pos">+${x.trainingLog.reduce((s, l) => s + l.gains.reduce((a, g) => a + g.to - g.from, 0), 0)}</span>`)).join(''),
      foot: tvPager(pg),
    };
  },
  rConds(c) {
    const done = pastConcerts();
    return {
      parent: '記録', title: '指揮者の記録',
      body: STATE.conductors.map(cd => { const n = done.filter(x => x.result.conductorId === cd.id).length; return tvRow('tgo', tvGo('rCond', `data-id="${cd.id}"`), esc(cd.name), `${traitOf(cd).name}・指揮 ${cd.concerts || 0}回`, `<span class="tr-r">${n}回</span>`); }).join(''),
    };
  },
  rCond(c, scr) {
    const cd = condById(scr.id), list = pastConcerts().filter(x => x.result.conductorId === scr.id), pg = tvPage(list, scr.page, tvPer(56, 60));
    return {
      parent: '指揮者の記録', title: cd ? esc(cd.name) : '指揮者',
      body: (cd ? `<div class="tnote">${CONDUCTOR_ABILITIES.map(a => `${a.short} ${cd.abilities[a.id]}/${cd.potential[a.id]}`).join('・')}<br>指揮した演奏会 ${cd.concerts || 0}回</div>` : '') +
        (pg.items.map(x => tvRow('tgo', tvGo('rConcert', `data-id="${x.id}"`), esc(x.title), `${esc(findSong(x.songId).title)}${(x.result.conductorGrowth || []).length ? `・成長 ${x.result.conductorGrowth.map(g => CABIL[g.abil].short + '+' + (g.to - g.from)).join(' ')}` : ''}`, badge(x.result.rank))).join('') || '<div class="tempty">まだ指揮した演奏会はありません</div>'),
      foot: tvPager(pg),
    };
  },
  rSettings(c, scr) {
    return {
      parent: '記録', title: '設定・保存データ',
      body: `<label class="tnote">楽団名</label><div class="tpair"><input class="input" id="orchName" value="${esc(STATE.orchestraName)}" maxlength="24"><button class="tbtn sm" data-act="rename">変更</button></div>
        ${kv('保存', `操作のたびにこの端末のブラウザへ自動保存（データ形式 v${STATE.version}）`)}
        ${kv('音声', soundOn() ? '演奏会の音あり' : '消音（演奏会タブで切替）')}`,
      foot: `<button class="tbtn" data-act="tgo" ${tvGo('rReset')}>保存データを初期化</button>`,
    };
  },
  rReset() {
    return {
      parent: '設定・保存データ', title: '初期化の確認',
      body: '<div class="tconfirm">すべての進行状況が消えます。<br>本当に初期化しますか？</div>',
      foot: '<button class="tbtn" data-act="tback">やめる</button><button class="tbtn pri" data-act="resetYes">初期化する</button>',
    };
  },
};

/* ---------- 操作 ---------- */
Object.assign(ACTIONS, {
  // タブ切り替え：各タブの階層はそのまま保持（演奏会タブの動作は従来どおり）
  tab(d) {
    if (UI.showing && d.tab !== 'concert') Stage3D.skipShow();
    UI.tab = d.tab; UI.sheetMember = null;
    if (d.tab === 'members' && UI.memView === 'conductors') {   // 演奏会タブ「指揮者の採用・管理」からの案内
      UI.memView = 'list';
      tjump('members', STATE.conductors.length ? [{ s: 'mConds' }] : [{ s: 'recruit' }, { s: 'recConds' }]);
    }
    render(); scrollTop();
  },
  tgo(d) {
    const scr = { s: d.v };
    for (const k of ['g', 'inst', 'id', 'k', 't', 'i', 'tab']) if (d[k] != null) scr[k] = d[k];
    if (d.i != null) scr.i = Number(d.i);
    tpush(scr);
    // 団員詳細・指揮者詳細の「育成する」から来た場合は、個人の育成で対象を自動選択する
    if (d.v === 'tTarget' && UI.trPre) {
      const t = findTraining(d.t);
      if ((t.target === 'member' && memberById(UI.trPre)) || (t.target === 'conductor' && condById(UI.trPre))) { ACTIONS.tTargetPick({ id: UI.trPre }); return; }
    }
    render();
  },
  tback() { tpop(); render(); },
  tpage(d) { tset({ page: (ttop().page || 0) + Number(d.d) }); render(); },
  tsub(d) { const t = ttop(); if (t.s === 'tTarget') tset({ sec: d.v, page: 0 }); else tset({ tab: d.v, page: 0 }); render(); },
  tjump(d) {
    const ids = (d.path || '').split(',').filter(Boolean);
    const path = ids.map((s, k) => ({ s, ...(k === ids.length - 1 && d.id ? { id: d.id } : {}) }));
    tjump(d.tab, path); render();
  },
  tnote(d) { const n = notices(activeConcert())[Number(d.i)]; if (!n) return; if (n.path) tjump(n.tab, n.path); else UI.tab = n.tab; render(); },
  // 団員
  tPrincipal(d) {
    const m = memberById(d.id), prev = m && principalOf(m.inst);
    if (setPrincipal(d.id, d.inst || (m && m.inst))) {
      toast(`${m.name} を ${INST[m.inst].abbr} の首席に任命しました${prev && prev.id !== m.id ? `（${prev.name} は通常団員に戻りました）` : ''}`);
      if (ttop().s === 'mPrincipal') tpop();
    }
    render();
  },
  tPrinPick(d) {
    // 退団確認から来た場合は確認画面を閉じてから首席の選択へ
    if (ttop().s === 'mDismiss') { tpop(); if (ttop().s === 'mMember') tpop(); }
    tpush({ s: 'mPrincipal', inst: d.inst }); render();
  },
  tDismiss(d) {
    const m = memberById(d.id), why = dismissBlockReason(m);
    if (why) { toast(why); render(); return; }
    if (dismissMember(d.id)) {
      toast(`${m.name} が退団しました`);
      if (UI.draft) UI.draft.members = UI.draft.members.filter(x => x !== d.id);
      tpop(); tpop();
    }
    render();
  },
  tTrainMember(d) { UI.trPre = d.id; tjump('train', [{ s: 'tList', k: 'member' }]); render(); },
  tTrainCond(d) { UI.trPre = d.id; tjump('train', [{ s: 'tList', k: 'conductor' }]); render(); },
  tCondSet(d) { if (setActiveConductor(d.id)) toast(`${condById(d.id).name} が担当指揮者になりました`); render(); },
  tCondFire(d) { const cd = condById(d.id); if (dismissConductor(d.id)) { toast(`${cd.name} との契約を解除しました`); tpop(); tpop(); } render(); },
  tHire(d) { const cand = STATE.recruit.candidates.find(x => x.id === d.id); if (hireCandidate(d.id)) { toast(`${cand.name} が入団しました（${yen(cand.cost)}）`); tpop(); } render(); },
  tReroll() { if (rerollRecruit()) { toast('新しい候補者が集まりました'); tset({ page: 0 }); } render(); },
  tCondHire(d) { const cd = STATE.conductorMarket.candidates.find(x => x.id === d.id); if (hireConductor(d.id)) { toast(`${cd.name} と契約しました（${yen(cd.cost)}）`); tpop(); } render(); },
  tCondReroll() { if (rerollConductors()) { toast('新しい指揮者候補が見つかりました'); tset({ page: 0 }); } render(); },
  // 育成：内容 → 対象 →（能力）→ 確認 → 実行 → 成果
  tTargetPick(d) {
    const t = findTraining(ttop().t);
    if (t.chooseAbility) tpush({ s: 'tAbility', t: t.id, id: d.id });
    else tpush({ s: 'tConfirm', t: t.id, id: d.id });
    render();
  },
  tAbilityPick(d) { const t = ttop(); t.ab = d.v; tpush({ s: 'tConfirm', t: t.t, id: t.id, ab: d.v }); render(); },
  tTrainRun() {
    const scr = ttop(), c = activeConcert(), t = findTraining(scr.t);
    const r = runTraining(c, t.id, scr.id, t.chooseAbility ? scr.ab : null);
    if (r.error) { toast(r.error); render(); return; }
    tpop(); tpush({ s: 'tResult', i: c.trainingLog.length - 1 });
    render();
  },
  tTrainDone() { UI.trPre = null; const st = tstack('train'); const k = st.find(x => x.s === 'tList'); UI.tnav.train = [{ s: 'tRoot' }, ...(k ? [{ s: 'tList', k: k.k }] : [])]; render(); },
});

// 新しくゲームを始めた／データを初期化したときは、各タブの階層を最初の画面に戻す（削除済みの団員などを参照しないように）
['newgame', 'resetYes'].forEach(k => {
  const orig = ACTIONS[k];
  if (orig) ACTIONS[k] = function (...a) { UI.tnav = {}; UI.trPre = null; return orig.apply(this, a); };
});

/* =========================================================
 * 練習の進行（演奏会タブの3Dステージで練習の様子を見せる）
 *   1. 既存の「練習開始」ボタン → 既存の runPractice() で成果を確定（これまでと同じ計算）
 *   2. 10〜15秒、既存の3Dステージで指揮者・団員が練習する（練習対象に応じて中心のセクションが変わる）
 *   3. 途中で一定確率でランダムイベント（選択肢があるものは手を止めて選ぶ）
 *   4. 終了後、既存の「練習の成果」画面（練習報告）を表示。イベントの結果も報告に載せる
 * テスト用：UI.practiceTest = { scale: 0.05（時間の倍率）, event: 'force'|'off', eventId }
 * ========================================================= */
const MENU_NAME = { tutti: '全体合奏', section: 'セクション練習', individual: '個人練習' };
const SEC_GROUPS = [
  { id: 'str', name: '弦楽器', secs: ['hs', 'ls'], cam: 'front' },
  { id: 'ww', name: '木管楽器', secs: ['ww'], cam: 'ww' },
  { id: 'br', name: '金管楽器', secs: ['br'], cam: 'br' },
  { id: 'pc', name: '打楽器', secs: ['pc'], cam: 'pc' },
];
let PR_TIMER = null;
const prOpts = () => UI.practiceTest || {};

// 練習時間（秒）：全体合奏 約12〜13秒、セクション練習 約13〜14秒、個人練習 約11〜12秒
function practiceSeconds(menu) {
  const base = { tutti: 12, section: 13, individual: 11 }[menu] || 12;
  return base + pevRand() * 1.2;
}
// 練習中の見せ方（どのセクションを中心に演奏させ、どのカメラで見せるか）の時間割
function practiceSchedule(log) {
  const plan = log.plan;
  if (plan.menu === 'section') {
    const gs = SEC_GROUPS.filter(g => g.secs.some(s => membersOfSection(s).length));
    return gs.map((g, i) => ({ from: i / gs.length, secs: g.secs, cam: g.cam, label: `${g.name}のセクション練習` }));
  }
  if (plan.menu === 'individual') {
    const ms = (plan.members || []).map(memberById).filter(Boolean);
    const sec = ms.length ? INST[ms[0].inst].section : 'hs';
    return [{ from: 0, secs: null, cam: sec, label: `個人練習：${ms.map(m => m.name).join('、') || '—'}` }];
  }
  return [
    { from: 0, secs: null, cam: 'overview', label: 'オーケストラ全体で合わせています' },
    { from: 0.34, secs: null, cam: 'conductor', label: 'オーケストラ全体で合わせています' },
    { from: 0.67, secs: null, cam: 'front', label: 'オーケストラ全体で合わせています' },
  ];
}
// 練習中のひとこと（指揮者・首席・曲名と連動。文章は data/events/practice.json の commentary）
function practiceLines(c, log) {
  const cd = activeConductor(), cm = principalOf('Vn1'), song = findSong(c.songId);
  const vars = { conductor: cd ? cd.name : '指揮者', song: song.title, aim: cd && PEV_TRAIT[cd.trait] ? PEV_TRAIT[cd.trait].aim : PRACTICE_EVENT_DATA.defaultAim, concertmaster: cm ? cm.name : null };
  const L = (PRACTICE_EVENT_DATA.commentary || {})[log.menu];
  if (!L || !L.length) return ['練習中'];
  return L.map(x => typeof x === 'string' ? pevText(x, vars) : (pevFill(x.text, vars) ?? pevText(x.fallback || '', vars)));
}

const practiceAnimOpts = log => ({ loop: true, fallbackSecs: (log.plan.members || []).map(memberById).filter(Boolean).map(m => INST[m.inst].section) });
function startPracticeSession(c, log) {
  const o = prOpts();
  const ev = o.event === 'off' ? null : pickPracticeEvent(c, log, { force: o.event === 'force', id: o.eventId });
  const dur = practiceSeconds(log.menu) * 1000;
  UI.practicing = {
    cid: c.id, log, dur, elapsed: 0, last: performance.now(), ev, evState: null, evShownAt: 0, result: null,
    sched: practiceSchedule(log), seg: -1, override: null, lines: practiceLines(c, log), line: 0,
  };
  UI.cmd = { cid: c.id, phase: c.phase, stack: [rootScreen(c), { s: 'practicing' }] };
  render();
  if (use3D()) { Stage3D.playPractice(log.plan, practiceQuality(c), practiceAnimOpts(log)); applySegment(true); }
  UI.practicing.animStarted = true;
  clearInterval(PR_TIMER); PR_TIMER = setInterval(practiceTick, 100);
}
function currentSegment(P) {
  const f = P.elapsed / P.dur; let k = 0;
  P.sched.forEach((s, i) => { if (f >= s.from) k = i; });
  return k;
}
function applySegment(force) {
  const P = UI.practicing; if (!P) return;
  const k = currentSegment(P);
  if (!force && k === P.seg && !P.overrideDirty) return false;
  P.seg = k; P.overrideDirty = false;
  const seg = P.sched[k], ov = P.override && P.elapsed < P.override.until ? P.override : null;
  if (use3D()) {
    Stage3D.setPracticeFocus(ov ? [ov.sec] : seg.secs);
    Stage3D.setCamera(ov ? ov.sec : seg.cam);
  }
  return true;
}
function practiceTick() {
  const P = UI.practicing; if (!P) { clearInterval(PR_TIMER); PR_TIMER = null; return; }
  const now = performance.now(), dt = now - P.last; P.last = now;
  const speed = 1 / (prOpts().scale || 1);
  let changed = false;
  const open = P.evState === 'open';
  if (!open) P.elapsed += dt * speed;
  // ランダムイベント
  if (P.ev && !P.evState && P.elapsed >= P.ev.at * P.dur) {
    if (P.ev.choices) { P.evState = 'open'; if (use3D()) Stage3D.pausePractice(true); }
    else { P.result = applyPracticeEvent(activeConcertById(P.cid), P.log, P.ev); P.evState = 'shown'; P.evShownAt = P.elapsed; if (P.ev.sec) setOverride(P, P.ev.sec, 3000); }
    changed = true;
  }
  if (P.evState === 'shown' && P.elapsed - P.evShownAt > 3500) { P.evState = 'done'; changed = true; }
  if (P.override && P.elapsed >= P.override.until) { P.override = null; P.overrideDirty = true; }
  applySegment(false);
  // ひとことを約3秒ごとに入れ替える
  P.line = Math.floor(P.elapsed / 3200) % P.lines.length;
  if (P.elapsed >= P.dur && P.evState !== 'open') { finishPracticeSession(); return; }
  if (UI.tab !== 'concert') return;
  if (changed) { render(); return; }   // イベントの表示・終了など、画面の構成が変わるときだけ描き直す
  const fe = document.getElementById('prFocus'), le = document.getElementById('prLine');
  if (fe) fe.textContent = practiceFocusLabel(P);
  if (le) le.textContent = P.lines[P.line];
  const fill = document.getElementById('prFill'), rem = document.getElementById('prRemain');
  if (fill) fill.style.width = Math.min(100, P.elapsed / P.dur * 100).toFixed(1) + '%';
  if (rem) rem.textContent = `残り ${Math.max(0, Math.ceil((P.dur - P.elapsed) / 1000))}秒`;
}
const activeConcertById = id => STATE.concertPrograms[id] || activeConcert();
function setOverride(P, sec, ms) { P.override = { sec, until: P.elapsed + ms }; P.overrideDirty = true; }
function finishPracticeSession() {
  const P = UI.practicing; if (!P || P.finished) return;   // 終了処理は1回だけ
  P.finished = true;
  clearInterval(PR_TIMER); PR_TIMER = null;
  if (use3D()) { Stage3D.endPractice(); Stage3D.setCamera('front'); }   // 練習が終わったら正面の視点に戻す
  UI.practicing = null;
  const c = activeConcertById(P.cid);
  UI.cmd = { cid: c.id, phase: c.phase, stack: [rootScreen(c), { s: 'log' }] };
  if (UI.tab === 'concert') render();
  if (c.phase === 'prep') toast('10回の練習が終了しました');
}

function practiceFocusLabel(P) {
  if (!P) return "";
  const seg = P.sched[Math.max(0, currentSegment(P))] || P.sched[0];
  const ov = P.override && P.elapsed < P.override.until ? P.override : null;
  return ov ? `${SEC[ov.sec].name}を中心に練習中` : seg.label;
}
/* ---------- 画面 ---------- */
SCREENS.practicing = {
  get kind() { const P = UI.practicing; return P && P.evState === 'open' ? 'tall' : 'short'; },
  render: c => {
    const P = UI.practicing;
    if (!P) return { crumb: '<b>練習</b>', body: '<div class="cnote">練習は終了しました</div>', foot: '<button class="cbtn pri" data-act="cHome">戻る</button>' };
    const log = P.log;
    const focus = practiceFocusLabel(P);
    const head = { crumb: `第${log.no}回 ${MENU_NAME[log.menu]}<b>練習中</b>`, badge: `<span class="cbadge" id="prRemain">残り ${Math.max(0, Math.ceil((P.dur - P.elapsed) / 1000))}秒</span>` };
    const bar = `<div class="prbar"><i id="prFill" style="width:${Math.min(100, P.elapsed / P.dur * 100).toFixed(1)}%"></i></div>`;
    const ev = P.ev;
    if (ev && P.evState === 'open') {
      return { ...head, crumb: `第${log.no}回 ${MENU_NAME[log.menu]}<b>${esc(ev.title)}</b>`,
        body: `<div class="prev"><div class="prev-h"><span class="tag gold">${esc(ev.title)}</span><span class="prev-w">${esc(ev.who)}<small>（${esc(ev.whoRole)}）</small></span></div><div class="prev-t">「${esc(ev.text)}」</div></div>
          <div class="prch">${ev.choices.map(ch => `<button class="crow" data-act="prChoice" data-v="${ch.id}"><span class="cr-main"><span class="cr-t">${esc(ch.label)}</span><span class="cr-s">${esc(ch.hint)}</span></span></button>`).join('')}</div>` };
    }
    const banner = ev && (P.evState === 'shown' || (P.evState === 'done' && P.result && P.elapsed - P.evShownAt < 3500))
      ? `<div class="prev mini"><div class="prev-h"><span class="tag gold">${esc(ev.title)}</span><span class="prev-w">${esc(ev.who)}</span></div><div class="prev-t">「${esc(ev.text)}」</div></div>`
      : P.result ? `<div class="prev mini done"><div class="prev-t">${esc(ev.title)}：${esc(P.result.choice.note)}</div></div>` : '';
    return { ...head,
      body: `${bar}<div class="cmsg ell" id="prFocus">${esc(focus)}</div>${banner || `<div class="cnote ell" id="prLine">${esc(P.lines[P.line])}</div>`}`,
      foot: `<button class="cbtn" data-act="prSkip" ${P.finishing ? 'disabled' : ''}>スキップ ▶▶</button>` };
  },
};
// 既存の「練習の成果」画面（練習報告）はそのまま使い、イベントがあった回だけ結果を1行添える
(() => {
  const base = SCREENS.log.render;
  SCREENS.log.render = (c, scr) => {
    const out = base(c, scr);
    const log = c.practices[c.practices.length - 1] || UI.lastLog;
    if (log && log.events && log.events.length) {
      out.body = out.body.replace('class="dgrid mini"', 'class="dgrid mini ev"').replace('class="growl" style="margin-top:6px"', 'class="growl" style="margin-top:2px"') +
        log.events.map(e => `<div class="prlog">⚑ ${esc(e.title)}${e.choice ? `「${esc(e.choice)}」` : ''}：${esc(e.note)}${e.delta ? `（仕上がり ${e.delta > 0 ? '+' : ''}${round1(e.delta)}）` : ''}</div>`).join('');
    }
    return out;
  };
})();

/* ---------- 操作 ---------- */
Object.assign(ACTIONS, {
  /* スキップ：演出（アニメーション）だけを省略する。練習の成果は開始時に確定済みで、
   *   ・選択肢のあるイベントが起きる回 → イベントの選択画面で止まる（選んだあと練習を終える）
   *   ・選択肢のないイベント → 結果を反映してから終える
   *   ・終了後は既存の流れどおり、クイズの回ならクイズ画面、そうでなければ練習報告へ */
  prSkip() {
    const P = UI.practicing; if (!P || P.finished || P.skipped) return;   // 連打しても1回だけ
    P.skipped = true;
    if (P.evState === 'open') { render(); return; }          // すでにイベントの選択中
    if (P.ev && !P.evState) {
      if (P.ev.choices) {
        P.elapsed = Math.max(P.elapsed, P.ev.at * P.dur); P.evState = 'open';
        if (use3D()) Stage3D.pausePractice(true);
        render(); return;
      }
      P.result = applyPracticeEvent(activeConcertById(P.cid), P.log, P.ev); P.evState = 'done';
    }
    finishPracticeSession();
  },
  // 既存の練習開始（計算は従来どおり）＋ 練習の様子の再生
  runPractice(d) {
    if (UI.practicing) return;   // 練習中は次の練習を受け付けない（重複実行の防止）
    UI.draft.menu = d.m;
    const c = activeConcert();
    const r = runPractice(c, JSON.parse(JSON.stringify(buildPlan())));
    if (r.error) { toast(r.error); return; }
    UI.lastLog = r.log;
    if (d.m === 'section') SECTIONS.forEach(s => UI.draft.sections[s.id] = autoSectionFocus(c, s.id));   // 次回用に再提案
    startPracticeSession(c, r.log);
  },
  prChoice(d) {
    const P = UI.practicing; if (!P || P.evState !== 'open') return;
    P.result = applyPracticeEvent(activeConcertById(P.cid), P.log, P.ev, d.v);
    P.evState = 'done'; P.evShownAt = P.elapsed;
    if (P.skipped) { finishPracticeSession(); return; }   // スキップ中：イベントの選択が済んだらそのまま練習を終える
    if (use3D()) Stage3D.pausePractice(false);
    const e = P.result.choice.effect || {};
    if (e.focus && P.log.sections[e.focus.sec]) setOverride(P, e.focus.sec, 4000);
    if (e.stop) P.dur = Math.min(P.dur, P.elapsed + 1500);   // 早めに切り上げる
    P.last = performance.now();
    render();
  },
});
// 別のタブから戻ったとき、練習中なら3Dの練習アニメーションを再開する
(() => {
  const base = render;
  render = function (...a) {
    base.apply(this, a);
    const P = UI.practicing;
    if (P && P.animStarted && UI.tab === 'concert' && use3D() && !Stage3D.isPracticing()) {
      Stage3D.playPractice(P.log.plan, practiceQuality(activeConcertById(P.cid)), practiceAnimOpts(P.log));
      if (P.evState === 'open') Stage3D.pausePractice(true);
      P.seg = -1; applySegment(true);
    }
  };
})();
// 新しくゲームを始めた／初期化したときは練習の進行も破棄する
['newgame', 'resetYes'].forEach(k => {
  const orig = ACTIONS[k];
  if (orig) ACTIONS[k] = function (...a) { if (UI.practicing) { clearInterval(PR_TIMER); PR_TIMER = null; if (use3D()) Stage3D.endPractice(); UI.practicing = null; } return orig.apply(this, a); };
});

/* =========================================================
 * 練習クイズ（画面）
 *   練習アニメーション → ランダムイベント → 練習終了 → クイズ → 正解・解説 → 既存の練習報告
 *   ・既存の練習の流れ（practice_ui.js）は変えず、練習の終了処理のあとにクイズ画面を重ねる。
 *     回答後「練習の報告へ」で1つ戻ると、既存の「練習の成果」画面がそのまま表示される。
 *   ・回答するまで待つ（時間制限なし）。回答前に再起動しても、演奏会タブを開くと同じ問題が出る。
 * ========================================================= */
// クイズ中は操作パネルを高くして、問題と4つの選択肢が画面内に収まるようにする（ほかの画面は従来どおり）
(() => {
  const base = panelHeight;
  panelHeight = kind => kind === 'quiz' ? Math.round(clamp((window.innerHeight || 780) * 0.6, 400, 520)) : base(kind);
})();
const quizSongTitle = id => (findSong(id) || {}).title || '';
const quizUnd = concertId => { const c = STATE.concertPrograms[concertId]; return c ? c.perf.mastery.underst : null; };
SCREENS.quiz = {
  kind: 'quiz',
  render: c => {
    const res = UI.quizResult, p = quizPending();
    if (res) {
      const item = QUIZ_INDEX[res.qid];
      return {
        crumb: `第${res.practiceNo}回の練習のあと<b>音楽クイズ</b>`, badge: `<span class="cbadge">${QUIZ_CATS[item.k]}</span>`,
        body: `<div class="qz-v ${res.correct ? 'ok' : 'ng'}"><b>${res.correct ? '○ 正解！' : '× 不正解'}</b>${res.correct && res.streak >= 2 ? `<span>${res.streak}問連続正解</span>` : ''}</div>
          <div class="qz-q sm">${esc(item.q)}</div>
          <div class="qz-a ok"><span>正解</span>${esc(res.answer)}</div>
          ${res.correct ? '' : `<div class="qz-a ng"><span>あなたの答え</span>${esc(res.picked)}</div>`}
          <div class="qz-e">${esc(item.e)}</div>
          ${res.before != null ? `<div class="qz-g">楽曲理解度 <b>+${round1(res.gain)}</b>（${round1(res.before)} → ${round1(res.after)}）${res.bonus ? '・連続正解ボーナス込み' : ''}</div>` : ''}`,
        foot: `<button class="cbtn pri big" data-act="quizDone">練習の報告へ</button>`,
      };
    }
    if (!p) return { crumb: '<b>音楽クイズ</b>', body: '<div class="cnote">出題中のクイズはありません</div>', foot: '<button class="cbtn pri big" data-act="quizDone">戻る</button>' };
    const item = QUIZ_INDEX[p.qid], und = quizUnd(p.concertId), st = ensureQuizState().streak;
    return {
      crumb: `第${p.practiceNo}回の練習のあと<b>音楽クイズ</b>`, badge: `<span class="cbadge">${QUIZ_CATS[item.k]}</span>`,
      body: `<div class="qz-song"><span class="ell">『${esc(quizSongTitle(p.songId))}』</span><span>${und != null ? `楽曲理解度 ${Math.round(und)}` : ''}${st ? `・${st}問連続正解中` : ''}</span></div>
        <div class="qz-q">${esc(item.q)}</div>
        <div class="qz-ch">${p.order.map((o, i) => `<button class="qz-c" data-act="quizAnswer" data-v="${i}"><i>${'ABCD'[i]}</i><span>${esc(item.c[o])}</span></button>`).join('')}</div>`,
    };
  },
};

Object.assign(ACTIONS, {
  quizAnswer(d) {
    if (UI.quizResult || !quizPending()) return;   // 二重回答の防止
    UI.quizResult = answerQuiz(Number(d.v));
    render();
  },
  quizDone() {
    UI.quizResult = null;
    if (cmdTop().s === 'quiz') cmdBack();
    render();
  },
});
// 練習の終了処理（既存）のあとに、出題回ならクイズ画面を重ねる
(() => {
  const base = finishPracticeSession;
  finishPracticeSession = function (...a) {
    base.apply(this, a);
    if (quizPending() && cmdTop().s !== 'quiz') { cmdGo({ s: 'quiz' }); if (UI.tab === 'concert') render(); }
  };
})();
// 回答前に再起動した場合など：演奏会タブを開いたとき、出題待ちの問題があればクイズ画面を出す
(() => {
  const base = render;
  render = function (...a) {
    if (UI.tab === 'concert' && STATE && STATE.quiz && STATE.quiz.pending && quizPending() && !UI.practicing && !UI.showing && !UI.quizResult && typeof cmdTop === 'function' && cmdTop().s !== 'quiz') cmdGo({ s: 'quiz' });
    return base.apply(this, a);
  };
})();
// 新しくゲームを始めた／初期化したときは表示中の結果を消す
['newgame', 'resetYes'].forEach(k => {
  const orig = ACTIONS[k];
  if (orig) ACTIONS[k] = function (...a) { UI.quizResult = null; return orig.apply(this, a); };
});

/* ---------- 記録タブ：音楽クイズの記録 ---------- */
Object.assign(TSCREENS, {
  rQuiz(c, scr) {
    const q = ensureQuizState();
    const list = Object.entries(q.songs).filter(([id, s]) => findSong(id) && s.answered).sort((a, b) => b[1].answered - a[1].answered);
    const pg = tvPage(list, scr.page, tvPer(56, 44));
    return {
      parent: '記録', title: '音楽クイズの記録', badge: `<span class="tbadge">連続正解 ${q.streak}・最高 ${q.best}</span>`,
      body: `<div class="tnote">通常練習2回ごとに音楽クイズ。正解するとその演奏会の楽曲理解度が上がります（不正解でも少し上がります）。</div>` +
        (pg.items.map(([id, s]) => tvRow('tgo', tvGo('rQuizSong', `data-id="${id}"`), esc(findSong(id).title), `${esc(findSong(id).composer)}・出題済み ${s.asked.length}問`, `<span class="tr-r">${s.correct}/${s.answered}問正解</span>`)).join('') || '<div class="tempty">まだクイズに回答していません</div>'),
      foot: tvPager(pg) || '',
    };
  },
  rQuizSong(c, scr) {
    const s = quizSong(scr.id), song = findSong(scr.id), tiers = quizTiers(scr.id), q = ensureQuizState();
    const recent = q.history.filter(h => h.songId === scr.id).slice(-3).reverse();
    return {
      parent: '音楽クイズの記録', title: esc(song.title),
      body: `${kv('回答', `${s.answered}問（正解 ${s.correct}問）`)}${kv('出題済み', `${s.asked.length}問／この曲・作曲家・一般 あわせて${tiers.flat().length}問`)}` +
        (recent.length ? `<div class="tlabel">最近の回答</div>` + recent.map(h => `<div class="tline"><span><b class="${h.correct ? 'pos' : 'neg'}">${h.correct ? '○' : '×'}</b> ${esc(QUIZ_INDEX[h.qid] ? QUIZ_INDEX[h.qid].q : '')}</span><b class="pos">理解度 +${h.gain}</b></div>`).join('') : ''),
    };
  },
});

/* =========================================================
 * ページ全体のスクロール・拡大の禁止（全タブ共通）
 *   ブラウザ標準のスクロール／ピンチ拡大／ダブルタップ拡大／端でのバウンス／
 *   Ctrl+ホイール・Ctrl+＋− による拡大を止める。
 *   ゲーム内の操作（ボタン、ウインドウのドラッグなど pointer イベントで作られた操作、
 *   内部でスクロールするよう作られた領域）は妨げない。
 * ========================================================= */
(() => {
  const opt = { passive: false };
  // 指の動きを内部でスクロールさせてよい要素か（ゲームが意図してスクロール可能にしている領域）
  function scrollableAncestor(el, dx, dy) {
    for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      if (!(el instanceof Element)) continue;
      const cs = getComputedStyle(el);
      const oy = /(auto|scroll)/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 1;
      const ox = /(auto|scroll)/.test(cs.overflowX) && el.scrollWidth > el.clientWidth + 1;
      if (oy && Math.abs(dy) >= Math.abs(dx)) {
        // 端に達している方向へは動かさない（ページへの連鎖・バウンスを防ぐ）
        if ((dy > 0 && el.scrollTop <= 0) || (dy < 0 && el.scrollTop + el.clientHeight >= el.scrollHeight - 1)) return null;
        return el;
      }
      if (ox && Math.abs(dx) > Math.abs(dy)) {
        if ((dx > 0 && el.scrollLeft <= 0) || (dx < 0 && el.scrollLeft + el.clientWidth >= el.scrollWidth - 1)) return null;
        return el;
      }
    }
    return null;
  }
  let sx = 0, sy = 0;
  document.addEventListener('touchstart', e => {
    if (e.touches.length > 1) { e.preventDefault(); return; }   // 2本指＝ピンチ拡大の開始
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, opt);
  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1 || (typeof e.scale === 'number' && e.scale !== 1)) { e.preventDefault(); return; }
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (!scrollableAncestor(e.target, dx, dy)) e.preventDefault();   // ページのスクロール・バウンスを止める
  }, opt);
  // iOS Safari のピンチ拡大（独自のジェスチャーイベント）
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), opt));
  // ダブルタップ拡大（CSS の touch-action:manipulation が主。dblclick は念のため既定動作だけ止める）
  document.addEventListener('dblclick', e => e.preventDefault(), opt);
  // PC：Ctrl（⌘）＋ホイール、Ctrl（⌘）＋ ＋/−/0 による拡大縮小
  window.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, opt);
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', ';', '_'].includes(e.key)) e.preventDefault();
  });
  // それでもページがずれた場合（入力欄のフォーカスなど）は元の位置に戻す
  window.addEventListener('scroll', () => {
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;   // 入力中のキーボード表示は妨げない
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
  }, { passive: true });
})();

</script></body></html>
