function generateLook(seedStr, name) {
  const r = seededRng(hashStr(seedStr));
  const given = (name || '').split(' ')[1] || '';
  const fem = FEMININE_GIVEN.has(given) ? true : given ? false : r() < 0.5;
  const P = LOOK_PARTS;
  const hairF = ['bob', 'long', 'ponytail', 'bun', 'wavy', 'short'], hairM = ['short', 'side', 'crop', 'wavy', 'side', 'crop'];
  const hair = (fem ? hairF : hairM)[Math.floor(r() * 6)];
  const hc = r(); const hairColor = hc < 0.38 ? 0 : hc < 0.62 ? 1 : hc < 0.78 ? 2 : hc < 0.86 ? 3 : hc < 0.92 ? 4 : hc < 0.96 ? 5 : hc < 0.98 ? 6 : 7;
  const st = r();
  const style = fem ? (st < 0.7 ? 'dress' : 'suit') : (st < 0.75 ? 'tux' : 'suit');
  return {
    hair, hairColor, skin: Math.floor(r() * P.skins.length), face: Math.floor(r() * P.faces), glasses: r() < 0.18,
    build: Math.round((0.92 + r() * 0.18) * 100) / 100, height: Math.round((0.95 + r() * 0.1) * 100) / 100, style,
  };
}
function ensureLooks() {
  for (const m of STATE.members) if (!m.look) m.look = generateLook(m.id + m.name, m.name);
  for (const c of STATE.conductors || []) if (!c.look) c.look = generateLook(c.id + c.name, c.name);
}

// ランダム生成：同じランクでも得意・不得意が出るよう、得意2つ・苦手1つを設定
function generateMember(inst, rank, joined) {
  const base = CONFIG.rankBaseLevel[rank] + rnd(-3, 3);
  const ids = ABILITIES.map(a => a.id);
  const strong = [], weak = [];
  const shuffled = ids.slice().sort(() => Math.random() - 0.5);
  strong.push(shuffled[0], shuffled[1]); weak.push(shuffled[2]);
  const abilities = {}, potential = {};
  const growthRoom = rank === 'S' ? 10 : rank === 'A' ? 16 : 24;
  for (const id of ids) {
    let v = base + rnd(-7, 7);
    if (strong.includes(id)) v += rnd(6, 13);
    if (weak.includes(id)) v -= rnd(6, 12);
    v = Math.round(clamp(v, 5, 98));
    abilities[id] = v;
    potential[id] = Math.round(clamp(v + rnd(3, growthRoom) + (Math.random() < 0.15 ? rnd(8, 20) : 0), v, 100));
  }
  const m = { id: newId('m'), name: randomName(), inst, abilities, potential, joined, original: false, profile: '' };
  m.look = generateLook(m.id + m.name, m.name);
  return m;
}

function makeOriginal(oc, joined) {
  const abilities = {}, potential = {};
  ABILITIES.forEach((a, i) => { abilities[a.id] = oc.abilities[i]; potential[a.id] = oc.potential[i]; });
  return { id: newId('m'), oid: oc.oid, name: oc.name, inst: oc.inst, abilities, potential, joined, original: true, profile: oc.profile,
    look: { ...(oc.look || generateLook(oc.oid, oc.name)) } };
}

function hireCost(m) {
  if (m.original) { const oc = ORIGINAL_CHARACTERS.find(o => o.oid === m.oid); if (oc?.cost) return oc.cost; }
  const room = Math.max(0, memberPotAvg(m) - memberAvg(m));
  return Math.round((CONFIG.hireCost[memberRank(m)] + room * CONFIG.hirePotentialFactor) / 1000) * 1000;
}

function countByInst() {
  const c = Object.fromEntries(INSTRUMENTS.map(i => [i.id, 0]));
  for (const m of STATE.members) c[m.inst]++;
  return c;
}
const membersOfSection = sec => STATE.members.filter(m => INST[m.inst].section === sec);

/* ---------- 首席奏者（各楽器に1名） ---------- */
const principalOf = inst => STATE.members.find(m => m.id === (STATE.principals || {})[inst]) || null;
const isPrincipal = m => !!m && (STATE.principals || {})[m.inst] === m.id;
// 首席はプレイヤーが任命する。ここでは「首席が不在」の楽器だけを補う（任命済みの首席は能力に関係なく維持する）。
//   ・団員の採用で、その楽器に初めて団員が入ったとき
//   ・首席が退団したとき（後任の自動任命）
//   ・セーブデータ読み込み時に、首席が存在しない／別の楽器の団員になっている不整合を直すとき
function ensurePrincipals() {
  STATE.principals = STATE.principals || {};
  for (const k of Object.keys(STATE.principals)) if (!INST[k]) delete STATE.principals[k];
  for (const ins of INSTRUMENTS) {
    const cur = STATE.members.find(m => m.id === STATE.principals[ins.id] && m.inst === ins.id);
    if (cur) continue;
    const best = STATE.members.filter(m => m.inst === ins.id).sort((a, b) => memberAvg(b) - memberAvg(a))[0];
    if (best) STATE.principals[ins.id] = best.id; else delete STATE.principals[ins.id];
  }
}
// 同じ楽器の団員なら能力に関係なく誰でも任命できる。首席は楽器ごとに1名（前の首席は自動的に通常団員に戻る）
function setPrincipal(memberId, inst) {
  const m = STATE.members.find(x => x.id === memberId); if (!m) return false;
  if (inst && m.inst !== inst) return false;   // 他の楽器の団員は任命できない
  STATE.principals = STATE.principals || {};
  STATE.principals[m.inst] = m.id; save(); return true;
}
// 除籍できない理由（首席奏者は、同じ楽器の別の団員を首席にしてからでないと除籍できない）
function dismissBlockReason(m) {
  if (!m) return '対象の団員がいません';
  if (isPrincipal(m) && STATE.members.some(x => x.inst === m.inst && x.id !== m.id))
    return '首席奏者はそのまま除籍できません。先に別の団員を首席に任命してください。';
  return null;
}

/* ---------- セクション基礎能力（内部値） ---------- */
function sectionBase(secId) {
  const ms = membersOfSection(secId);
  const out = {};
  if (!ms.length) { SECTION_PARAMS.forEach(p => out[p.id] = 0); return out; }
  const std = SEC[secId].insts.reduce((s, i) => s + INST[i].std, 0);
  const headF = CONFIG.sectionBase.headcountFloor + (1 - CONFIG.sectionBase.headcountFloor) * Math.min(1, ms.length / std);
  // 首席奏者はセクションを率いるため重く数える
  const w = ms.map(m => isPrincipal(m) ? CONFIG.principal.baseWeight : 1), ws = w.reduce((a, b) => a + b, 0);
  for (const a of ABILITIES) out[a.param] = ms.reduce((acc, m, i) => acc + m.abilities[a.id] * w[i], 0) / ws * headF;
  // 統一感：協調性の平均から、団員の総合力のばらつきを差し引く
  out.unity -= stdev(ms.map(memberAvg)) * CONFIG.sectionBase.unitySpreadPenalty;

const allSectionBases = () => Object.fromEntries(SECTIONS.map(s => [s.id, sectionBase(s.id)]));
const orchestraAbility = id => mean(STATE.members.map(m => m.abilities[id]));

/* ---------- 募集（演奏会の進行から独立。団員タブからいつでも実行） ----------
 * 状態は STATE.recruit に保持し、演奏会データ（concertPrograms）には一切触れない。

  return true;

  const inOrch = new Set(STATE.members.filter(m => m.oid).map(m => m.oid));
  const list = [];
  for (let i = 0; i < CONFIG.recruitCandidates; i++) {
    const avail = ORIGINAL_CHARACTERS.filter(o => !o.initial && !inOrch.has(o.oid) && !list.some(x => x.oid === o.oid));
    if (avail.length && Math.random() < CONFIG.originalCandidateChance) {
      const m = makeOriginal(pick(avail), joinIndex()); m.cost = hireCost(m); list.push(m); continue;

  if (have >= INST[cand.inst].cap) return `${INST[cand.inst].abbr} は在籍上限（${INST[cand.inst].cap}名）に達しています`;
  if (STATE.funds < cand.cost) return `資金不足（あと ¥${(cand.cost - STATE.funds).toLocaleString('ja-JP')}）`;

  if (!cand || hireBlockReason(cand)) return false;
  spendGeneral(`採用費（${cand.name}・${INST[cand.inst].abbr}）`, cand.cost);
  const m = { ...cand, abilities: { ...cand.abilities }, potential: { ...cand.potential }, joined: joinIndex() };
  delete m.cost;
  STATE.members.push(m);

  STATE.members = STATE.members.filter(m => m.id !== memberId);
  if (STATE.members.length === before) return false;

  save(); return true;
}

/* =========================================================
 * 演奏会の準備（選曲・会場の予約・指揮者の選択）

/* ---------- 演奏会の準備（選曲・会場の予約・指揮者の選択。順不同） ---------- */
const inSetup = c => c.phase === 'setup';
function startSetup(c) { if (inSetup(c) && !c.started) { c.started = true; save(); } }

function hallBlockReason(c, hall) {
  if (!inSetup(c)) return '会場は演奏会の準備中にのみ予約できます';
  if (c.hallId === hall.id) return '予約済みの会場です';
  const refund = c.hallId ? findHall(c.hallId).fee : 0;
  if (hall.fee > 0 && STATE.funds + refund < hall.fee) return `資金不足（あと ¥${(hall.fee - STATE.funds - refund).toLocaleString('ja-JP')}）`;
  return null;
}
function selectHall(c, hallId) {
  const hall = findHall(hallId);
  if (!hall || hallBlockReason(c, hall)) return false;
  if (c.hallId) { const old = findHall(c.hallId); if (old.fee) earn(c, `予約取消・返金（${old.name}）`, old.fee); }
  spend(c, `ホール使用料（${hall.name}）`, hall.fee);
  c.hallId = hallId; c.started = true;
  save(); return true;
}
// 今回の演奏会を担当する指揮者（契約中の最大3名から1名）
function selectConcertConductor(c, id) {
  if (!inSetup(c) || !(STATE.conductors || []).some(x => x.id === id)) return false;
  c.conductorId = id; STATE.conductorId = id; c.started = true;
  save(); return true;
}
function setupStatus(c) {
  const song = !!(c.songId && findSong(c.songId));
  const hall = !!(c.hallId && findHall(c.hallId));
  const conductor = !!(c.conductorId && (STATE.conductors || []).some(x => x.id === c.conductorId));
  return { song, hall, conductor, ready: song && hall && conductor };
}
// 3項目がそろったら練習期間へ（ここから先は従来どおり）
function startPractice(c) {
  if (!inSetup(c) || !setupStatus(c).ready) return false;
  STATE.conductorId = c.conductorId;
  c.phase = 'practice';
  save(); return true;
}

/* =========================================================
 * 指揮者（採用・変更・育成・成長）
 * ========================================================= */
/* ---------- 指揮者（採用・変更・育成・成長） ---------- */
const condAvg = c => mean(CONDUCTOR_ABILITIES.map(a => c.abilities[a.id]));
const condPotAvg = c => mean(CONDUCTOR_ABILITIES.map(a => c.potential[a.id]));
function condRank(c) { for (const [r, t] of CONFIG.conductor.rankThresholds) if (condAvg(c) >= t) return r; return 'E'; }
const entityAvg = e => mean(Object.values(e.abilities));
function makeConductor(o) {
  const abilities = {}, potential = {};
  CONDUCTOR_ABILITIES.forEach((a, i) => { abilities[a.id] = Array.isArray(o.abilities) ? o.abilities[i] : o.abilities[a.id]; potential[a.id] = Array.isArray(o.potential) ? o.potential[i] : o.potential[a.id]; });
  const c = { id: newId('k'), oid: o.oid || null, name: o.name, abilities, potential, trait: o.trait, founder: !!o.founder,
    original: !!o.oid, profile: o.profile || '', joined: STATE.concertOrder ? STATE.concertOrder.length : 0, concerts: 0 };
  c.look = o.look ? { ...o.look } : generateLook(c.id + c.name, c.name);
  return c;
}
function generateConductor(rank) {
  const base = CONFIG.rankBaseLevel[rank] + rnd(-3, 3);
  const ab = [], pot = [];
  CONDUCTOR_ABILITIES.forEach(() => { const v = Math.round(clamp(base + rnd(-9, 9), 10, 96)); ab.push(v); pot.push(Math.round(clamp(v + rnd(5, rank === 'S' ? 10 : 26), v, 100))); });
  const t = pick(CONDUCTOR_TRAITS);
  return makeConductor({ name: randomName(), abilities: ab, potential: pot, trait: t.id, profile: `${t.name}の指揮者。${t.desc}` });
}
function conductorHireCost(c) {
  const oc = c.oid && ORIGINAL_CONDUCTORS.find(o => o.oid === c.oid);
  if (oc?.cost) return oc.cost;
  const room = Math.max(0, condPotAvg(c) - condAvg(c));
  return Math.round((CONFIG.conductor.hireCost[condRank(c)] + room * CONFIG.conductor.hirePotentialFactor) / 1000) * 1000;
}
// 1演奏会ごとの出演料（創設以来の常任指揮者は無償）
function conductorFee(c) {
  if (!c || c.founder) return 0;
  const K = CONFIG.conductor;
  return Math.max(K.feeMin, Math.round(Math.max(0, condAvg(c) - K.feeBase) * K.feePerPoint / 1000) * 1000);
}
// 現在の演奏会に担当指揮者が決まっていればその指揮者、なければ楽団の既定（前回の担当）
function activeConductor() {
  const cs = STATE.conductors || [];
  const cc = STATE.concertPrograms && STATE.concertPrograms[STATE.activeConcertId];
  const id = cc && cc.conductorId && cs.some(x => x.id === cc.conductorId) ? cc.conductorId : STATE.conductorId;
  return cs.find(x => x.id === id) || null;
}
function generateConductorCandidates() {
  const owned = new Set((STATE.conductors || []).map(c => c.oid).filter(Boolean));
  const list = [];
  for (let i = 0; i < CONFIG.conductor.candidates; i++) {
    const avail = ORIGINAL_CONDUCTORS.filter(o => !o.founder && !owned.has(o.oid) && !list.some(x => x.oid === o.oid));
    const c = avail.length && Math.random() < CONFIG.conductor.originalChance ? makeConductor(pick(avail)) : generateConductor(weightedPick(CONFIG.conductor.rankWeights));
    c.cost = conductorHireCost(c); list.push(c);
  }
  STATE.conductorMarket = { candidates: list, hired: [] };
}
function conductorHireBlockReason(cand) {
  if (STATE.conductorMarket.hired.includes(cand.id)) return '契約済み';
  if (STATE.conductors.length >= CONFIG.conductor.maxHired) return `契約できる指揮者は${CONFIG.conductor.maxHired}名までです`;
  if (STATE.funds < cand.cost) return `資金不足（あと ¥${(cand.cost - STATE.funds).toLocaleString('ja-JP')}）`;
  return null;
}
function hireConductor(candId) {
  const cand = STATE.conductorMarket.candidates.find(x => x.id === candId);
  if (!cand || conductorHireBlockReason(cand)) return false;
  spendGeneral(`指揮者の契約金（${cand.name}）`, cand.cost);
  const c = { ...cand, abilities: { ...cand.abilities }, potential: { ...cand.potential }, look: { ...cand.look }, joined: STATE.concertOrder.length };
  delete c.cost;
  STATE.conductors.push(c);
  STATE.conductorMarket.hired.push(cand.id);
  save(); return true;
}
function rerollConductors() {
  if (STATE.funds < CONFIG.conductor.rerollCost) return false;
  spendGeneral('指揮者候補の再調査', CONFIG.conductor.rerollCost);
  generateConductorCandidates(); save(); return true;
}
// 団員タブからの担当変更：準備中なら今回の演奏会にも反映、練習開始後は次回からの既定になる
function setActiveConductor(id) {
  if (!STATE.conductors.some(c => c.id === id)) return false;
  STATE.conductorId = id;
  const c = activeConcert(); if (c && inSetup(c)) c.conductorId = id;
  save(); return true;
}
function dismissConductorBlockReason(id) {
  if (STATE.conductors.length <= 1) return '指揮者が1名だけのため契約を解除できません';
  const c = activeConcert();
  if (c && c.conductorId === id && c.phase !== 'done') return '今回の演奏会の担当指揮者は解除できません';
  if (STATE.conductorId === id) return '現在の担当指揮者は解除できません（先に担当を変更してください）';
  return null;
}
function dismissConductor(id) {
  if (dismissConductorBlockReason(id)) return false;
  STATE.conductors = STATE.conductors.filter(c => c.id !== id); save(); return true;
}
// 演奏会の経験による成長（潜在能力を超えない）
function conductorGrowthAfterConcert(cd) {
  const out = [];
  if (!cd) return out;
  cd.concerts = (cd.concerts || 0) + 1;
  for (const a of CONDUCTOR_ABILITIES) {
    const gap = cd.potential[a.id] - cd.abilities[a.id];
    if (gap <= 0 || Math.random() >= CONFIG.conductor.growthChance) continue;
    const inc = Math.min(gap, randInt(1, 2));
    out.push({ abil: a.id, from: cd.abilities[a.id], to: cd.abilities[a.id] + inc });
    cd.abilities[a.id] += inc;
  }
  return out;
}
// 指揮者能力の効果（50 を基準とした差分）
function conductorEffect(policyId) {
  const cd = activeConductor(), K = CONFIG.conductor;
  if (!cd) return { composite: 0, tech: 0, expr: 0, ens: 0, tutti: 1, underst: 1, attendance: 0, prob: 0, evalBonus: 0 };
  const a = cd.abilities, tr = CTRAIT[cd.trait] || {};
  const match = tr.policy && tr.policy === policyId;
  return {
    composite: (mean([a.lead, a.interp, a.baton]) - 50) * K.compositeWeight,
    tech: (a.baton - 50) * K.evalWeight, expr: (a.interp - 50) * K.evalWeight, ens: (a.lead - 50) * K.evalWeight,
    tutti: (1 + (a.lead - 50) * K.practiceWeight) * (tr.practice || 1),
    underst: 1 + (a.interp - 50) * K.practiceWeight,
    attendance: (a.charisma - 50) * K.attendancePerPoint,
    prob: match ? K.traitProb : 0, evalBonus: match ? K.traitEval : 0,
  };
}

/* =========================================================
 * 育成（資金で団員・指揮者の能力を伸ばす）
 * ========================================================= */
/* ---------- 育成（資金で団員の能力を伸ばす） ---------- */
const findTraining = id => CONFIG.trainings.find(t => t.id === id);
function trainingTargets(t, targetId) {
  if (t.target === 'section') return membersOfSection(targetId);
  if (t.target === 'conductor') { const c = (STATE.conductors || []).find(x => x.id === targetId); return c ? [c] : []; }
  const m = STATE.members.find(x => x.id === targetId); return m ? [m] : [];
}
function trainingCost(t, targetId) {
  if (t.id === 'instrument') {
    const m = STATE.members.find(x => x.id === targetId); if (!m) return 0;
    const next = CONFIG.instrumentGrades[(m.instrumentGrade || 0) + 1];
    return next ? next.cost : 0;
  }
  const ms = trainingTargets(t, targetId);
  const lv = t.cost.levelFactor ? t.cost.levelFactor * mean(ms.map(entityAvg)) : 0;
  return Math.round((t.cost.base + t.cost.perMember * ms.length + lv) / 1000) * 1000;
}
function trainingGains(t, m) {
  if (t.id === 'instrument') return (CONFIG.instrumentGrades[(m.instrumentGrade || 0) + 1] || {}).gains || {};
  return t.gains;
}
function hasRoom(t, ms, ability) {
  return ms.some(m => {
    if (t.chooseAbility) return m.potential[ability] > m.abilities[ability] || ABILITIES.some(a => m.potential[a.id] > m.abilities[a.id]);
    return Object.keys(trainingGains(t, m)).some(a => m.potential[a] > m.abilities[a]);
  });
}
function trainingBlockReason(c, tId, targetId, ability) {
  const t = findTraining(tId);
  if (!t) return '育成方法を選んでください';
  if (c.phase === 'result' || c.phase === 'done') return '次の演奏会のサイクルで実施できます';
  if (!targetId) return t.target === 'section' ? 'セクションを選んでください' : t.target === 'conductor' ? '指揮者を選んでください' : '団員を選んでください';
  const ms = trainingTargets(t, targetId);
  if (!ms.length) return t.target === 'section' ? 'このセクションには団員がいません' : t.target === 'conductor' ? '指揮者が見つかりません' : '団員が見つかりません';
  if (t.chooseAbility && !ability) return '伸ばす能力を選んでください';
  if (t.limit === 'concert' && c.trainingUsed[`${t.id}:${targetId}`]) return '今回の演奏会ではすでに実施しました';
  if (t.id === 'instrument' && !CONFIG.instrumentGrades[(ms[0].instrumentGrade || 0) + 1]) return 'すでに最高グレードの楽器です';
  if (!hasRoom(t, ms, ability)) return '潜在能力の上限に達していて伸びしろがありません';
  const cost = trainingCost(t, targetId);
  if (STATE.funds < cost) return `資金不足（あと ¥${(cost - STATE.funds).toLocaleString('ja-JP')}）`;
  return null;
}
function applyGain(c, m, abil, amount, out) {
  const gap = m.potential[abil] - m.abilities[abil];
  const inc = Math.min(amount, gap);
  if (inc <= 0) return;
  const from = m.abilities[abil];
  m.abilities[abil] = from + inc;   // 潜在能力を超えない
  c.growth[m.id] = c.growth[m.id] || {};
  c.growth[m.id][abil] = (c.growth[m.id][abil] || 0) + inc;
  out.push({ id: m.id, name: m.name, abil, from, to: from + inc });
}
function runTraining(c, tId, targetId, ability) {
  const err = trainingBlockReason(c, tId, targetId, ability);
  if (err) return { error: err };
  const t = findTraining(tId);
  const ms = trainingTargets(t, targetId);
  const cost = trainingCost(t, targetId);
  const targetName = t.target === 'section' ? `${SEC[targetId].name}セクション` : ms[0].name;
  spend(c, `${t.name}（${targetName}）`, cost);
  const gains = [];
  let extra = '';
  for (const m of ms) {
    if (t.chooseAbility) {
      const [fa, fb] = t.gains._focus; applyGain(c, m, ability, randInt(fa, fb), gains);
      const [oa, ob, op] = t.gains._other;
      const others = ABILITIES.map(a => a.id).filter(a => a !== ability && m.potential[a] > m.abilities[a]);
      if (others.length && Math.random() < op) applyGain(c, m, pick(others), randInt(oa, ob), gains);
    } else {
      for (const [abil, [a, b, p]] of Object.entries(trainingGains(t, m))) if (Math.random() < p) applyGain(c, m, abil, randInt(a, b), gains);
    }
  }
  if (t.id === 'instrument') {
    const m = ms[0]; m.instrumentGrade = (m.instrumentGrade || 0) + 1;
    extra = `${m.name}の楽器が「${CONFIG.instrumentGrades[m.instrumentGrade].name}」になった。`;
  }
  if (t.limit === 'concert') c.trainingUsed[`${t.id}:${targetId}`] = true;
  const entry = { tId, name: t.name, message: t.message, target: targetName, cost, gains, extra, ability: ability || null };
  c.trainingLog.push(entry);
  save();
  return entry;
}

/* =========================================================
 * 練習（通常練習・ホール練習の成果の計算）
 * ========================================================= */
/* ---------- 練習（発表会の仕上がりのみ。団員の恒久的な能力は上がらない） ---------- */
const eff = base => CONFIG.practice.effMin + base / CONFIG.practice.effDiv;
const dim = cur => 1 / (1 + Math.max(0, cur) / CONFIG.practice.diminishScale);
const noise = () => rnd(CONFIG.practice.randomMin, CONFIG.practice.randomMax);
const capPerf = v => Math.min(v, CONFIG.practice.perfCap * 1.2);
const difficultyFactor = song => 1.25 - song.difficulty / 160;

function emptyFocus() { return Object.fromEntries(FOCUS.map(f => [f.id, 0])); }
function focusValid(f) { return f && FOCUS.reduce((s, x) => s + (f[x.id] || 0), 0) === CONFIG.focusPoints && FOCUS.every(x => (f[x.id] || 0) >= 0); }

function autoSectionFocus(c, secId) {
  const base = sectionBase(secId), cur = c.perf.sections[secId];
  const done = c.practiceDone / CONFIG.practiceCount;
  const scored = SECTION_PARAMS.map(p => ({
    p: p.id,
    // 低い項目ほど・基礎能力に対して伸び代がある項目ほど優先
    k: (100 - cur[p.id]) * (0.6 + base[p.id] / 100) - Math.max(0, cur[p.id] - (base[p.id] * 0.9 + 10 * done)) + rnd(0, 6),
  })).sort((a, b) => b.k - a.k);
  const f = emptyFocus();
  const pToF = Object.fromEntries(FOCUS.filter(x => x.param).map(x => [x.param, x.id]));
  f[pToF[scored[0].p]] += 4; f[pToF[scored[1].p]] += 3; f[pToF[scored[2].p]] += 3;
  return f;
}
function autoTuttiFocus(c) {
  const ov = effectiveOverall(c);
  const m = c.perf.mastery;
  const f = emptyFocus();
  const cand = [
    ['ens', 100 - ov.ensemble], ['dyn', 100 - ov.balance], ['expr', 100 - ov.unity],
    ['underst', 100 - m.underst], ['tech', 100 - m.comp],
  ].map(([k, v]) => [k, v + rnd(0, 8)]).sort((a, b) => b[1] - a[1]);
  f[cand[0][0]] += 4; f[cand[1][0]] += 3; f[cand[2][0]] += 3;
  return f;
}

function trySongParamGrowth(c, songId, weights, chanceBase, log) {
  const sp = songParam(songId);
  const param = weightedPick(weights);
  const p = chanceBase / (1 + sp[param] / CONFIG.songParam.diminishScale);
  if (Math.random() >= p) return;
  sp[param] += 1;
  c.songGrowth[songId] = c.songGrowth[songId] || {};
  c.songGrowth[songId][param] = (c.songGrowth[songId][param] || 0) + 1;
  log.songParams.push({ songId, param, to: sp[param] });
}
// ポイントの効き方は逓減（1項目への極端な集中より、配分した方が効率的）
const ptsEff = pts => pts > 0 ? CONFIG.focusPoints * Math.pow(pts / CONFIG.focusPoints, CONFIG.practice.pointsExponent) : 0;
// 1回の上昇量にも逓減を適用（上昇の途中で伸びにくくなる効果を近似）
const settle = (g0, cur) => g0 * dim(cur + g0 / 2) / dim(cur);
function addSec(c, log, sec, param, gain) {
  if (gain <= 0) return;
  const before = c.perf.sections[sec][param];
  gain = settle(gain, before);
  c.perf.sections[sec][param] = capPerf(before + gain);
  log.sections[sec] = log.sections[sec] || {};
  log.sections[sec][param] = (log.sections[sec][param] || 0) + (c.perf.sections[sec][param] - before);
}
function addOverall(c, log, key, gain) {
  if (gain <= 0) return;
  gain = settle(gain, c.perf.overall[key]);
  c.perf.overall[key] = capPerf(c.perf.overall[key] + gain);
  log.overall[key] = (log.overall[key] || 0) + gain;
}
function addMastery(c, log, key, gain) {
  if (gain <= 0) return;
  gain = settle(gain, c.perf.mastery[key]);
  c.perf.mastery[key] = capPerf(c.perf.mastery[key] + gain);
  log.mastery[key] = (log.mastery[key] || 0) + gain;
}

/**
 * plan = { menu: 'tutti'|'section'|'individual',
 *          focus: {...},                  // tutti / individual
 *          sections: { hs:{...}, ... },     // section
 *          members: [memberId...] }         // individual
 */
function validatePlan(c, plan) {
  if (c.phase !== 'practice') return '今は練習期間ではありません';
  if (c.practiceDone >= CONFIG.practiceCount) return '通常練習はすべて終了しました';
  if (plan.menu === 'section') {
    for (const s of SECTIONS) if (!focusValid(plan.sections?.[s.id])) return `${s.name}の配分が${CONFIG.focusPoints}ポイントになっていません`;
  } else if (plan.menu === 'tutti' || plan.menu === 'individual') {
    if (!focusValid(plan.focus)) return `重点項目の配分を合計${CONFIG.focusPoints}ポイントにしてください`;
    if (plan.menu === 'individual') {
      if (!plan.members?.length) return '対象の団員を選んでください';
      if (plan.members.length > CONFIG.individualMaxTargets) return `対象は${CONFIG.individualMaxTargets}名までです`;
    }
  } else return '練習メニューを選んでください';
  return null;
}

function runPractice(c, plan) {
  const err = validatePlan(c, plan); if (err) return { error: err };
  const P = CONFIG.practice;
  const bases = allSectionBases();
  const log = { no: c.practiceDone + 1, menu: plan.menu, plan: JSON.parse(JSON.stringify(plan)), sections: {}, overall: {}, mastery: {}, songParams: [] };
  const present = SECTIONS.filter(s => membersOfSection(s.id).length).map(s => s.id);
  const song = findSong(c.songId);
  const used = songSections(song);
  const m = c.perf.mastery;

  if (plan.menu === 'section') {
    for (const sec of present) {
      const f = plan.sections[sec];
      for (const fo of FOCUS) {
        const pts = f[fo.id]; if (!pts) continue;
        if (fo.param) addSec(c, log, sec, fo.param, P.kSection * ptsEff(pts) * eff(bases[sec][fo.param]) * dim(c.perf.sections[sec][fo.param]) * noise());
        if (fo.id === 'ens') addOverall(c, log, 'unity', 0.12 * pts * eff(bases[sec].unity) * dim(c.perf.overall.unity) * noise());
        if (fo.id === 'underst' && used.includes(sec)) addMastery(c, log, 'underst', 0.35 * pts * eff(bases[sec].expr) * dim(m.underst) * noise());
      }
      // 楽曲完成度（その曲で使うセクションの練習が効く）
      if (used.includes(sec)) {
        const techPts = 10 - (f.underst || 0);
        addMastery(c, log, 'comp', P.kSectionMastery * techPts / 10 * eff(mean(Object.values(bases[sec]))) * dim(m.comp) * difficultyFactor(song) * noise());
      }
    }
  }

  if (plan.menu === 'tutti') {
    const f = plan.focus;
    const ce = conductorEffect(c.policy);   // 指揮者の統率力・解釈力が合奏の効率を左右する
    for (const sec of present) for (const fo of FOCUS) {
      const pts = f[fo.id]; if (!pts || !fo.param) continue;
      addSec(c, log, sec, fo.param, ce.tutti * P.kTuttiSection * ptsEff(pts) * eff(bases[sec][fo.param]) * dim(c.perf.sections[sec][fo.param]) * noise());
    }
    const rc = mean([orchestraAbility('rhythm'), orchestraAbility('coop')]);
    const ec = mean([orchestraAbility('expr'), orchestraAbility('coop')]);
    addOverall(c, log, 'ensemble', ce.tutti * (P.kTuttiBaseEnsemble + P.kTuttiOverall * 0.35 * (f.ens + 0.4 * f.rhythm)) * eff(rc) * dim(c.perf.overall.ensemble) * noise());
    addOverall(c, log, 'unity', ce.tutti * (1.2 + P.kTuttiOverall * 0.3 * (0.6 * f.ens + 0.6 * f.expr + 0.3 * f.underst)) * eff(ec) * dim(c.perf.overall.unity) * noise());
    addOverall(c, log, 'balance', P.kTuttiOverall * 0.25 * f.dyn * eff(orchestraAbility('dyn')) * dim(c.perf.overall.balance) * noise());
    const avgAll = mean(STATE.members.map(memberAvg));
    const compPts = f.tech + f.pitch + f.rhythm + 0.8 * f.ens + 0.4 * (f.tone + f.dyn) + 2;
    const undPts = 1.5 * f.underst + 0.8 * f.expr + 1;
    addMastery(c, log, 'comp', P.kMastery * 0.35 * compPts * eff(avgAll) * dim(m.comp) * difficultyFactor(song) * noise());
    addMastery(c, log, 'underst', ce.underst * P.kMastery * 0.35 * undPts * eff(orchestraAbility('expr')) * dim(m.underst) * difficultyFactor(song) * noise());
    // 曲パラメータ（長期）：いずれか1項目+1の機会
    trySongParamGrowth(c, song.id, {
      base: 1 + f.tech + f.pitch + f.rhythm + f.ens, underst: 1 + f.underst * 2, expr: 1 + f.expr + f.tone + f.dyn,
    }, CONFIG.songParam.tuttiBaseChance * avgAll / 55, log);
  }

  if (plan.menu === 'individual') {
    const f = plan.focus;
    for (const id of plan.members) {
      const mem = STATE.members.find(x => x.id === id); if (!mem) continue;
      const sec = INST[mem.inst].section;
      const nSec = membersOfSection(sec).length;
      for (const fo of FOCUS) {
        const pts = f[fo.id]; if (!pts) continue;
        if (fo.param) addSec(c, log, sec, fo.param, P.kIndividualSection * ptsEff(pts) * (mem.abilities[fo.abil] / 60) * dim(c.perf.sections[sec][fo.param]) * noise() / Math.sqrt(nSec));
        if (fo.id === 'underst') addMastery(c, log, 'underst', P.kIndividualMastery * pts / 10 * (mem.abilities.expr / 60) * dim(m.underst) * noise());
      }
      // 個人の音楽性が曲の長期的な習熟（曲パラメータ）を深めることがある
      const a = mem.abilities;
      trySongParamGrowth(c, song.id, {
        base: (a.tech + a.ear) / 2, underst: (a.expr + a.coop) / 2 + f.underst * 4, expr: (a.expr + a.tone) / 2 + f.expr * 3,
      }, CONFIG.songParam.individualBaseChance * mean([a.expr, a.tone, a.ear]) / 65, log);
    }
  }

  c.practiceDone++;
  log.summary = summarizeLog(log);
  c.practices.push(log);
  if (c.practiceDone >= CONFIG.practiceCount) c.phase = 'prep';
  save();
  return { log };
}

function summarizeLog(log) {
  const menu = { tutti: '全体合奏', section: 'セクション練習', individual: '個人練習', hall: 'ホール練習' }[log.menu];
  let total = 0;
  Object.values(log.sections).forEach(o => Object.values(o).forEach(v => total += v));
  Object.values(log.overall).forEach(v => total += v);
  Object.values(log.mastery).forEach(v => total += v);
  return `${menu}：仕上がり +${round1(total)}／曲パラメータ +${log.songParams.length}`;
}

// ホール練習（任意・1回・会場の練習使用料が必要）：本番の安定性を高め、一流会場の重圧を和らげる
function rehearsalBlockReason(c) {
  if (c.phase !== 'prep') return '本番準備の段階で実施できます';
  if (c.rehearsal.done) return '実施済みです';
  const fee = concertHall(c).rehearsalFee;
  if (STATE.funds < fee) return `資金不足（あと ¥${(fee - STATE.funds).toLocaleString('ja-JP')}）`;
  return null;
}
function runHallPractice(c) {
  if (rehearsalBlockReason(c)) return null;
  const hall = concertHall(c);
  spend(c, `ホール練習（${hall.name}）`, hall.rehearsalFee);
  const log = { no: 'H', menu: 'hall', sections: {}, overall: {}, mastery: {}, songParams: [] };
  for (const s of SECTIONS) if (membersOfSection(s.id).length) {
    addSec(c, log, s.id, 'tone', rnd(0.5, 1.5)); addSec(c, log, s.id, 'dyn', rnd(0.5, 1.5));
  }
  addOverall(c, log, 'balance', rnd(1.5, 3)); addOverall(c, log, 'unity', rnd(0.5, 1.5));
  c.rehearsal.done = true;
  log.summary = `${hall.name}の響きを確認：成功率と演奏の安定性が向上`;
  c.practices.push(log);
  save();
  return log;
}

/* =========================================================
 * 演奏会（成功確率・集客・収支・本番の評価・講評）
 * ========================================================= */
/* ---------- 実効パラメータ／成功確率 ---------- */
function effectiveOverall(c) {
  const present = SECTIONS.filter(s => membersOfSection(s.id).length).map(s => s.id);
  const dyn = present.map(s => c.perf.sections[s].dyn);
  const uni = present.map(s => c.perf.sections[s].unity);
  return {
    ensemble: c.perf.overall.ensemble,
    // バランス：各セクションのダイナミクスの平均から、ばらつきを差し引く＋合奏での調整分
    balance: Math.max(0, mean(dyn) - 0.8 * stdev(dyn) + c.perf.overall.balance),
    unity: 0.55 * c.perf.overall.unity + 0.45 * mean(uni),
  };
}
function sectionScoreFor(c, song, param) {
  const w = CONFIG.concert.sectionWeight;
  let s = 0, ws = 0;
  for (const sec of songSections(song)) {
    const v = param ? c.perf.sections[sec][param] : mean(SECTION_PARAMS.map(p => c.perf.sections[sec][p.id]));
    s += v * w[sec]; ws += w[sec];
  }
  return ws ? s / ws : 0;
}
// 楽団の地力（曲で使うセクションの基礎能力平均）
function orchestraStrength(song) {
  const secs = songSections(song);
  return mean(secs.map(s => mean(Object.values(sectionBase(s)))));
}
function songReadiness(c) {
  const song = findSong(c.songId);
  const K = CONFIG.concert;
  const ov = effectiveOverall(c);
  const m = c.perf.mastery;
  const sec = sectionScoreFor(c, song);
  const ovS = mean([ov.ensemble, ov.balance, ov.unity]);
  const mas = (m.underst + m.comp) / 2;
  const long = songLongBonus(song.id);
  const strength = K.abilityWeight * (orchestraStrength(song) - 50);
  const conductor = conductorEffect(c.policy).composite;
  const composite = K.composite.section * sec + K.composite.overall * ovS + K.composite.mastery * mas + long + strength + conductor
    - K.composite.imbalancePenalty * stdev([sec, ovS, mas]);
  const required = K.requiredBase + song.difficulty * K.requiredPerDifficulty;
  const short = shortageOf(song);
  const mult = Math.max(K.shortage.floor, 1 - short.penalty);
  const pBase = sigmoid((composite - required) / K.sigmoidScale);
  return { song, sec, ovS, mas, long, strength, conductor, composite, required, short, mult, pBase, p: pBase * mult };
}
function stageOverflow(c) {
  const hall = concertHall(c), song = findSong(c.songId);
  return hall && song ? Math.max(0, songPlayers(song) - hall.stage) : 0;
}
function successInfo(c, opts = {}) {
  const K = CONFIG.concert;
  const rehearsal = opts.rehearsal ?? c.rehearsal.done;
  const policy = CONFIG.policies[opts.policy || c.policy];
  const hall = concertHall(c);
  const r = songReadiness(c);
  const overflow = stageOverflow(c);
  const overflowMult = Math.max(0.3, 1 - overflow * CONFIG.hallEffect.overflowProb);
  const pressure = rehearsal ? 0 : hall.pressure;
  let p = r.p * overflowMult;
  const ce = conductorEffect(opts.policy || c.policy);
  p += ((rehearsal ? K.hallBonus : 0) + policy.prob + ce.prob - pressure) * Math.max(0.2, r.mult);
  p = clamp(p, K.minProb, K.maxProb);
  return { prob: p, readiness: r, rehearsal, policy, hall, overflow, overflowMult, pressure };
}

/* ---------- 集客・収支 ---------- */
function attendanceRate(c) {
  const E = CONFIG.economy, hall = concertHall(c), song = findSong(c.songId);
  const durF = clamp(E.durationBase + song.duration / E.durationDiv, E.durationBase, E.durationMax);
  const rate = (hall.attendance + STATE.reputation * hall.repSens + (song.popularity - 3) * E.popularityAttendance + conductorEffect(c.policy).attendance) * durF;
  return clamp(rate, E.attendanceMin, E.attendanceMax);
}
const ticketRevenue = c => Math.round(concertHall(c).capacity * attendanceRate(c)) * concertHall(c).ticket;
const resultMultiplier = score => clamp(CONFIG.economy.resultBase + score * CONFIG.economy.resultSlope, CONFIG.economy.resultMin, CONFIG.economy.resultMax);
function settlementFor(c, score, rank) {
  const E = CONFIG.economy;
  const audience = Math.round(concertHall(c).capacity * attendanceRate(c));
  const ticket = ticketRevenue(c);
  const perf = Math.round(ticket * (resultMultiplier(score) - 1) / 1000) * 1000;   // 評価による増減（物販・追加寄付・払い戻し等）
  const sponsor = E.sponsor[rank] || 0;
  const operating = operatingCost();
  const conductorFeeAmt = conductorFee(activeConductor());
  return { audience, ticket, perf, sponsor, operating, conductorFee: conductorFeeAmt, net: ticket + perf + sponsor - operating - conductorFeeAmt };
}

/* ---------- 本番 ---------- */
function concertRankOf(score) { for (const [r, t] of CONFIG.concert.rankThresholds) if (score >= t) return r; return 'D'; }
const EVAL_CATS = [
  { id: 'tech', name: '技術面', w: 0.22 }, { id: 'expr', name: '音楽表現', w: 0.22 }, { id: 'ens', name: 'アンサンブル', w: 0.2 },
  { id: 'bal', name: '音量・バランス', w: 0.16 }, { id: 'comp', name: '楽曲完成度', w: 0.2 },
];

function runConcert(c) {
  if (c.phase !== 'prep') return null;
  const K = CONFIG.concert, H = CONFIG.hallEffect;
  const info = successInfo(c);
  const success = Math.random() < info.prob;
  const pol = info.policy, hall = info.hall, r = info.readiness;
  const ov = effectiveOverall(c);
  const song = r.song, m = c.perf.mastery;
  const S = p => sectionScoreFor(c, song, p);
  const spread = K.evalSpread * pol.spread * (info.rehearsal ? 0.7 : 1);
  const acoustic = (hall.acoustics - H.acousticsBase) * H.acousticsEval;
  const raw = {
    tech: 0.4 * S('tech') + 0.3 * S('pitch') + 0.3 * S('rhythm'),
    expr: 0.5 * S('expr') + 0.3 * S('tone') + 0.2 * m.underst,
    ens: 0.5 * ov.ensemble + 0.3 * ov.unity + 0.2 * S('unity'),
    bal: 0.5 * ov.balance + 0.5 * S('dyn'),
    comp: 0.5 * m.comp + 0.5 * m.underst,
  };
  const ce = conductorEffect(c.policy);
  const solo = principalSoloBonus(song);
  const cats = {};
  for (const cat of EVAL_CATS) {
    let v = 50 + (raw[cat.id] + r.long + r.strength - r.required) * K.evalSlope + (song.difficulty - 50) * K.difficultyEvalBonus;
    v += success ? K.successEvalBonus : -K.failEvalPenalty;
    v += (ce[cat.id] || 0) + ce.evalBonus;           // 指揮者の能力・得意な方針
    if (cat.id === 'expr') v += solo;                // 首席奏者のソロ
    let pe = pol.eval[cat.id];
    if (pe === 'dyn') pe = ov.balance >= 50 ? 7 : -5;
    v += pe || 0;
    v += (cat.id === 'expr' || cat.id === 'bal') ? acoustic : acoustic / 2;      // ホールの音響
    if (cat.id === 'bal') v -= info.overflow * H.overflowEval;                   // 舞台からのはみ出し
    if (info.rehearsal && (cat.id === 'bal' || cat.id === 'ens')) v += K.hallEvalBonus;
    if (cat.id === 'bal' || cat.id === 'ens') v -= r.short.penalty * K.shortage.evalPenalty;
    else v -= r.short.penalty * K.shortage.evalPenalty * 0.4;
    v += rnd(-spread, spread);
    cats[cat.id] = Math.round(clamp(v, 0, 100));
  }
  const total = Math.round(EVAL_CATS.reduce((s, cat) => s + cats[cat.id] * cat.w, 0));
  const rank = concertRankOf(total);
  const settle = settlementFor(c, total, rank);
  earn(c, `チケット収入（${settle.audience}名）`, settle.ticket);
  if (settle.perf) earn(c, settle.perf > 0 ? '出来高（物販・寄付の増加）' : '出来高（評価不振による減収）', settle.perf);
  if (settle.sponsor) earn(c, '協賛金', settle.sponsor);
  earn(c, `運営費（団員${STATE.members.length}名）`, -settle.operating);
  const cd = activeConductor();
  if (settle.conductorFee) earn(c, `指揮者出演料（${cd.name}）`, -settle.conductorFee);
  const conductorGrowth = conductorGrowthAfterConcert(cd);
  const repBefore = STATE.reputation;
  STATE.reputation = clamp(Math.round((STATE.reputation + CONFIG.economy.reputation[rank] * hall.prestige) * 10) / 10, 0, 100);
  songParam(song.id).performed++;
  c.result = {
    prob: info.prob, success, cats, total, rank, policy: c.policy, rehearsal: info.rehearsal,
    hallId: hall.id, settlement: settle, repBefore, repAfter: STATE.reputation,
    conductorId: cd ? cd.id : null, conductorName: cd ? cd.name : '', conductorGrowth,
    reviews: buildReviews(c, success, cats, ov, info),
    at: Date.now(),
  };
  c.phase = 'result';
  save();
  return c.result;
}

/* ---------- 講評（数値に基づく） ---------- */
function buildReviews(c, success, cats, ov, info) {
  const lines = [];
  const song = findSong(c.songId), hall = info.hall, r = info.readiness;
  if (success) lines.push({ k: '総評', t: `『${song.title}』を大きな事故なく演奏し切った。${cats.tech >= cats.expr ? '堅実な技術' : '豊かな表現'}が印象に残る演奏会となった。` });
  else lines.push({ k: '総評', t: `『${song.title}』の途中で${r.short.items.length ? '編成の薄さが露呈し' : info.pressure ? '会場の重圧に飲まれ' : '準備不足が表面化し'}、演奏が崩れる場面があった。` });

  const lack = Object.fromEntries(r.short.items.map(it => [it.inst, it.lack]));
  for (const s of SECTIONS) {
    if (!songSections(song).includes(s.id)) continue;
    const p = c.perf.sections[s.id];
    const n = membersOfSection(s.id).length;
    if (!n) { lines.push({ k: s.name, t: `${s.name}セクションの奏者が不在で、曲の骨格が欠けてしまった。` }); continue; }
    const sorted = SECTION_PARAMS.slice().sort((a, b) => p[b.id] - p[a.id]);
    const best = sorted[0], worstP = sorted[sorted.length - 1];
    const avg = mean(SECTION_PARAMS.map(x => p[x.id]));
    let t = '';
    if (avg >= 55) t += `${s.name}セクションは全体に完成度が高く、特に${best.name}が光った。`;
    else if (avg >= 38) t += `${s.name}セクションの${best.name}は${p[best.id] >= 50 ? '高く、安定していた' : 'まずまずだった'}。`;
    else t += `${s.name}セクションは練習量が足りず、${best.name}を含め全体に粗さが残った。`;
    if (p[worstP.id] < avg - 8 || p[worstP.id] < 30) t += `一方、${worstP.name}には課題が残る。`;
    const ls = s.insts.filter(i => lack[i]).map(i => `${INST[i].abbr}が${lack[i]}名`);
    if (ls.length) t += `${ls.join('、')}不足しており、${s.id === 'br' ? '終盤の盛り上がりで厚みを欠いた' : s.id === 'ww' ? 'ソロや和声の受け渡しが不安定になった' : s.id === 'pc' ? 'リズムの土台が揺らいだ' : '響きの量感が不足した'}。`;
    lines.push({ k: s.name, t });
  }
  const parts = [];
  parts.push(ov.ensemble >= 50 ? 'アンサンブルは緻密で、縦の線がよく揃っていた' : ov.ensemble >= 30 ? 'アンサンブルはおおむね揃っていた' : '合奏の時間が足りず、縦の線がずれる場面が目立った');
  parts.push(ov.balance >= 50 ? '各セクションの音量バランスも良好' : ov.balance >= 30 ? '音量バランスはやや不揃い' : 'セクション間の音量差が大きく、響きがまとまらなかった');
  lines.push({ k: '全体', t: parts.join('。') + '。' });
  // 会場
  let ht = hall.acoustics >= 80 ? `${hall.name}の豊かな響きが演奏を後押しした。` : hall.acoustics >= 60 ? `${hall.name}の素直な響きの中で、楽団の実力がそのまま表れた。` : `${hall.name}は響きが乾いており、音色の美しさが伝わりにくかった。`;
  if (info.overflow) ht += `舞台に${info.overflow}名分の余裕がなく、音が飽和する場面があった。`;
  if (info.pressure && !info.rehearsal) ht += '初めての大舞台に、団員の表情は硬かった。';
  if (info.rehearsal) ht += '事前のホール練習で響きを掴んでいたため、音量感が安定していた。';
  lines.push({ k: '会場', t: ht });
  return lines;
}

function proceedToNextConcert() {
  const c = activeConcert();
  if (c.phase !== 'result') return;
  c.phase = 'done';
  createConcert();
  generateRecruitCandidates();   // 新しい演奏会の始まりに候補者が無料で入れ替わる
  generateConductorCandidates();
  save();
}

/* =========================================================
 * 練習中のランダムイベント（ゲームロジック・画面とは独立）
 *   ・練習の成果そのものは既存の runPractice() がこれまでどおり計算する。
 *   ・イベントは「その回の練習で得た成果」に小さな補正をかけるだけ（選択肢による追加効果）。
 *   ・イベントの抽選には Math.random とは別の乱数を使い、既存の計算の乱数の並びを変えない。
 *   ・結果は練習ログ（log.events）に記録し、既存の練習報告・練習履歴に反映する。
 *   ・イベントの文章・選択肢・効果・発生しやすさは data/events/practice.json で編集する。
 *     ここには「誰が話すか」「どのセクションが対象になるか」などの選び方（プログラム）だけを置く。
 * ========================================================= */
const PRACTICE_EVENT_CFG = {
  chance: PRACTICE_EVENT_DATA.settings.chance,          // 1回の練習でイベントが起きる確率（起きるのは最大1件）
  minAt: PRACTICE_EVENT_DATA.settings.timingFrom, maxAt: PRACTICE_EVENT_DATA.settings.timingTo,   // イベントが起きるタイミングの範囲
};
// 別系統の乱数（mulberry32）
let PEV_SEED = (Date.now() ^ 0x9e3779b9) >>> 0;
function pevRand() {
  PEV_SEED = (PEV_SEED + 0x6D2B79F5) >>> 0;
  let t = PEV_SEED;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pevPick = arr => arr[Math.floor(pevRand() * arr.length)];
function pevWeighted(list) {
  const tot = list.reduce((s, x) => s + x.w, 0); if (tot <= 0) return null;
  let r = pevRand() * tot;
  for (const x of list) { if ((r -= x.w) < 0) return x; }
  return list[list.length - 1];
}
const secName = sec => SEC[sec].name;
const pevGain = (log, sec) => Object.values(log.sections[sec] || {}).reduce((a, b) => a + b, 0);
// その回の練習で成果が出たセクション（＝練習対象）
const pevSecs = log => SECTIONS.map(s => s.id).filter(s => pevGain(log, s) > 0);
const secPrincipal = sec => SEC[sec].insts.map(principalOf).find(Boolean) || null;
const secAvg = (c, sec, key) => mean(SECTION_PARAMS.map(p => c.perf.sections[sec][p.id]));

// 指揮者の個性ごとの口ぐせ（指揮者からの提案・練習中のひとこと）
const PEV_TRAIT = PRACTICE_EVENT_DATA.conductorTraitPhrases;
const pevTrait = cd => (cd && PEV_TRAIT[cd.trait]) || PEV_TRAIT[PRACTICE_EVENT_DATA.defaultTraitPhrase] || { focus: '', aim: PRACTICE_EVENT_DATA.defaultAim };
// 文章の {名前} を置き換える。値のない記号があれば null を返す（代わりの文章を使うため）
function pevFill(t, vars) {
  let missing = false;
  const out = String(t).replace(/\{(\w+)\}/g, (_, k) => { const v = vars[k]; if (v == null) { missing = true; return ''; } return v; });
  return missing ? null : out;
}
const pevText = (t, vars) => pevFill(t, vars) ?? String(t).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');

/* 発生条件（requires）：イベントが起きるために必要な状況 */
const PEV_REQUIRES = {
  conductor: (c, log, ctx) => !!ctx.cd,
  practicedSection: (c, log, ctx) => ctx.secs.length > 0,
  principalSection: (c, log, ctx) => ctx.secs.some(secPrincipal),
  members: (c, log, ctx) => ctx.members.length > 0,
  individual: (c, log) => log.menu === 'individual',
  notIndividual: (c, log) => log.menu !== 'individual',
};
/* 対象の選び方（target）：どのセクション・団員についてのイベントか */
const PEV_TARGETS = {
  none: () => ({}),
  // いちばん仕上がりが遅れているセクション
  weakestSection: (c, log, ctx) => ({ sec: ctx.secs.slice().sort((a, b) => secAvg(c, a) - secAvg(c, b))[0] }),
  // 首席奏者がいる練習中のセクション（話すのはその首席）
  principalSection: (c, log, ctx) => { const sec = pevPick(ctx.secs.filter(secPrincipal)); return { sec, principal: secPrincipal(sec) }; },
  // 技術に不安のある団員ほど相談しにくる
  strugglingMember: (c, log, ctx) => { const m = ctx.members.slice().sort((a, b) => a.abilities.tech - b.abilities.tech)[Math.floor(pevRand() * Math.min(3, ctx.members.length))]; return { sec: INST[m.inst].section, member: m }; },
  // 協調性の高いセクションほど好調になりやすい
  harmoniousSection: (c, log, ctx) => { const sec = ctx.secs.slice().sort((a, b) => mean(membersOfSection(b).map(m => m.abilities.coop)) - mean(membersOfSection(a).map(m => m.abilities.coop)))[Math.floor(pevRand() * Math.min(2, ctx.secs.length))]; return { sec, principal: secPrincipal(sec) }; },
  randomMember: (c, log, ctx) => { const m = pevPick(ctx.members); return { sec: INST[m.inst].section, member: m }; },
};
/* 話す人（speaker） */
const PEV_SPEAKERS = {
  conductor: (ctx) => ({ who: ctx.cd ? ctx.cd.name : '指揮者', whoRole: '指揮者' }),
  principal: (ctx, t) => ({ who: t.principal.name, whoRole: `${INST[t.principal.inst].abbr} 首席` }),
  member: (ctx, t) => ({ who: t.member.name, whoRole: INST[t.member.inst].abbr }),
};
// 選択肢の効果をプログラム用の形に（focus はそのイベントの対象セクションに対する倍率）

/* =========================================================
 * 練習クイズ（ゲームロジック）
 *   ・通常練習（全体合奏・セクション練習・個人練習）の回数を数え、2回ごとに1問を出題待ちにする。
 *     ホール練習（本番準備）は runHallPractice なので数えない。
 *   ・出題は「練習中の曲の問題」→「その曲の作曲家の問題」→「一般の音楽の問題」の優先順。
 *     出題済みの問題は曲ごとに記録し、一通り出題したら記録をリセットして再出題する。
 *   ・回答で、その演奏会の既存の「楽曲理解度」が上がる（正解は大きく、不正解でも少し、連続正解でボーナス）。
 *     楽曲理解度は演奏会（＝その曲）ごとの値なので、ほかの曲には影響しない。演奏会の評価への効き方も既存のまま。
 *   ・既存の練習の計算には手を加えず、runPractice の後に回数を数えるだけ。
 * ========================================================= */

const QUIZ_INDEX = {};

(() => {
  for (const [sid, qs] of Object.entries(QUIZ_SONG)) QUIZ_BY_SONG[sid] = qs.map(q => (QUIZ_INDEX[q.id] = { ...q, scope: 'song' }).id);
  for (const [cid, d] of Object.entries(QUIZ_COMPOSER)) {
    QUIZ_BY_COMPOSER[cid] = d.qs.map(q => (QUIZ_INDEX[q.id] = { ...q, scope: 'composer' }).id);
    d.songs.forEach(s => QUIZ_COMPOSER_OF[s] = cid);
  }
  QUIZ_GENERAL.forEach(q => QUIZ_INDEX[q.id] = { ...q, scope: 'general' });
})();

// 曲に関係する問題の候補（優先順の3段階）
const quizTiers = songId => [QUIZ_BY_SONG[songId] || [], QUIZ_BY_COMPOSER[QUIZ_COMPOSER_OF[songId]] || [], QUIZ_GENERAL_IDS];

  const s = quizSong(songId), tiers = quizTiers(songId);

  if (!pool) {

    const recent = s.asked.slice(-3);
    s.asked = [];
    for (const t of tiers) { const left = t.filter(id => !recent.includes(id)); if (left.length) { pool = left; break; } }

// 通常練習が1回終わるたびに呼ぶ。出題回なら出題待ちの問題を作る
function quizAfterPractice(c, log) {
  const q = ensureQuizState();
  q.count++;

    const qid = pickQuizQuestion(c.songId);
    const order = [0, 1, 2, 3];
    for (let i = 3; i > 0; i--) { const j = Math.floor(qzRand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

// 出題中の問題がデータから削除されていた場合（JSONの編集後など）は、出題をなかったことにする
const quizPending = () => { const q = ensureQuizState(); if (q.pending && !QUIZ_INDEX[q.pending.qid]) { q.pending = null; save(); } return q.pending; };

function quizRebuildSummary(log) {
  let sum = summarizeLog(log);
  for (const e of log.events || []) sum += `／${e.title}：${e.note}`;
  if (log.quiz) sum += `／クイズ${log.quiz.correct ? '正解' : '不正解'}`;

// 回答（choice は画面上の並び順の番号 0〜3）。その演奏会の既存の楽曲理解度に、既存の上昇処理（addMastery）で加える
function answerQuiz(choice) {
  const q = ensureQuizState(), p = quizPending(); if (!p) return null;
  const item = QUIZ_INDEX[p.qid], K = CONFIG.quiz, s = quizSong(p.songId);
  const picked = p.order[choice], correct = picked === 0;
  let base, bonus = 0;
  if (correct) { q.streak++; bonus = Math.min(K.streakBonusMax, (q.streak - 1) * K.streakBonus); base = K.gainCorrect; q.best = Math.max(q.best, q.streak); s.correct++; }

  const c = STATE.concertPrograms[p.concertId];

// 既存の通常練習（runPractice）の後に回数を数える。計算・結果は一切変えない
(() => {

/* =========================================================

 * ========================================================= */

    '祝祭': { tempo: 120, minor: false, feel: 'bright' }, '高揚': { tempo: 116, minor: false, feel: 'bright' },
    '壮麗': { tempo: 92, minor: false, feel: 'grand' }, '劇的': { tempo: 108, minor: true, feel: 'drama' },
    '叙情': { tempo: 76, minor: false, feel: 'calm' }, '叙景': { tempo: 84, minor: false, feel: 'calm' },
    '幻想': { tempo: 72, minor: true, feel: 'calm' }, '悲歌': { tempo: 62, minor: true, feel: 'calm' },
    'ロマン的': { tempo: 80, minor: true, feel: 'grand' },

    bright: [[1, 1, 1, 1], [1.5, 0.5, 1, 1], [2, 1, 1], [1, 1, 2], [0.5, 0.5, 1, 2]],
    grand: [[2, 1, 1], [3, 1], [1.5, 0.5, 2], [2, 2]],
    drama: [[1.5, 0.5, 1.5, 0.5], [1, 1, 2], [2, 2], [0.5, 0.5, 0.5, 0.5, 2]],

  /* ---------- 配置（指揮者を中心とした弧） ---------- */
  function layoutSeats(lineup, stageY) {
    const O = { x: 0, z: -1.6 };
    const out = [];
    const arc = (inst, list, r0, a0, a1, rise, opts = {}) => {
      let r = r0, idx = 0, row = 0;
      while (idx < list.length) {
        const span = Math.abs(a1 - a0) * Math.PI / 180 * r;
        const n = Math.max(1, Math.min(list.length - idx, Math.floor(span / (opts.gap || 0.9)) + 1));
        for (let k = 0; k < n; k++, idx++) {
          const ang = (a0 + (a1 - a0) * (n === 1 ? 0.5 : (k + 0.5) / n)) * Math.PI / 180;
          const x = O.x + r * Math.cos(ang), z = O.z - r * Math.sin(ang);
          out.push({ inst, member: list[idx], x, z, y: stageY + rise + (opts.rowRise || 0) * row, rot: Math.atan2(O.x - x, O.z - z), pk: idx });
        }
        r += 0.95; row++;
      }
    };
    const L = lineup;
    arc('Vn1', L.Vn1, 2.0, 172, 124, 0);
    arc('Vn2', L.Vn2, 2.6, 122, 92, 0);
    arc('Va', L.Va, 2.6, 88, 58, 0);
    arc('Vc', L.Vc, 2.0, 56, 10, 0);
    arc('Cb', L.Cb, 5.3, 40, 12, 0.25, { gap: 1.0 });
    arc('Fl', L.Fl, 5.3, 93, 116, 0.3, { gap: 0.85 });
    arc('Ob', L.Ob, 5.3, 87, 64, 0.3, { gap: 0.85 });
    arc('Cl', L.Cl, 6.3, 93, 114, 0.3, { gap: 0.85 });
    arc('Fg', L.Fg, 6.3, 87, 66, 0.3, { gap: 0.85 });
    arc('Hr', L.Hr, 7.4, 110, 152, 0.6, { gap: 0.85 });
    arc('Tp', L.Tp, 7.4, 92, 74, 0.6, { gap: 0.85 });
    arc('Tb', L.Tb, 7.4, 72, 54, 0.6, { gap: 0.9 });
    arc('Tuba', L.Tuba, 7.4, 52, 44, 0.6, { gap: 0.9 });
    arc('Perc', L.Perc, 8.7, 112, 70, 0.9, { gap: 1.05 });
    return { seats: out, podium: { x: O.x, y: stageY + 0.22, z: O.z } };

  // 指揮：4拍子の図形（1拍目は下、2拍目は内、3拍目は外、4拍目は上）
  const BEAT_PTS = [[0, -0.3], [0.22, -0.18], [-0.3, -0.16], [0, 0.12]];
  function poseConductor(cd, beat, dyn, phase, time) {
    const lf = cd.lift;

    const base = V(-0.08, 1.0 + lf + 0.42, 0.42);

  /* ---------- 音楽の状態 → 動き ---------- */
  let score = null, quality = {}, scoreStart = 0, curBeat = -10;

      a.amp = 1 + (a.rng() - 0.5) * (1 - qq) * 0.6;    // 動きの大きさのばらつき

  /* ---------- カメラ ---------- */
  function presets() {
    const L = layoutInfo || { stageY: 1, D: 20, H: 10 };
    const aspect = camera.aspect || 0.6;
    const k = clamp(0.95 / aspect, 1, 2.2);   // 縦長画面ほど引いて全体を収める
    const sec = id => {
      const ss = actors.filter(a => a.sec === id);
      if (!ss.length) return null;
      const c = ss.reduce((acc, a) => acc.add(a.group.position), V(0, 0, 0)).multiplyScalar(1 / ss.length);
      const toward = V(-c.x * 0.6, 0, 3 - c.z).normalize();
      const back = id === 'br' || id === 'pc' || id === 'ww';
      if (back) return { pos: c.clone().add(V(0, 4.4, 2.4 * Math.min(1.4, k))), tgt: c.clone().add(V(0, 0.5, -0.6)) };   // 後方のセクションは上から覗き込む
      return { pos: c.clone().addScaledVector(toward, 3.2 * Math.min(1.5, k)).add(V(0, 3.0, 0)), tgt: c.clone().add(V(0, 0.9, 0)) };
    };
    const y = L.stageY;
    return {
      overview: { pos: V(0, y + 5.6 + 1.8 * k, 5.5 + 5.0 * k), tgt: V(0, y + 0.2, -4.8) },
      front: { pos: V(0, y + 2.6, 3.5 + 4.2 * k), tgt: V(0, y + 1.5, -4.6) },
      conductor: { pos: V(0, y + 2.6, -1.4), tgt: V(0, y + 0.3, -6.5) },   // 指揮者の目の位置（本人は非表示）
      // ホールの下見（予約前の3Dプレビュー）用：客席後方・側方の上・舞台から客席を見る
      hallRear: { pos: V(0, (L.rakeAt ? L.rakeAt(L.D - 1.5) : 0) + 2.4, L.D - 1.5), tgt: V(0, y + 1.2, -5) },
      hallSide: { pos: V((L.W || 20) / 2 - 2.2, Math.min((L.H || 10) - 1.2, y + 4.5), (L.D || 16) * 0.45), tgt: V(0, y + 0.6, -4) },
      fromStage: { pos: V(0, y + 2.0, -2.6), tgt: V(0, (L.H || 10) * 0.3, L.D || 16) },
      hs: sec('hs'), ls: sec('ls'), ww: sec('ww'), br: sec('br'), pc: sec('pc'),

  function setCamera(name, instant, dur) {
    if (!ok) return;

      p.pos.y = Math.min(p.pos.y, layoutInfo.H - 0.7);   // 天井より上に出ない（天井の低いホール）
      if (layoutInfo.maxZ) p.pos.z = Math.min(p.pos.z, layoutInfo.maxZ);   // 練習室：部屋の壁より外に出ない
    }
    cam.dur = dur || 0.8;
    cam.name = presets()[name] ? name : 'front';
    if (instant || !cam.pos) { cam.pos = p.pos.clone(); cam.tgt = p.tgt.clone(); cam.from = null; }

  }

  /* ---------- 演奏会の演出（イベントの流れ） ---------- */
  // stages: 開演前→入場・着席→チューニング→指揮者登場→一礼→構え→演奏→終演→拍手→結果
  function playShow(opts) {

      ['before', 1.6, '開演前'], ['enter', 3.6, '団員入場・着席'], ['tuning', 3.4, 'チューニング'],
      ['maestro', 2.8, '指揮者の登場'], ['bowAud', 1.6, '指揮者が一礼し、指揮台へ'], ['ready', 1.2, '演奏開始'],
      ['play', sc.duration + 0.4, '演奏中'], ['end', 1.6, '演奏終了'], ['applause', 5.5, opts.applauseLabel || '観客の拍手'],
    ];
    let acc = 0; const marks = S.map(([id, d, label]) => { const m = { id, start: acc, end: acc + d, label }; acc += d; return m; });
    show = { t0, marks, total: acc, sc, stage: 'before', t: 0, onEnd: opts.onEnd, opts, scheduled: {}, lastT: t0 - 0.15 };
    mode = 'show';
    if (audience) { audience.fill = opts.fill ?? 0.6; audience.clap = 0; audience.stand = 0; updateAudience(0, true); }
    // 団員は袖から入場（その間は楽器を持たない）。準備に失敗した団員は入場演出から外し、席に座らせておく
    for (const a of actors) {
      try {
        const d = a.rng() * 2.2 + (a.sec === 'pc' ? 0.6 : 0);
        a.walk = { from: V(-layoutInfo.stageW / 2 - 1.5, a.seat.y, a.seat.z + 0.6), delay: Number.isFinite(d) ? d : 0 };
        a.group.position.copy(a.walk.from); a.instr.visible = ['vc', 'cb', 'pc'].includes(a.kind); if (a.tool) a.tool.visible = false; if (a.tool2) a.tool2.visible = false;
        a.w = 0;
      } catch (e) { actorFailed(a, e); }
    }

  }
  // 団員1人の表示・動きで問題が起きたとき：その団員だけ演出から外し、ほかの団員と本番の進行は続ける

  function endShowState() {

    for (const a of actors) {
      if (a.failed) continue;
      try { a.walk = null; a.group.position.set(a.seat.x, a.seat.y, a.seat.z); a.group.rotation.y = a.seat.rot; a.instr.visible = true; if (a.tool) a.tool.visible = true; if (a.tool2) a.tool2.visible = true; a.w = 0; a.body.position.y = 0; } catch (err) { actorFailed(a, err); }
    }
    if (conductor) { conductor.group.position.copy(conductor.home); conductor.group.rotation.y = Math.PI; conductor.bow = 0; }
    if (audience) { audience.clap = 0; audience.stand = 0; updateAudience(0, true); }
    hemi.intensity = 1.15 * ((layoutInfo && layoutInfo.V3.lightI) || 1);
  }
  function updateShow(t) {
    const s = show;
    // 時計が異常に飛んだ場合（端末の一時停止など）は、その分だけ演出の開始時刻をずらして途中から続ける
    const jump = t - s.lastT;
    if (jump > 1.0 || jump < 0) s.t0 += jump - Math.min(frameDt, 0.05);
    s.lastT = t;
    const tt = t - s.t0; s.t = tt;
    const cur = s.marks.find(m => tt >= m.start && tt < m.end) || s.marks[s.marks.length - 1];
    if (cur.id !== s.stage || !s.captioned) {
      s.stage = cur.id; s.captioned = true;
      captionCb && captionCb(cur.label, cur.id);
      const at = s.t0 + cur.start;
      if (cur.id === 'tuning' && !s.scheduled.tuning) { s.scheduled.tuning = 1; Music.tuning(at + 0.2, 3.0); }
      if (cur.id === 'maestro' && !s.scheduled.m) { s.scheduled.m = 1; Music.applause(at + 0.4, 2.2, 0.35); }
      if (cur.id === 'play' && !s.scheduled.play) { s.scheduled.play = 1; scoreStart = at + 0.2; Music.playScore(s.sc, scoreStart, quality); }
      if (cur.id === 'applause' && !s.scheduled.ap) { s.scheduled.ap = 1; Music.applause(at + 0.1, 5.2, s.opts.applause ?? 0.6); }
    }
    const local = tt - cur.start, dur = cur.end - cur.start, u = clamp(local / dur, 0, 1);
    const lightI = (layoutInfo && layoutInfo.V3.lightI) || 1;
    // 客席照明：演奏中は落とす
    const dimTarget = ['bowAud', 'ready', 'play', 'end'].includes(cur.id) ? 0.45 : 1.15;
    hemi.intensity += (dimTarget * lightI - hemi.intensity) * 0.05;
    // 入場（入場の時間を過ぎても歩いている団員は、必ず席に着かせて入場を終える）
    const enterOver = tt >= s.marks[1].end;
    for (const a of actors) {
      if (!a.walk || a.failed) continue;
      try {
      const e = enterOver ? 1 : clamp((tt - s.marks[1].start - a.walk.delay) / 1.3, 0, 1);
      if (tt < s.marks[1].start) { a.group.position.copy(a.walk.from); a.group.visible = false; continue; }
      a.group.visible = true;
      if (e < 1) {
        a.group.position.lerpVectors(a.walk.from, V(a.seat.x, a.seat.y, a.seat.z), e);
        a.group.position.y += Math.abs(Math.sin(e * 18)) * 0.05;
        a.group.rotation.y = e < 0.9 ? Math.atan2(a.seat.x - a.walk.from.x, 0.0001) : a.seat.rot;
      } else {
        a.group.position.set(a.seat.x, a.seat.y, a.seat.z); a.group.rotation.y = a.seat.rot;
        a.instr.visible = true; if (a.tool) a.tool.visible = true; if (a.tool2) a.tool2.visible = true;

      } catch (err) { actorFailed(a, err); }
    }

    const cd = conductor;
    let cphase = 'idle', beat = 0, dyn = 0.5;
    if (cd && !cd.failed) try {
      const m3 = s.marks[3], m4 = s.marks[4];
      if (tt < m3.start) cd.group.visible = false;
      else if (tt < m3.end) {
        cd.group.visible = true;
        const e = clamp((tt - m3.start) / (dur * 0.85), 0, 1);
        const from = V(-layoutInfo.stageW / 2 - 1.5, cd.home.y - 0.2, cd.home.z + 1.2), to = V(cd.home.x + 0.7, layoutInfo.stageY, cd.home.z + 0.9);
        cd.group.position.lerpVectors(from, to, Math.min(1, e)); cd.group.position.y += Math.abs(Math.sin(e * 16)) * 0.05 * (e < 1 ? 1 : 0);
        cd.group.rotation.y = e < 1 ? Math.PI / 2 : 0;
      } else if (tt < m4.end) {
        const e = clamp((tt - m4.start) / (m4.end - m4.start), 0, 1);
        cd.group.position.set(cd.home.x + 0.7 * (1 - Math.max(0, e - 0.6) / 0.4), e < 0.6 ? layoutInfo.stageY : cd.home.y, cd.home.z + 0.9 * (1 - Math.max(0, e - 0.6) / 0.4));
        cd.group.rotation.y = e < 0.6 ? 0 : Math.PI * Math.min(1, (e - 0.6) / 0.3);
        cd.bow = e < 0.55 ? Math.sin(e / 0.55 * Math.PI) : 0; cphase = e < 0.55 ? 'bow' : 'idle';

      if (cur.id === 'end') { cd.group.rotation.y = Math.PI; cphase = u < 0.5 ? 'ready' : 'idle'; }
      if (cur.id === 'applause') {
        cd.group.rotation.y = Math.PI * (1 - Math.min(1, u * 3)); cd.group.position.copy(cd.home);

    // 団員の演奏
    const b = cur.id === 'play' || cur.id === 'end' ? (t - scoreStart) / s.sc.spb : -10;
    curBeat = b;
    poseAll(b, frameDt, false, cur.id === 'applause' ? 'stand' : null);
    if (cur.id === 'applause') for (const a of actors) if (!a.failed) a.body.position.y = u > 0.15 && u < 0.8 && !a.standing ? 0.12 * Math.sin(Math.min(1, (u - 0.15) * 5) * Math.PI / 2) : 0;
    // 観客
    if (audience) {
      const clap = cur.id === 'applause' ? (u < 0.85 ? 1 : (1 - u) / 0.15) : cur.id === 'maestro' ? (u > 0.1 && u < 0.85 ? 0.5 : 0) : 0;
      audience.clap += (clap - audience.clap) * 0.15;
      const st = cur.id === 'applause' && (s.opts.standing || false) && u > 0.2 && u < 0.9 ? 1 : 0;

  }

  /* ---------- 練習のアニメーション（音なし・数秒） ----------
   * opts.loop=true：練習時間中くり返し演奏する（練習の進行は画面側が管理し、endPractice() で終える）
   *   setPracticeFocus(['hs','ls']) で中心に演奏させるセクションを切り替え、pausePractice(true) で手を止めて話を聞く姿勢にする */
  function playPractice(plan, q, opts = {}) {
    if (!ok || mode === 'show' || !scoreSong) return;
    const sc = Music.createScore(scoreSong, { seed: Math.floor(Math.random() * 1e9), bars: 4, sections: SECTIONS.map(s => s.id) });
    score = sc; setQuality(q);
    const targets = new Set(plan.members || []);
    const secOffset = { hs: 0, ls: 1, ww: 2, br: 3, pc: 1.5 };
    // くり返し再生では、各セクションが「楽譜上で演奏している拍」だけをつないで動かす（休符ばかりで動かないのを防ぐ）
    // 個人練習の対象が今回の曲の編成に入っていない（舞台にいない）ときは、その団員のセクションを演奏させる
    const anyOn = actors.some(a => a.member && targets.has(a.member.id)), fb = new Set(opts.fallbackSecs || []);
    const act = {};
    if (opts.loop) for (const s of SECTIONS) { act[s.id] = []; for (let x = 0; x < sc.beats; x += 0.25) if (Music.isActive(sc, s.id, x)) act[s.id].push(x); }
    practice = {
      t0: Music.now(), plan, loop: !!opts.loop, focus: null, paused: false, pausedAt: 0, pausedTotal: 0, act,
      who: a => (plan.menu === 'tutti' ? true : plan.menu === 'individual' ? (anyOn ? targets.has(a.member.id) : fb.has(a.sec)) : true) && (!practice.focus || practice.focus.has(a.sec)),
      off: a => plan.menu === 'section' && !practice.loop ? secOffset[a.sec] * 2 : 0,

  }
  function stopPractice() { practice = null; if (mode === 'practice') { mode = 'idle'; score = null; } }

    const t = Music.now();
    if (on) p.pausedAt = t; else p.pausedTotal += t - p.pausedAt;
    p.paused = !!on;
  }
  function updateLoopPractice(t) {
    const p = practice, b = Math.max(0, (p.paused ? p.pausedAt : t) - p.t0 - p.pausedTotal) / score.spb, bb = b % score.beats;
    curBeat = bb;
    // 指揮者：演奏中は拍を振り、手を止めているあいだは団員に向かって話している姿勢
    if (conductor) poseConductor(conductor, bb, 0.6, p.paused ? 'idle' : 'beat', t);
    for (const a of actors) {
      if (a.failed) continue;
      try {
      const play = !p.paused && p.who(a);
      const L = p.act[a.sec] || [];
      const sb = L.length ? L[Math.floor(b * 4) % L.length] + (b * 4 % 1) / 4 : bb;

      } catch (err) { actorFailed(a, err); }

  }
  function updatePractice(t) {
    if (practice.loop) return updateLoopPractice(t);
    const p = practice, b = (t - p.t0) / score.spb;
    if (conductor) poseConductor(conductor, b, 0.6, p.plan.menu === 'tutti' && b < score.beats ? 'beat' : 'idle', t);
    if (b > score.beats + 2) { stopPractice(); poseAll(0, 1, true); return; }
    for (const a of actors) {
      if (a.failed) continue;
      try {
      const bb = b - (p.off(a) || 0);
      const m = p.who(a) && bb > 0 ? musicState(a, bb % score.beats, score) : { active: false, u: 0, dyn: 0.3, onset: 9 };

  let frameDt = 0.016, nowT = 0, idleTick = 0;

    debug: () => ({ walking: actors.filter(a => a.walk).length, failed: actors.filter(a => a.failed).length, hidden: actors.filter(a => !a.group.visible).length, aud: audience ? [audience.n, +audience.fill.toFixed(2)] : null, actors: actors.length, conductor: !!conductor, hall: hallKey, mode, calls: renderer ? renderer.info.render.calls : 0, tris: renderer ? renderer.info.render.triangles : 0, pixelRatio, seats: seats.length, empty: seats.filter(s => !s.member).length, principals: actors.filter(a => a.principal).length, stage: show ? show.stage : null, actorsW: actors.slice(0, 5).map(a => +a.w.toFixed(2)) }),

/* --- 選曲（2タブ・一覧から1曲） --- */
function songTags(s, c) {
  const sh = shortageOf(s);
  const t = [`<span class="tag">${difficultyLabel(s.difficulty)}</span>`, `<span class="tag">${s.duration}分</span>`, `<span class="tag">知名度${s.popularity}</span>`];
  if (sh.items.some(i => i.missing)) t.push('<span class="tag bad">楽器欠員</span>');
  else if (sh.items.length) t.push(`<span class="tag warn">編成不足 ${sh.items.reduce((a, i) => a + i.lack, 0)}名</span>`);
  else t.push('<span class="tag ok">編成OK</span>');
  const hall = c && concertHall(c);
  if (hall && songPlayers(s) > hall.stage) t.push(`<span class="tag warn">舞台超過 ${songPlayers(s) - hall.stage}名</span>`);
  const sp = STATE.songParams[s.id]; if (sp && sp.performed) t.push(`<span class="tag gold">演奏歴${sp.performed}</span>`);
  return t.join('');
}

/* --- 練習 --- */
function ensureDraft(c) {
  if (UI.draft && UI.draft.cid === c.id) return;
  UI.draft = { cid: c.id, menu: 'tutti', focus: null, indFocus: null, sections: null, members: [], openSec: null };
  UI.lastLog = null; UI.pickSong = null; UI.train.last = null;
}
function fillDraft(c) {
  const d = UI.draft;
  if (!d.focus) d.focus = autoTuttiFocus(c);
  if (!d.indFocus) { d.indFocus = emptyFocus(); d.indFocus.tech = 4; d.indFocus.expr = 3; d.indFocus.pitch = 3; }
  if (!d.sections) { d.sections = {}; SECTIONS.forEach(s => d.sections[s.id] = autoSectionFocus(c, s.id)); }
}
function focusOf(path) { const d = UI.draft; return path === 'tutti' ? d.focus : path === 'ind' ? d.indFocus : d.sections[path.slice(4)]; }
const ftotal = f => FOCUS.reduce((s, x) => s + (f[x.id] || 0), 0);
function renderFocusEditor(path, f) {
  const t = ftotal(f);
  return `<div class="focus">${FOCUS.map(x => `<div class="fitem ${f[x.id] ? 'on' : ''}"><span>${x.name}</span><span class="ctl">
    <button data-act="fp" data-path="${path}" data-f="${x.id}" data-d="-1" ${f[x.id] <= 0 ? 'disabled' : ''} aria-label="${x.name}を減らす">−</button><b>${f[x.id]}</b>
    <button data-act="fp" data-path="${path}" data-f="${x.id}" data-d="1" ${t >= CONFIG.focusPoints ? 'disabled' : ''} aria-label="${x.name}を増やす">＋</button></span></div>`).join('')}</div>
    <div class="ptotal"><span class="${t === CONFIG.focusPoints ? 'ok' : 'ng'}">配分 ${t} / ${CONFIG.focusPoints}${t === CONFIG.focusPoints ? ' ✓' : `（残り ${CONFIG.focusPoints - t}）`}</span>
    <span class="row" style="gap:6px"><button class="btn sm" data-act="fclear" data-path="${path}">クリア</button><button class="btn sm gold" data-act="fauto" data-path="${path}">おまかせ</button></span></div>`;
}
const focusSummary = f => FOCUS.filter(x => f[x.id]).map(x => `${x.name}${f[x.id]}`).join(' ') || '未設定';

function renderPractice(c) {
  fillDraft(c);
  const d = UI.draft;
  const menus = [['tutti', '全体合奏', '全員・曲を通す'], ['section', 'セクション練習', '5セクション同時'], ['individual', '個人練習', '奏者を絞って']];
  let editor = '';
  if (d.menu === 'tutti') {
    editor = `<div class="card"><h3>重点項目</h3>${renderFocusEditor('tutti', d.focus)}</div>`;
  } else if (d.menu === 'section') {
    editor = `<div class="row sp" style="margin:2px 2px 8px"><span class="sub">各セクションに10ポイントずつ配分</span><button class="btn sm gold" data-act="autoAll">全部おまかせ</button></div>
      ${SECTIONS.map(s => { const f = d.sections[s.id]; const ok = ftotal(f) === CONFIG.focusPoints; const n = membersOfSection(s.id).length; return `<div class="acc"><button class="ah" data-act="acc" data-s="${s.id}"><span class="nm">${s.name}</span><span class="sum ellip">${n ? '' : '<span class="tag bad">団員なし</span> '}${focusSummary(f)}</span>${ok ? '<span class="tag ok">10</span>' : `<span class="tag warn">${ftotal(f)}</span>`}<span class="muted">${d.openSec === s.id ? '－' : '＋'}</span></button>
        ${d.openSec === s.id ? `<div class="ab">${renderFocusEditor('sec:' + s.id, f)}</div>` : ''}</div>`; }).join('')}`;
  } else {
    const ms = membersOfSection(UI.indSec);
    editor = `<div class="card"><h3>対象団員（最大${CONFIG.individualMaxTargets}名）</h3>
      <div class="seg">${SECTIONS.map(s => `<button class="${UI.indSec === s.id ? 'on' : ''}" data-act="indSec" data-v="${s.id}">${s.name}</button>`).join('')}</div>
      ${ms.map(m => { const sel = d.members.includes(m.id); return `<button class="mrow ${sel ? 'sel' : ''}" data-act="indPick" data-id="${m.id}">${badge(memberRank(m))}<span class="grow"><span class="nm">${esc(m.name)}</span><span class="muted"> ${INST[m.inst].abbr}</span><br><span class="muted">平均 ${Math.round(memberAvg(m))}</span></span><span>${sel ? '✓' : ''}</span></button>`; }).join('') || '<div class="muted">団員がいません</div>'}
      <div class="muted">選択中：${d.members.map(id => esc(memberById(id)?.name)).join('、') || 'なし'}</div></div>
      <div class="card"><h3>重点項目</h3>${renderFocusEditor('ind', d.indFocus)}</div>`;
  }
  const err = validatePlan(c, buildPlan());
  return `
  <div class="card gold"><div class="row sp"><div><div class="muted">練習</div><div style="font-family:var(--serif);font-size:26px" class="num">${c.practiceDone + 1}<small style="font-size:15px"> / ${CONFIG.practiceCount} 回目</small></div></div>
    <div class="grow" style="max-width:55%">${bar(c.practiceDone, CONFIG.practiceCount)}<div class="muted" style="text-align:right;margin-top:4px">残り ${CONFIG.practiceCount - c.practiceDone} 回</div></div></div>
    <div class="hr"></div>${renderSongButton(c.songId, '曲目')}</div>
  ${UI.lastLog ? renderLog(c, UI.lastLog, true) : ''}
  <div class="menus">${menus.map(([id, n, s]) => `<button class="${d.menu === id ? 'on' : ''}" data-act="menu" data-v="${id}"><b>${n}</b><span>${s}</span></button>`).join('')}</div>
  ${editor}
  <button class="btn pri block" data-act="practice" ${err ? 'disabled' : ''}>練習開始</button>
  ${err ? `<div class="reason" style="text-align:center">${esc(err)}</div>` : ''}
  <p class="muted" style="text-align:center">練習で高まるのは今回の本番に向けた仕上がりです。団員の能力そのものは「育成」で伸ばします。</p>
  ${renderPerfFold(c)}
  ${c.practices.length ? `<div class="card"><details class="fold"><summary><h3 style="margin:0">練習履歴（${c.practices.length}）</h3></summary>${c.practices.slice().reverse().map(l => `<div class="review"><b>${l.no === 'H' ? 'ホール' : '第' + l.no + '回'}</b>${esc(l.summary)}</div>`).join('')}</details></div>` : ''}`;
}
function buildPlan() {
  const d = UI.draft;
  if (d.menu === 'tutti') return { menu: 'tutti', focus: d.focus };
  if (d.menu === 'section') return { menu: 'section', sections: d.sections };
  return { menu: 'individual', focus: d.indFocus, members: d.members };
}
function renderLog(c, log, closable) {
  const menuN = { tutti: '全体合奏', section: 'セクション練習', individual: '個人練習', hall: 'ホール練習' }[log.menu];
  const secRows = SECTIONS.filter(s => log.sections[s.id]).map(s => `<div class="s">${s.name}</div>${SECTION_PARAMS.map(p => { const v = log.sections[s.id][p.id] || 0; return `<div class="${v ? 'delta' : 'z'}">${v ? '+' + round1(v) : '·'}</div>`; }).join('')}`).join('');
  const ov = Object.entries(log.overall).map(([k, v]) => `${OVERALL_PARAMS.find(o => o.id === k).name} <span class="delta">+${round1(v)}</span>`).join('　');
  const ma = [['comp', '楽曲完成度'], ['underst', '楽曲理解度']].filter(([k]) => log.mastery[k]).map(([k, n]) => `${n} <span class="delta">+${round1(log.mastery[k])}</span>`).join('　');

function trainTargetId() { const t = findTraining(UI.train.t); return t.target === 'section' ? UI.train.sec : t.target === 'conductor' ? (UI.train.cond || STATE.conductorId) : UI.train.member; }
function renderTrain(c) {

  let picker = '';

  } else if (t.target === 'section') {
    picker = `<div class="seg">${SECTIONS.map(s => { const used = c.trainingUsed[`${t.id}:${s.id}`]; return `<button class="${T.sec === s.id ? 'on' : ''}" data-act="trSec" data-v="${s.id}">${s.name}${used ? ' ✓' : ''}</button>`; }).join('')}</div>
      <div class="muted">${SEC[T.sec].name}：${membersOfSection(T.sec).length}名・平均能力 ${Math.round(mean(membersOfSection(T.sec).map(memberAvg)))}</div>`;
  } else {
    const ms = membersOfSection(T.memSec);

  }

    return Object.entries(g).map(([a, [x, y, p]]) => `${abilShort(a)} +${x === y ? x : x + '〜' + y}${p < 1 ? `（${Math.round(p * 100)}%）` : ''}`).join('、');
  })();
  return `<h2>育成</h2>
  <p class="sub">資金を投じて団員や指揮者の能力そのものを伸ばします（潜在能力が上限）。練習では団員の能力は伸びません。指揮者は演奏会の経験でも少しずつ成長します。</p>

  <div class="card"><h3>${esc(t.name)}</h3><p class="sub" style="margin-top:0">${esc(t.desc)}</p>
    <div class="muted" style="margin-bottom:8px">効果：${gainsText}${t.limit === 'concert' ? '／同じ対象には1演奏会につき1回' : ''}</div>

    ${m ? `<div class="hr"></div>${ABILITIES.map(a => stat(a.name, m.abilities[a.id], m.potential[a.id])).join('')}` : ''}

function clampWin() {
  if (!WIN || WIN.hidden) return;
  const r = WIN.getBoundingClientRect();
  const x = clamp(r.left, 4, Math.max(4, window.innerWidth - r.width - 4));
  const y = clamp(r.top, 4, Math.max(4, window.innerHeight - 48));
  WIN.style.left = x + 'px'; WIN.style.top = y + 'px';
  // 3D表示中は下部パネルに重ならない高さにする（3D空間の上に浮かべる）
  const panel = document.querySelector('.panel3d');
  const limit = panel ? Math.max(180, panel.getBoundingClientRect().top - y - 8) : window.innerHeight - y - 12;
  WIN.style.maxHeight = Math.min(560, limit) + 'px';
}
function bindWinDrag(tb) {
  let sx, sy, ox, oy, id = null;
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('.x')) return;
    id = e.pointerId; tb.setPointerCapture(id);
    const r = WIN.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
  });
  tb.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    WIN.style.left = (ox + e.clientX - sx) + 'px'; WIN.style.top = (oy + e.clientY - sy) + 'px'; clampWin();
  });
  const end = e => { if (e.pointerId === id) { id = null; clampWin(); } };
  tb.addEventListener('pointerup', end); tb.addEventListener('pointercancel', end);
}

/* =========================================================
 * UI3D — 演奏会タブ（専用のゲーム画面）
 *   ・画面上部〜中央：3Dオーケストラ（主役）
 *   ・画面下部：コマンドパネル（固定。いま必要な操作だけを表示し、階層式に進む）
 *       操作を選ぶ → 詳細を選ぶ → 決定する → 元の画面に戻る
 *   ・画面全体はスクロールしない。項目が多いときはカテゴリー分け・ページ分割する
 *   ・3Dが使えない端末では3D領域を簡易表示に置き換え、同じ操作で遊べる
 * ========================================================= */
// 3Dの視点は正面に固定（プレイヤーが視点を選ぶ機能はなし）。練習中の演出とホールの下見だけ自動で視点が動く
const HALL_TOUR = [['front', '正面から'], ['hallRear', '客席の後方から'], ['hallSide', '客席の側方・上から'], ['fromStage', '舞台から客席を見る'], ['overview', '全体を見渡す']];
let STAGE_HOST = null, STAGE_TRIED = false;
function use3D() {
  if (UI.no3d) return false;
  if (!STAGE_TRIED) {
    STAGE_TRIED = true;
    try {
      STAGE_HOST = document.createElement('div'); STAGE_HOST.id = 'stage3d';
      document.body.appendChild(STAGE_HOST);
      if (typeof Stage3D === 'undefined' || !Stage3D.init(STAGE_HOST)) { STAGE_HOST.remove(); STAGE_HOST = null; }
    } catch (e) { STAGE_HOST = null; }
  }
  return !!(STAGE_HOST && Stage3D.ok);
}
const stageReason = () => (typeof Stage3D !== 'undefined' && Stage3D.reason) || '3D表示を初期化できませんでした';
function soundOn() { try { return localStorage.getItem('orchestraSim.sound') !== 'off'; } catch (e) { return true; } }

// 3D表示に今の状態を反映（会場・曲・指揮者・観客）
//   表示する3D空間は「いま何をしている場面か」だけで決める（ホールの選択・予約の状態とは切り離す）。
//   ・通常は常に練習室（ホールの一覧・詳細を見ているときや、予約した直後も練習室のまま）
//   ・「3Dで下見」の画面だけ、選んだホール（終了・予約したら練習室に戻る）
//   ・ホール練習の画面、演奏会の本番と結果の表示中は、予約済みのホール（終わったら練習室に戻る）
const HALL_SCREENS = ['hallPreview'];
function venueFor(c, scr) {
  if (scr.s === 'hallPreview' && scr.id) return scr.id;
  if (UI.showing || c.phase === 'result') return c.hallId || 'general';
  if (scr.s === 'rehearse' && c.hallId) return c.hallId;
  return PRACTICE_ROOM.id;
}
function sync3D(c) {
  if (!use3D()) return;
  try {
    const scr = cmdTop();
    const hallId = venueFor(c, scr);
    const songId = (scr.s === 'songDetail' && scr.id) || c.songId || null;
    const cdId = (scr.s === 'condDetail' && scr.id) || null;
    const cd = cdId ? STATE.conductors.find(x => x.id === cdId) : activeConductor();
    Stage3D.sync({ hallId, song: songId ? findSong(songId) : null, conductor: cd });
    // 準備・練習中は客席が空。本番準備では予想集客、結果では実際の来場者
    if (!Stage3D.isShowing()) {
      let fill = 0;
      if (c.phase === 'prep') fill = attendanceRate(c);
      if (c.phase === 'result' && c.result) fill = clamp(c.result.settlement.audience / findHall(c.hallId).capacity, 0, 1);
      if (HALL_SCREENS.includes(scr.s)) fill = 0.35;
      Stage3D.setAudienceFill(fill);
    }
  } catch (e) { console.error(e); }
}
function practiceQuality(c) {
  const q = {};
  for (const s of SECTIONS) q[s.id] = clamp(0.3 + mean(SECTION_PARAMS.map(p => c.perf.sections[s.id][p.id])) / 110, 0.3, 0.95);
  return q;
}
function showQuality(c) {
  const r = c.result, q = {};
  for (const s of SECTIONS) {
    const secAvg = mean(SECTION_PARAMS.map(p => c.perf.sections[s.id][p.id]));
    q[s.id] = clamp(0.35 + secAvg / 120 + (r.cats.ens - 50) / 250, 0.3, 1);
  }
  if (!r.success) { const worst = Object.entries(q).sort((a, b) => a[1] - b[1])[0][0]; q[worst] = Math.max(0.25, q[worst] - 0.12); }
  return q;
}

/* ---------- 画面（コマンド）の階層管理 ----------
 * UI.cmd = { cid, phase, stack:[{s, ...}] }。演奏会や段階が変わったら、その段階の最初の画面に戻す。
 * 決定内容は STATE に即保存されるので、途中で別タブへ移っても失われない。 */
function rootScreen(c) {
  if (c.phase === 'setup') return { s: c.started ? 'setup' : 'entry' };
  return { s: c.phase };   // practice / prep / result
}
function cmdState() {
  const c = activeConcert();
  if (!UI.cmd || UI.cmd.cid !== c.id || UI.cmd.phase !== c.phase) UI.cmd = { cid: c.id, phase: c.phase, stack: [rootScreen(c)] };
  if (c.phase === 'setup' && c.started && UI.cmd.stack[0].s === 'entry') UI.cmd.stack = [{ s: 'setup' }];
  return UI.cmd;
}
const cmdTop = () => { const st = cmdState().stack; return st[st.length - 1]; };
function cmdGo(scr) { cmdState().stack.push(scr); }
function cmdBack() { const st = cmdState().stack; if (st.length > 1) st.pop(); }
function cmdHome() { const st = cmdState().stack; st.splice(1); }
function cmdSet(patch) { Object.assign(cmdTop(), patch); }

/* ---------- 画面サイズ ---------- */
// 3D領域と操作パネルの高さを画面サイズから決める（縦長スマホ優先・PCでは上限あり）
function panelHeight(kind) {
  const vh = window.innerHeight || 780;
  if (kind === 'show') return 74;
  if (kind === 'short') return Math.round(clamp(vh * 0.27, 176, 230));
  return Math.round(clamp(vh * 0.42, 300, 400));
}
const ROW_H = 50;
function perPage(extra = 0) {
  const h = panelHeight('tall') - 46 - 62 - 14 - extra;   // 見出し・フッター・余白を除いた高さ
  return Math.max(2, Math.floor(h / ROW_H));
}
function paged(list, page, extra) {
  const n = perPage(extra), pages = Math.max(1, Math.ceil(list.length / n));
  const p = clamp(page || 0, 0, pages - 1);
  return { items: list.slice(p * n, p * n + n), page: p, pages };
}
const pager = pg => pg.pages > 1 ? `<div class="pager"><button data-act="cpage" data-d="-1" ${pg.page <= 0 ? 'disabled' : ''} aria-label="前のページ">‹</button><span>${pg.page + 1} / ${pg.pages}</span><button data-act="cpage" data-d="1" ${pg.page >= pg.pages - 1 ? 'disabled' : ''} aria-label="次のページ">›</button></div>` : '';
const tabs = (list, cur) => `<div class="ctabs">${list.map(([id, n]) => `<button class="${cur === id ? 'on' : ''}" data-act="ctab" data-v="${id}">${n}</button>`).join('')}</div>`;
const backBtn = (label = '戻る') => `<button class="cbtn" data-act="cback">← ${label}</button>`;

/* ---------- 演奏会タブ全体 ---------- */
function renderConcertGame(c) {
  const scr = cmdTop();
  const showing = UI.showing;
  const def = SCREENS[showing ? 'show' : scr.s] || SCREENS.setup;
  const kind = showing ? 'show' : def.kind || 'tall';
  const ph = panelHeight(kind);
  document.documentElement.style.setProperty('--panel', ph + 'px');
  const out = def.render(c, scr);
  const venue = use3D() ? venueFor(c, scr) : '';
  const place = venue === PRACTICE_ROOM.id ? PRACTICE_ROOM.name : ((findHall(venue) || {}).name || '');
  const stageArea = use3D()
    ? `<div class="ov3d"><div class="camrow"><span class="venue" id="venue3d">${esc(place)}</span><button class="snd" data-act="sound" aria-label="音声">${soundOn() ? '♪ 音あり' : '♪ 消音'}</button></div>
        ${showing ? `<div class="caption" id="cap3d">${esc(UI.caption || '開演前')}</div>` : ''}</div>`
    : `<div class="stage2d"><div class="s2-hall">${esc((findHall(c.hallId) || {}).name || 'コンサートホール')}</div><div class="s2-song">${esc((findSong(c.songId) || {}).title || '曲目未定')}</div>
        <div class="s2-note">3D表示を利用できないため簡易表示です<br><small>${esc(stageReason())}</small></div></div>`;
  return `${stageArea}
  <section class="cmd k-${kind}" style="height:${ph}px" aria-label="操作パネル">
    ${out.head !== false ? `<div class="chead">${out.back ? backBtn(out.backLabel) : ''}<div class="crumb">${out.crumb || ''}</div>${out.badge || ''}</div>` : ''}
    <div class="cbody">${out.body}</div>
    ${out.foot ? `<div class="cfoot">${out.foot}</div>` : ''}
  </section>`;
}

/* ---------- 各画面 ---------- */
const statusMark = ok => ok ? '<span class="mk ok">✓</span>' : '<span class="mk">○</span>';
const shortMini = s => { const sh = shortageOf(s); return sh.items.some(i => i.missing) ? '<span class="tag bad">楽器欠員</span>' : sh.items.length ? `<span class="tag warn">不足${sh.items.reduce((a, i) => a + i.lack, 0)}名</span>` : '<span class="tag ok">編成OK</span>'; };
function focusGrid(path, f) {
  const t = ftotal(f);
  return `<div class="fgrid">${FOCUS.map(x => `<div class="fcell ${f[x.id] ? 'on' : ''}"><span class="fl">${x.name}</span>
    <button data-act="fp" data-path="${path}" data-f="${x.id}" data-d="-1" ${f[x.id] <= 0 ? 'disabled' : ''} aria-label="${x.name}を減らす">−</button><b>${f[x.id]}</b>
    <button data-act="fp" data-path="${path}" data-f="${x.id}" data-d="1" ${t >= CONFIG.focusPoints ? 'disabled' : ''} aria-label="${x.name}を増やす">＋</button></div>`).join('')}</div>`;
}
const pts = f => { const t = ftotal(f); return `<span class="cbadge ${t === CONFIG.focusPoints ? 'ok' : 'ng'}">配分 ${t}/${CONFIG.focusPoints}</span>`; };
