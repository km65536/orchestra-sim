<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<title>楽団運営記 ― オーケストラ運営シミュレーション</title>
<style>:root{
  --bg:#12131a; --bg2:#1a1c26; --card:#20232f; --card2:#272a38; --line:#343849;
  --ink:#ece6d8; --ink2:#b9b2a3; --ink3:#857f74;
  --gold:#c9a45c; --gold2:#e3c98f; --wine:#8a2e3c; --wine2:#a8404f;
  --ok:#6fa77d; --warn:#d49a4a; --bad:#c9575f; --blue:#6c8fc7;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --r:12px; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;overflow-x:hidden}
body{background:radial-gradient(1200px 500px at 50% -200px,#2a2233 0%,transparent 60%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom))}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(18,19,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top .name{font-family:var(--serif);font-size:17px;letter-spacing:.06em;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:2px}
.top .meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,23,32,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:11.5px;position:relative}
.nav button .ic{font-size:19px;line-height:1;font-family:var(--serif)}
.nav button.on{color:var(--gold2)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--gold)}
.nav .dot{position:absolute;top:10px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--wine2)}

main{padding:14px 14px 0}
h2{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.05em;margin:6px 2px 12px;color:var(--ink)}
h3{font-family:var(--serif);font-weight:600;font-size:16px;margin:0 0 10px;color:var(--gold2);letter-spacing:.04em}
.sub{color:var(--ink2);font-size:13px}
.muted{color:var(--ink3);font-size:12.5px}
.card{background:linear-gradient(180deg,var(--card),#1d1f2a);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.gold{border-color:#5a4a2c;background:linear-gradient(180deg,#2a2620,#1f1d1a)}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14.5px;color:var(--ink)}
.btn.pri{background:linear-gradient(180deg,var(--wine2),var(--wine));border-color:#b8545f;color:#fff6ee}
.btn.gold{background:linear-gradient(180deg,#d4b06a,#a8853f);border-color:#e0c286;color:#1b160d}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 6px;border-radius:6px;font-family:var(--serif);font-weight:700;font-size:14px;border:1px solid}
.rk-S{color:#ffe7a3;border-color:#c9a45c;background:#4a3a18}
.rk-A{color:#ffd0d6;border-color:#a8404f;background:#3d1c23}
.rk-B{color:#cfe0ff;border-color:#4f6ea3;background:#1d2840}
.rk-C{color:#cfeed7;border-color:#4d7d5a;background:#1b2d21}
.rk-D{color:#e6dccb;border-color:#6d6455;background:#2a2721}
.rk-E{color:#aaa39a;border-color:#4a4640;background:#22211e}
.tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:999px;background:#2c2f3e;color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.warn{background:#3a2a17;border-color:#7a5a2a;color:#f0c27a}
.tag.bad{background:#3a1c20;border-color:#7a3038;color:#ffb3b9}
.tag.ok{background:#1b2e22;border-color:#3d6b4b;color:#a9dcb6}
.tag.gold{background:#3a3020;border-color:#6d5a33;color:var(--gold2)}

/* bars */
.bar{position:relative;height:8px;border-radius:4px;background:#2b2e3c;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#8b6f3a,var(--gold))}
.bar .pot{background:rgba(201,164,92,.22)}
.bar.blue i{background:linear-gradient(90deg,#3d5684,var(--blue))}
.bar.wine i{background:linear-gradient(90deg,#5d2430,var(--wine2))}
.stat{display:grid;grid-template-columns:92px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.stat .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .v small{color:var(--ink3)}

/* home */
.hero{text-align:center;padding:18px 14px}
.hero .ttl{font-family:var(--serif);font-size:21px;letter-spacing:.08em;color:var(--gold2)}
.hero .phase{margin:6px 0 14px;color:var(--ink2);font-size:13.5px}
.prog-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#1b1d27;margin-bottom:8px;text-align:left;width:100%}
.prog-item .slot{font-size:11.5px;color:var(--gold);width:52px;flex:none;font-family:var(--serif)}
.prog-item .t{font-family:var(--serif);font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#1b1d27;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpi .l{font-size:11.5px;color:var(--ink3)}
.kpi .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

/* steps */
.steps{display:flex;gap:4px;margin:0 0 14px}
.steps span{flex:1;height:4px;border-radius:2px;background:#2b2e3c}
.steps span.on{background:var(--gold)}
.steps span.done{background:#6b5a37}
.steplbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin:-10px 0 12px}

/* members */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#1b1d27;color:var(--ink2);font-size:13px}
.seg button.on{background:#3a3020;border-color:#6d5a33;color:var(--gold2)}
.inst-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);color:var(--gold2);font-size:14px;margin:14px 2px 6px}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;border-radius:10px;background:#1b1d27;border:1px solid var(--line);margin-bottom:6px}
.mrow .nm{font-size:14.5px}
.mrow .oc{color:var(--gold);font-size:11px;margin-left:4px}
.spark{display:flex;gap:2px;align-items:flex-end;height:22px}
.spark i{width:5px;border-radius:1px;background:var(--gold);opacity:.85}
.mrow.sel{border-color:var(--gold);background:#2a2620}

/* candidate */
.cand .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cand .cost{font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums}
.reason{font-size:12px;color:#f0a8ae;margin-top:6px}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.cmp th{color:var(--ink2);font-weight:500;font-size:11.5px}
.cmp td.l{text-align:left;color:var(--ink2);white-space:nowrap}
.cmp .best{color:var(--gold2);font-weight:700}
.cmp small{color:var(--ink3)}
.capgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.capgrid div{background:#1b1d27;border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;font-size:11.5px}
.capgrid div b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.capgrid div.full{border-color:#6d5a33}

/* song list */
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#1b1d27}
.tabs2 button{min-height:50px;font-family:var(--serif);font-size:15.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.tabs2 button small{font-family:var(--sans);font-size:11px;color:var(--ink3)}
.tabs2 button.on{background:linear-gradient(180deg,#3a3020,#2a2620);color:var(--gold2)}
.songlist{display:flex;flex-direction:column;gap:7px;padding-bottom:110px}
.sitem{display:flex;align-items:stretch;width:100%;text-align:left;background:#1b1d27;border:1px solid var(--line);border-radius:10px;padding:0}
.sitem.picked{border-color:var(--gold);background:linear-gradient(90deg,#2d271c,#1b1d27)}
.sitem .chk{width:38px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:15px}
.sitem.picked .chk{color:var(--gold2)}
.sitem .body{flex:1;min-width:0;padding:10px 10px 10px 0;display:flex;flex-direction:column}
.sitem .body .t{font-family:var(--serif);font-size:14.5px;line-height:1.35}
.sitem .body .c{font-size:12px;color:var(--ink2)}
.sitem .body .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.selbar,.trbar{position:sticky;bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom));z-index:15;background:rgba(32,35,47,.97);border:1px solid #5a4a2c;border-radius:12px;padding:10px 12px;box-shadow:0 -6px 24px rgba(0,0,0,.45);margin-bottom:12px}
.selbar .ellip{margin-bottom:8px}
/* halls */
.hall .hn{font-family:var(--serif);font-size:16px;margin-top:4px}
.hall .fee{font-weight:700;color:var(--gold2);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv3{grid-template-columns:84px 1fr}
.funds{font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.neg{color:#ff9aa3 !important}.pos{color:#a9dcb6}
.tag.blue{background:#1d2840;border-color:#4f6ea3;color:#cfe0ff}
.ledger{font-size:13px}.ledger .row{padding:4px 0;border-bottom:1px dashed var(--line)}.ledger .total{border-bottom:none;padding-top:8px}
/* training */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.tgrid button{text-align:left;padding:10px;border-radius:10px;border:1px solid var(--line);background:#1b1d27;min-height:72px;position:relative}
.tgrid button .ic{position:absolute;right:10px;top:8px;font-family:var(--serif);font-size:20px;color:#4a4436}
.tgrid button b{display:block;font-family:var(--serif);font-size:13.5px;padding-right:22px;line-height:1.35}
.tgrid button span:last-child{font-size:11px;color:var(--ink3)}
.tgrid button.on{border-color:var(--gold);background:#2a2620}
.tgrid button.on .ic{color:var(--gold)}
.wrapseg{flex-wrap:wrap;overflow:visible}
.trres{border-color:var(--gold);background:radial-gradient(400px 160px at 50% 0,#3a3020,#1f1d1a)}
.trres .msg{font-family:var(--serif);font-size:18px;color:var(--gold2);text-align:center;margin:4px 0;letter-spacing:.04em}
/* practice */
.menus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.menus button{padding:10px 2px;border-radius:10px;border:1px solid var(--line);background:#1b1d27;font-size:13px;line-height:1.3;min-height:60px}
.menus button b{display:block;font-family:var(--serif);font-size:13.5px;white-space:nowrap;color:var(--ink)}
.menus button span{font-size:10.5px;color:var(--ink3)}
.menus button.on{border-color:var(--gold);background:#2a2620}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:430px){.focus{grid-template-columns:1fr}.fitem{padding:2px 4px 2px 12px}}
.fitem{display:flex;align-items:center;justify-content:space-between;background:#1b1d27;border:1px solid var(--line);border-radius:9px;padding:4px 4px 4px 10px;font-size:13px}
.fitem.on{border-color:#6d5a33;background:#262219}
.fitem .ctl{display:flex;align-items:center}
.fitem .ctl button{width:34px;height:34px;border-radius:7px;background:#2b2e3c;font-size:17px;line-height:1}
.fitem .ctl button:disabled{opacity:.3}
.fitem .ctl b{width:22px;text-align:center;font-variant-numeric:tabular-nums}
.ptotal{display:flex;justify-content:space-between;align-items:center;margin:8px 0 2px;font-size:13px}
.ptotal .ok{color:var(--ok)} .ptotal .ng{color:var(--warn)}
.acc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#1b1d27;overflow:hidden}
.acc>.ah{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;text-align:left;min-height:52px}
.acc>.ah .nm{font-family:var(--serif);font-size:15px;width:52px;flex:none;color:var(--gold2)}
.acc>.ah .sum{flex:1;min-width:0;font-size:12px;color:var(--ink2)}
.acc>.ab{padding:0 10px 10px}
.delta{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums}
.dgrid{display:grid;grid-template-columns:58px repeat(7,1fr);gap:2px;font-size:11px;text-align:center;font-variant-numeric:tabular-nums}
.dgrid .h{color:var(--ink3);font-size:10px}
.dgrid .s{color:var(--gold2);text-align:left;font-family:var(--serif);font-size:12px}
.dgrid .z{color:#4a4e60}
.growl{font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px}

/* prep / result */
.prob{text-align:center;padding:6px 0}
.prob .big{font-family:var(--serif);font-size:46px;color:var(--gold2);line-height:1.1;font-variant-numeric:tabular-nums}
.prob .big small{font-size:20px}
.pol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pol button{text-align:left;padding:10px;border-radius:10px;border:1px solid var(--line);background:#1b1d27;min-height:80px}
.pol button b{display:block;font-family:var(--serif);font-size:14px}
.pol button span{font-size:11px;color:var(--ink3);line-height:1.4;display:block;margin-top:3px}
.pol button.on{border-color:var(--gold);background:#2a2620}
.short{border-left:3px solid var(--bad);padding:6px 10px;background:#2a1a1d;border-radius:0 8px 8px 0;margin:6px 0;font-size:13px}
.grade{font-family:var(--serif);font-size:72px;line-height:1;text-align:center;color:var(--gold2);text-shadow:0 0 30px rgba(201,164,92,.35)}
.review{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.review:last-child{border-bottom:none}
.review b{font-family:var(--serif);color:var(--gold);font-weight:600;margin-right:6px;font-size:13px}
.stamp{display:inline-block;padding:4px 14px;border:2px solid;border-radius:6px;font-family:var(--serif);font-size:15px;letter-spacing:.1em;transform:rotate(-3deg)}
.stamp.ok{color:#a9dcb6;border-color:#4d7d5a}
.stamp.ng{color:#ffb3b9;border-color:#a8404f}

/* floating song window */
.fwin{position:fixed;z-index:60;width:min(380px,calc(100vw - 16px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:#1e202b;border:1px solid #5a4a2c;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.fwin[hidden]{display:none}
.fwin .tb{display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;height:44px;flex:none;background:linear-gradient(180deg,#2e2a22,#25221c);border-bottom:1px solid #4a3e27;border-radius:12px 12px 0 0;cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}
.fwin .tb .tt{flex:1;min-width:0;font-family:var(--serif);font-size:13.5px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwin .tb .x{width:40px;height:40px;font-size:20px;color:var(--ink2);border-radius:8px}
.fwin .wb{overflow-y:auto;padding:12px 14px 14px;font-size:13.5px}
.fwin .song-t{font-family:var(--serif);font-size:18px;line-height:1.35;margin-bottom:2px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:13px;margin:10px 0}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.ro{font-size:11px;color:var(--ink3);text-align:right;margin-top:6px}

/* sheet (member detail) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:#1e202b;border-top:1px solid #5a4a2c;border-radius:16px 16px 0 0;max-height:86vh;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:#4a4e60;margin:4px auto 10px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%);z-index:70;background:#2e2a22;border:1px solid #6d5a33;color:var(--gold2);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.input{width:100%;min-height:44px;border-radius:9px;border:1px solid var(--line);background:#14151d;color:var(--ink);padding:0 12px;font:inherit}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:36px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--ink3)}
details.fold[open]>summary::after{content:"－"}

/* ---------- 演奏会タブ：専用ゲーム画面（上：3D／下：コマンドパネル） ---------- */
body.game{overflow:hidden;overscroll-behavior:none;height:100vh;height:100dvh}
body.game #app{padding-bottom:0;min-height:0}
main.gm{padding:0}
.top.compact{padding:calc(6px + env(safe-area-inset-top)) 14px 6px}
.top.compact .ph{font-family:var(--serif);color:var(--gold2);font-weight:600;font-size:14px}
.top.compact .funds{font-size:15px}
#stage3d,.stage2d{position:fixed;left:0;right:0;top:var(--hdr,40px);bottom:calc(var(--nav) + var(--panel,320px) + env(safe-area-inset-bottom));z-index:1;background:#0c0a09}
#stage3d{display:none}
body.mode3d #stage3d{display:block}
#stage3d canvas{width:100%;height:100%;display:block;touch-action:pan-y}
.stage2d{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;background:radial-gradient(500px 260px at 50% 75%,#5a3a20,#1a120c 70%);color:var(--ink2)}
.stage2d .s2-hall{font-family:var(--serif);color:var(--gold2);font-size:17px}
.stage2d .s2-song{font-family:var(--serif);font-size:15px;color:var(--ink)}
.stage2d .s2-note{font-size:11.5px;color:var(--ink3);margin-top:8px}
.ov3d{position:fixed;left:0;right:0;top:var(--hdr,40px);z-index:12;pointer-events:none;max-width:560px;margin:0 auto}
.camrow{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;pointer-events:auto;scrollbar-width:none}
.camrow::-webkit-scrollbar{display:none}
.camrow button{flex:none;min-height:34px;padding:0 12px;border-radius:999px;background:rgba(18,18,26,.7);border:1px solid rgba(255,255,255,.16);color:var(--ink2);font-size:12.5px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.camrow button.on{color:var(--gold2);border-color:var(--gold);background:rgba(58,48,32,.82)}
.caption{margin:4px auto 0;width:max-content;max-width:88%;padding:7px 18px;border-radius:999px;background:rgba(20,18,14,.78);border:1px solid #6d5a33;color:var(--gold2);font-family:var(--serif);font-size:15px;letter-spacing:.06em;text-align:center}
.caption.pop{animation:tin .45s ease}

/* コマンドパネル */
.cmd{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:10;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(30,28,36,.98),rgba(20,20,28,.99));border-top:1px solid #6d5a33;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.55);overflow:hidden}
.chead{flex:none;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.chead .cbtn{min-height:34px;padding:0 10px;font-size:13px;flex:none}
.crumb{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden}
.crumb b{font-family:var(--serif);font-size:15px;color:var(--gold2);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.cbadge{flex:none;font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.cbadge.ok{border-color:#3d6b4b;color:#a9dcb6}.cbadge.ng{border-color:#7a5a2a;color:#f0c27a}
.cbody{flex:1;min-height:0;overflow:hidden;padding:8px 12px 4px;display:flex;flex-direction:column;gap:6px}
.cfoot{flex:none;height:62px;display:flex;align-items:center;gap:8px;padding:0 12px 6px}
.cfoot>.muted{flex:1;text-align:center;font-size:12px}
.cbtn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 14px;border-radius:11px;background:#2a2c3a;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);flex:1;white-space:nowrap}
.cbtn.pri{background:linear-gradient(180deg,var(--wine2),var(--wine));border-color:#b8545f;color:#fff6ee}
.cbtn.big{flex:1;min-height:50px;font-size:15.5px;font-family:var(--serif);letter-spacing:.05em}
.cbtn:disabled{opacity:.42}
.cbtn:active:not(:disabled){transform:translateY(1px)}
.cmsg{font-family:var(--serif);color:var(--ink);font-size:14.5px}
.cnote{font-size:12.5px;color:var(--ink2)}
.cnote.ell,.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.creason{font-size:12px;color:#f0a8ae}
.citem{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 12px;border-radius:12px;background:#1b1d27;border:1px solid var(--line);text-align:left;flex:none}
.citem.done{border-color:#3d6b4b;background:linear-gradient(90deg,#1b2a21,#1b1d27)}
.citem .grow{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.ci-l{font-family:var(--serif);font-size:15px}
.ci-v{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{width:26px;height:26px;border-radius:50%;border:2px solid #5a5e70;display:inline-flex;align-items:center;justify-content:center;flex:none;color:transparent;font-weight:700}
.mk.ok{border-color:#6fa77d;background:#2c5a3a;color:#d9f5e0}
.chev{color:var(--ink3);font-size:18px}
.crow{display:flex;align-items:center;gap:8px;width:100%;height:46px;flex:none;padding:0 10px;border-radius:10px;background:#1b1d27;border:1px solid var(--line);text-align:left}
.crow.slim{height:44px}
.crow.sel{border-color:var(--gold);background:linear-gradient(90deg,#2d271c,#1b1d27)}
.crow.peek{border-color:#4f6ea3}
.crow.static{cursor:default}
.cr-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.cr-t{font-family:var(--serif);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-s{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-fee{font-weight:700;color:var(--gold2);font-size:13px;white-space:nowrap}
.sn{font-family:var(--serif);color:var(--gold2);width:48px;flex:none;font-size:14px}
.bigrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.bigrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;padding:8px 4px;border-radius:12px;background:linear-gradient(180deg,#2a2620,#1d1b18);border:1px solid #5a4a2c;text-align:center}
.bigbtn b{font-family:var(--serif);font-size:15px;color:var(--gold2);font-weight:600}
.bigbtn span{font-size:11px;color:var(--ink3)}
.bigbtn i{font-style:normal;margin-top:2px}
.ctabs{display:flex;gap:4px;flex:none;overflow-x:auto;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{flex:1;min-width:max-content;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:#1b1d27;color:var(--ink2);font-size:13px}
.ctabs button.on{background:#3a3020;border-color:#6d5a33;color:var(--gold2)}
.dbox{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.dt{font-family:var(--serif);font-size:16px;line-height:1.3;display:flex;align-items:center;gap:6px}
.ds{font-size:12px;color:var(--ink2)}
.dsm{font-family:var(--sans);font-size:11px;margin-left:auto;white-space:nowrap}
.dtags{display:flex;flex-wrap:wrap;gap:4px}
.dd{margin:2px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.kgrid span{background:#1b1d27;border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:10.5px;color:var(--ink3);display:flex;flex-direction:column}
.kgrid b{font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap}
.kvc{display:grid;grid-template-columns:52px 1fr;gap:6px;font-size:12.5px;line-height:1.45}
.kvc>span:first-child{color:var(--ink3)}
.warnt{color:#f0c27a}.okt{color:#a9dcb6}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px}
.fcell{display:flex;align-items:center;height:40px;border-radius:9px;background:#1b1d27;border:1px solid var(--line);padding:0 3px 0 9px;font-size:12.5px}
.fcell.on{border-color:#6d5a33;background:#262219}
.fcell .fl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcell button{width:34px;height:32px;border-radius:7px;background:#2b2e3c;font-size:17px;line-height:1;flex:none}
.fcell button:disabled{opacity:.3}
.fcell b{width:20px;text-align:center;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:6px;flex:none}
.pager button{width:44px;height:44px;border-radius:10px;background:#2a2c3a;border:1px solid var(--line);font-size:20px}
.pager button:disabled{opacity:.3}
.pager span{min-width:44px;text-align:center;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cfoot .pager+.cbtn{flex:1}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:#3a3d4c}
.dots i.d{background:#8b6f3a}.dots i.n{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}
.tiles>*{min-width:0}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:54px;line-height:1.3;padding:6px 11px;border-radius:11px;background:#1b1d27;border:1px solid var(--line);text-align:left}
.tile span{font-size:11px;color:var(--ink3)}
.tile b{font-size:14px;font-family:var(--serif);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.done{border-color:#3d6b4b}.tile.warn{border-color:#7a5a2a}
.tiles.sec5{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tile b.sm{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--ink2)}
.probrow{display:flex;align-items:center;gap:12px}
.pbig{font-family:var(--serif);font-size:42px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.pbig small{font-size:18px}
.pinfo{display:flex;flex-direction:column;min-width:0;font-size:12.5px}
.resrow{display:flex;align-items:center;gap:12px}
.rgrade{font-family:var(--serif);font-size:54px;line-height:1;color:var(--gold2);text-shadow:0 0 24px rgba(201,164,92,.35);width:56px;text-align:center}
.rinfo{display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.rinfo .stamp{align-self:flex-start;font-size:12.5px;padding:1px 10px;transform:none}
.pol2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}
.pol2 button{text-align:left;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:#1b1d27;min-height:76px}
.pol2 button b{display:block;font-family:var(--serif);font-size:14px}
.pol2 button span{font-size:11px;color:var(--ink3);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pol2 button.on{border-color:var(--gold);background:#2a2620}
.dgrid.mini{font-size:10.5px;row-gap:1px}
.rv{font-size:12.5px;line-height:1.5;padding:6px 0;border-bottom:1px solid var(--line)}
.rv b{font-family:var(--serif);color:var(--gold);margin-right:6px}
.entry{text-align:center;display:flex;flex-direction:column;gap:3px;justify-content:center;flex:1}
.entry .et{font-family:var(--serif);font-size:21px;color:var(--gold2);letter-spacing:.06em}
.showbar{display:flex;align-items:center;gap:10px;height:100%}
.showbar .muted{flex:1;font-size:12px}
.showbar .cbtn{flex:none}
.k-show .cbody{padding:10px 12px}
/* 縦が短い画面では詰める */
@media (max-height:720px){
  .cbody{gap:5px;padding-top:6px}
  .citem{min-height:46px;padding:4px 12px}
  .resrow{gap:8px}
  .tiles{gap:5px}
  .bigbtn{min-height:68px}
  .fcell{height:37px}
  .dd{-webkit-line-clamp:2}
  .tile{min-height:47px;padding:4px 10px}
  .pbig{font-size:36px}
  .rgrade{font-size:46px}
  .pol2 button{min-height:68px}
  .stat{margin:3px 0}
}
.btn.on{border-color:var(--gold);color:var(--gold2)}
.tag.prin{margin-left:6px;padding:1px 6px;font-size:10.5px}
.condcta{border-color:#4a3e5a;background:linear-gradient(180deg,#25222f,#1d1c27)}
body.game .toast{bottom:calc(var(--nav) + var(--panel,320px) + 12px + env(safe-area-inset-bottom))}
/* 3D上部の表示：今いる場所（練習室／ホール名）と音声ボタン。視点は正面固定のため視点ボタンはなし */
.camrow .venue{flex:0 1 auto;min-width:0;align-self:center;font-size:12.5px;color:var(--ink);padding:5px 10px;border-radius:999px;background:rgba(18,18,26,.7);margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ======================================================================
 * ホーム・団員・育成・記録：階層型の固定画面（body.tabsui / .tv 配下のみに適用）
 * ※ 演奏会タブ（body.game）には影響しない
 * ====================================================================== */
body.tabsui{overflow:hidden;height:100vh;height:100dvh;overscroll-behavior:none}
body.tabsui #app{padding-bottom:0;min-height:0}
.tv{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav) + 1px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.tv *{box-sizing:border-box}
.sbar{flex:none;height:calc(58px + env(safe-area-inset-top));padding:calc(5px + env(safe-area-inset-top)) 12px 5px;background:rgba(18,19,26,.97);border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.sb-name{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-stats{display:flex;gap:8px}
.sb-c{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.sb-c.wide{flex:1.7}
.sb-c small{font-size:11px;color:var(--ink3)}
.sb-c b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-c.wide b{color:var(--gold2)}
.sb-c b i{font-style:normal;font-size:11px;color:var(--ink3);margin-left:1px}
.thead{flex:none;height:50px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.tback{flex:none;min-width:78px;height:40px;border-radius:10px;background:#2a2c3a;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink)}
.tback.ph{visibility:hidden;display:inline-block}
.ttitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.ttitle small{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttitle b{font-family:var(--serif);font-size:17px;color:var(--gold2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbadge{flex:none;font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tbody{flex:1;min-height:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tfoot{flex:none;height:64px;display:flex;align-items:center;gap:8px;padding:0 14px 8px}
.tbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 12px;border-radius:11px;background:#2a2c3a;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.tbtn.pri{background:linear-gradient(180deg,var(--wine2),var(--wine));border-color:#b8545f;color:#fff6ee}
.tbtn.sm{min-height:44px;font-size:13.5px}
.tbtn:disabled{opacity:.42}
.tbtn:active:not(:disabled),.trow:active,.tcat:active,.ttile:active{transform:translateY(1px)}
.tnote{font-size:12.5px;color:var(--ink2);line-height:1.5}
.tnote.center{text-align:center}
.tlabel{font-family:var(--serif);font-size:13px;color:var(--gold);letter-spacing:.08em;margin-top:2px}
.tempty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13.5px;text-align:center}
.treason{font-size:12.5px;color:#f0a8ae}
.trow{flex:none;display:flex;align-items:center;gap:9px;width:100%;height:56px;padding:0 12px;border-radius:12px;background:#1b1d27;border:1px solid var(--line);text-align:left}
.trow.slim{height:44px}
.trow.sel{border-color:var(--gold);background:linear-gradient(90deg,#2d271c,#1b1d27)}
.trow.done{opacity:.6}
.trow.static{cursor:default}
.trow.static .chev{display:none}
.tr-m{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.28}
.tr-t{font-family:var(--serif);font-size:14.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tr-t small{font-family:var(--sans)}
.tr-s{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-r{flex:none;font-size:13px;font-weight:700;color:var(--gold2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tr-r small{font-size:11px;color:var(--ink3);font-weight:500}
.trow .chev{flex:none;color:var(--ink3);font-size:18px}
.trow.note .ni{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#2a2c3a}
.trow.note.go .ni{background:#5d2430;color:#fff}.trow.note.warn .ni{background:#7a5a2a;color:#fff}.trow.note.ok .ni{background:#2c5a3a;color:#fff}
.trow.note .tr-t{font-family:var(--sans);font-size:13px}
.ticon{flex:none;width:34px;height:34px;border-radius:9px;background:#2a2620;border:1px solid #5a4a2c;display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--gold2);font-size:16px}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ttile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;height:86px;padding:8px 12px;border-radius:12px;background:#1b1d27;border:1px solid var(--line);text-align:left;min-width:0}
.ttile.warn{border-color:#7a5a2a}
.tt-l{font-size:12px;color:var(--ink3)}
.ttile b{font-family:var(--serif);font-size:16px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-s{font-size:12px;color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnext{flex:none;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,#2a2620,#1f1d1a);border:1px solid #5a4a2c;display:flex;flex-direction:column;gap:4px}
.tn-l{font-size:12px;color:var(--gold);letter-spacing:.1em}
.tn-t{font-family:var(--serif);font-size:17px;color:var(--gold2)}
.tn-s{font-size:13px;color:var(--ink2)}
.tnext .tbtn{margin-top:4px;flex:none}
.tbig{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:10px 14px;border-radius:12px;background:#1b1d27;border:1px solid var(--line)}
.tbig small{font-size:12px;color:var(--ink3)}
.tbig b{font-family:var(--serif);font-size:24px;color:var(--gold2);font-variant-numeric:tabular-nums}
.tbig.sm b{font-size:19px}
.tkv{flex:none;display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.45;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.tkv>span:first-child{color:var(--ink3)}
.tranks{display:flex;gap:8px;flex-wrap:wrap}
.tranks span{display:flex;align-items:center;gap:4px}
.tcat{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;height:72px;padding:8px 14px;border-radius:12px;background:linear-gradient(180deg,#25232b,#1b1b22);border:1px solid var(--line);text-align:left;min-width:0}
.tcat.wide{flex:none;height:60px;width:100%}
.tcat b{font-family:var(--serif);font-size:16px;color:var(--gold2);font-weight:600}
.tcat span{font-size:12px;color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trecruit{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:78px;width:100%;border-radius:14px;background:linear-gradient(180deg,var(--wine2),var(--wine));border:1px solid #b8545f;color:#fff6ee}
.trecruit b{font-family:var(--serif);font-size:18px;letter-spacing:.1em}
.trecruit span{font-size:12px;opacity:.9}
.tbigchoice{flex:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;height:84px;width:100%;padding:0 18px;border-radius:14px;background:linear-gradient(180deg,#2a2620,#1d1b18);border:1px solid #5a4a2c;text-align:left}
.tbigchoice b{font-family:var(--serif);font-size:18px;color:var(--gold2);font-weight:600}
.tbigchoice span{font-size:12.5px;color:var(--ink2)}
.tsub{flex:none;display:flex;gap:4px}
.tsub button{flex:1;min-width:0;height:40px;padding:0 4px;border-radius:9px;border:1px solid var(--line);background:#1b1d27;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.tsub button.on{background:#3a3020;border-color:#6d5a33;color:var(--gold2)}
.tpager{flex:1;display:flex;align-items:center;gap:8px}
.tpager button{flex:1;height:46px;border-radius:11px;background:#2a2c3a;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink)}
.tpager button:disabled{opacity:.32}
.tpager span{min-width:52px;text-align:center;font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tfoot .tpager+.tbtn{flex:none;padding:0 12px}
.tpair{flex:none;display:flex;gap:8px}
.tpair .input{flex:1;min-width:0}
.tpair .tbtn{flex:1}
.tpair .input+.tbtn{flex:none}
.tconfirm{flex:none;padding:16px;border-radius:12px;background:#1b1d27;border:1px solid var(--line);text-align:center;font-size:14px;line-height:1.7}
.tconfirm.left{text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;line-height:1.45}
.tc-msg{font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.tmhead{flex:none;display:flex;align-items:center;gap:8px}
.tmhead b{font-family:var(--serif);font-size:16px}
.tabil{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.tabil button{height:52px;border-radius:11px;background:#1b1d27;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.tabil button b{font-family:var(--serif);font-size:14px;font-weight:600}
.tabil button span{font-size:12px;color:var(--ink3)}
.tabil button.on{border-color:var(--gold);background:#2a2620}
.tabil button:disabled{opacity:.35}
.tresmsg{font-family:var(--serif);font-size:18px;color:var(--gold2);text-align:center;padding:6px 0;letter-spacing:.04em}
.tline{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:4px 2px;border-bottom:1px dashed rgba(255,255,255,.08);font-size:13px;line-height:1.4}
.tline>span{min-width:0}
.tline>b{flex:none;font-variant-numeric:tabular-nums}
.tline.total{border-bottom:none;font-weight:700}
.tline.rv2{min-height:0;align-items:flex-start}
.tline b.gold{color:var(--gold);font-family:var(--serif);margin-right:4px}
.tv .cmp{font-size:12.5px}
.tv .cmp small{display:block;font-size:11px;line-height:1.1}
.tv .cmp th,.tv .cmp td{padding:3px 2px;line-height:1.15}
.tv .stat .v small,.tv small{font-size:11px}
.tv .stat{margin:3px 0}
body.tabsui .toast{bottom:calc(var(--nav) + 76px + env(safe-area-inset-bottom))}

/* =========================================================
 * ページ全体のスクロール・拡大の禁止（全タブ共通）
 *   画面のレイアウトは変えず、ブラウザのスクロール・拡大・バウンスだけを止める。
 *   touch-action は既存の個別指定（ウインドウのドラッグ部分・3D画面）を優先する。
 * ========================================================= */
html{overflow:hidden;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow:hidden;overscroll-behavior:none}
*{touch-action:manipulation}

/* ---------- 練習中（演奏会タブのパネル内） ---------- */
.prbar{height:8px;border-radius:99px;background:#262836;overflow:hidden;flex:none}
.prbar i{display:block;height:100%;background:linear-gradient(90deg,#8a6d36,var(--gold2));border-radius:99px;transition:width .1s linear}
.prev{background:#241f17;border:1px solid #6d5a33;border-radius:10px;padding:8px 10px;flex:none}
.prev-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);min-width:0}
.prev-w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-w small{font-size:11px;color:var(--ink3)}
.prev-t{font-family:var(--serif);font-size:14px;color:var(--ink);margin-top:4px;line-height:1.45}
.prev.mini{padding:6px 10px}
.prev.mini .prev-t{font-size:13px;margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prev.done{background:#1b2a20;border-color:#3d6b4b}
.prev.done .prev-t{color:#a9dcb6}
.prch{display:flex;flex-direction:column;gap:6px;flex:none}
.prch .crow{height:auto;min-height:44px;padding:5px 10px}
.prlog{font-size:12px;line-height:1.25;color:var(--gold2);margin-top:-2px;flex:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dgrid.mini.ev{line-height:1.15}

/* ---------- 練習クイズ（演奏会タブのパネル内） ---------- */
.qz-song{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2);flex:none;min-width:0}
.qz-song .ell{min-width:0}
.qz-song span:last-child{flex:none;color:var(--gold2)}
.qz-q{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink);flex:none}
.qz-q.sm{font-size:13px;line-height:1.45;color:var(--ink2)}
.qz-ch{display:flex;flex-direction:column;gap:6px;flex:none}
.qz-c{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 12px;border-radius:10px;background:#1b1d27;border:1px solid var(--line);text-align:left;color:var(--ink);font-size:14px;line-height:1.35}
.qz-c i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:#2a2c3a;color:var(--gold2)}
.qz-c:active{background:#2a2433;border-color:var(--gold)}
.qz-v{display:flex;align-items:baseline;gap:10px;flex:none}
.qz-v b{font-family:var(--serif);font-size:20px}
.qz-v.ok b{color:#8fd6a3}.qz-v.ng b{color:#f09a8a}
.qz-v span{font-size:12.5px;color:var(--gold2)}
.qz-a{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:9px;font-size:14px;flex:none}
.qz-a span{flex:none;font-size:11.5px;color:var(--ink3)}
.qz-a.ok{background:#1b2a20;border:1px solid #3d6b4b;color:#bfe8c9}
.qz-a.ng{background:#2a1c1c;border:1px solid #7a3d3d;color:#f2c0b6}
.qz-e{font-size:13px;line-height:1.55;color:var(--ink);flex:none}
.qz-g{font-size:12.5px;color:var(--gold2);flex:none}
@media (max-height:620px){
  .qz-q{font-size:14.5px;line-height:1.42}.qz-q.sm{font-size:12.5px;line-height:1.4}
  .qz-e{font-size:12.5px;line-height:1.45}.qz-a{padding:4px 10px;font-size:13.5px}.qz-v b{font-size:18px}
  .qz-c{min-height:42px;padding:4px 12px}
}

":[]},{"id":"bach","name":"J.S.バッハ","songs":["air"],"questions":[{"id":"c_bach_1","category":"life","question":"J.S.バッハが後半生、音楽監督（カントル）を務めた教会がある町は？","answer":"ライプツィヒ","choices":["ライプツィヒ","ウィーン","ハンブルク","ボン"],"explanation":"ライプツィヒの聖トーマス教会のカントルとして、多くの教会カンタータを書きました。"},{"id":"c_bach_2","category":"hist","question":"バッハが活躍した時代の音楽様式は？","answer":"バロック","choices":["バロック","古典派","ロマン派","印象主義"],"explanation":"1600年頃から1750年頃（バッハの没年）までの音楽を、一般にバロック音楽と呼びます。"}]},{"id":"schubert","name":"シューベルト","songs":["rosamunde","schubert8"],"questions":[{"id":"c_schubert_1","category":"life","question":"シューベルトは、特にどの分野で数多くの作品を残し「歌曲王」と呼ばれた？","answer":"歌曲（リート）","choices":["歌曲（リート）","オペラ","バレエ","オルガン曲"],"explanation":"「魔王」「野ばら」など600曲を超える歌曲を残しました。31歳の若さで亡くなっています。"}]},{"id":"humperdinck","name":"フンパーディンク","songs":["hansel"],"questions":[]},{"id":"barber","name":"バーバー","songs":["adagio"],"questions":[{"id":"c_barber_1","category":"life","question":"サミュエル・バーバーの祖国は？","answer":"アメリカ","choices":["アメリカ","イギリス","カナダ","オーストラリア"],"explanation":"20世紀アメリカを代表する作曲家のひとりです。"}]},{"id":"berlioz","name":"ベルリオーズ","songs":["fantastique"],"questions":[{"id":"c_berlioz_1","category":"life","question":"ベルリオーズが著した、楽器の使い方を解説した有名な本は？","answer":"管弦楽法（大管弦楽法）","choices":["管弦楽法（大管弦楽法）","和声学","音楽の喜び","楽典入門"],"explanation":"楽器ごとの特徴や組み合わせ方を論じた本で、後の作曲家たちに大きな影響を与えました。"}]},{"id":"mahler","name":"マーラー","songs":["mahler1"],"questions":[{"id":"c_mahler_1","category":"life","question":"マーラーは作曲家であると同時に、何として名声を得ていた？","answer":"指揮者","choices":["指揮者","ピアニスト","音楽評論家","オルガン奏者"],"explanation":"ウィーン宮廷歌劇場の音楽監督などを務めた、当代一流の指揮者でした。"}]},{"id":"rachmaninoff","name":"ラフマニノフ","songs":["rach2"],"questions":[{"id":"c_rachmaninoff_1","category":"life","question":"ラフマニノフは作曲家であると同時に、何として世界的に活躍した？","answer":"ピアニスト","choices":["ピアニスト","ヴァイオリニスト","オペラ歌手","指揮者のみ"],"explanation":"大きな手を持つ名ピアニストで、自作のピアノ協奏曲を自ら演奏しました。"},{"id":"c_rachmaninoff_2","category":"bg","question":"交響曲第2番の大成功の前に、ラフマニノフを深く落ち込ませた出来事は？","answer":"交響曲第1番の初演の失敗","choices":["交響曲第1番の初演の失敗","恩師との決別","祖国からの追放","演奏旅行中の事故"],"explanation":"1897年の第1番の初演が不評で、しばらく作曲ができなくなりました。"}]}]},"quizzes/general":{"_説明":"音楽史・音楽用語・楽典などの一般問題（どの曲の練習でも出題）。categories は問題の分類名です。","categories":{"life":"作曲家の生涯","bg":"作曲の背景","form":"曲の構成・特徴","orch":"楽器編成","hist":"音楽史・様式","term":"音楽用語","theory":"楽典","trivia":"豆知識"},"questions":[{"id":"g_8","category":"hist","question":"100曲以上の交響曲を書き、「交響曲の父」と呼ばれる作曲家は？","answer":"ハイドン","choices":["ハイドン","バッハ","ヘンデル","ヴィヴァルディ"],"explanation":"ハイドンは交響曲の形式を確立し、モーツァルトやベートーヴェンに大きな影響を与えました。"},{"id":"g_9","category":"hist","question":"ハイドン・モーツァルト・ベートーヴェンに代表される音楽様式は？","answer":"古典派","choices":["古典派","バロック","ロマン派","印象主義"],"explanation":"18世紀後半から19世紀初めの、均整のとれた形式を重んじる様式です。"},{"id":"g_10","category":"term","question":"「Andante（アンダンテ）」の意味は？","answer":"歩くような速さで","choices":["歩くような速さで","非常に速く","できるだけ弱く","だんだん速く"],"explanation":"イタリア語で「歩く」に由来する速度記号です。"},{"id":"g_11","category":"term","question":"「crescendo（クレッシェンド）」の意味は？","answer":"だんだん強く","choices":["だんだん強く","だんだん弱く","だんだん速く","だんだん遅く"],"explanation":"反対に「だんだん弱く」はデクレッシェンド（ディミヌエンド）です。"},{"id":"g_12","category":"term","question":"弦楽器で「pizzicato（ピッツィカート）」と書かれていたら？","answer":"弦を指ではじく","choices":["弦を指ではじく","弓の木の部分で弾く","弱音器を付ける","駒の近くで弾く"],"explanation":"弓を使わず、指で弦をはじいて音を出す奏法です。弓に戻るときは「arco（アルコ）」と書かれます。"},{"id":"g_13","category":"term","question":"「tutti（トゥッティ）」の意味は？","answer":"全員で","choices":["全員で","独奏で","静かに","繰り返して"],"explanation":"イタリア語で「すべて」。独奏（ソロ）に対して、全員で演奏する部分を指します。"},{"id":"g_14","category":"term","question":"楽章の終わりに書かれた「attacca（アタッカ）」の意味は？","answer":"休まずすぐに次へ続ける","choices":["休まずすぐに次へ続ける","強いアクセントを付ける","最初に戻る","ここで終わる"],"explanation":"楽章の間を空けずに、すぐ次の楽章を始める指示です。"},{"id":"g_15","category":"term","question":"音符や休符の上に付く「フェルマータ」の意味は？","answer":"その音をほどよく延ばす","choices":["その音をほどよく延ばす","その音を短く切る","その音を強く","その音を省略する"],"explanation":"程よく延ばす記号で、どのくらい延ばすかは指揮者や奏者の解釈に委ねられます。"},{"id":"g_16","category":"term","question":"「con sordino（コン・ソルディーノ）」の意味は？","answer":"弱音器を付けて","choices":["弱音器を付けて","弓を使わずに","全員で","テンポを自由に"],"explanation":"弱音器（ミュート）を付けて、柔らかく霞んだ音色にする指示です。"},{"id":"g_17","category":"term","question":"「divisi（ディヴィジ）」と書かれていたら？","answer":"同じパートを2つ以上に分けて演奏する","choices":["同じパートを2つ以上に分けて演奏する","その部分を省略する","全員で同じ音を弾く","独奏者だけが弾く"],"explanation":"同じパートの奏者を分け、それぞれ別の音を受け持つ指示です。"},{"id":"g_18","category":"theory","question":"ハ長調の「平行調」は？","answer":"イ短調","choices":["イ短調","ハ短調","ト長調","ヘ長調"],"explanation":"同じ調号（ハ長調・イ短調ともに♯♭なし）を持つ長調と短調の関係を平行調と呼びます。"},{"id":"g_19","category":"theory","question":"ハ長調の「同主調」は？","answer":"ハ短調","choices":["ハ短調","イ短調","ト長調","ホ短調"],"explanation":"同じ主音（ド）を持つ長調と短調の関係を同主調と呼びます。"},{"id":"g_20","category":"theory","question":"ある調の「属音」は、主音から数えて何番目の音？","answer":"5番目","choices":["5番目","2番目","4番目","7番目"],"explanation":"ハ長調ならソが属音。主音へ戻ろうとする力が強く、和声の要となる音です。"},{"id":"g_21","category":"theory","question":"ソナタ形式の3つの部分の正しい順番は？","answer":"提示部 → 展開部 → 再現部","choices":["提示部 → 展開部 → 再現部","展開部 → 提示部 → 再現部","再現部 → 提示部 → 展開部","提示部 → 再現部 → 展開部"],"explanation":"主題を示し（提示部）、発展させ（展開部）、再び戻ってくる（再現部）という構成です。交響曲の第1楽章によく使われます。"},{"id":"g_22","category":"theory","question":"4分の3拍子の1小節に入る音の長さの合計は？","answer":"4分音符3つ分","choices":["4分音符3つ分","4分音符4つ分","8分音符3つ分","2分音符3つ分"],"explanation":"分母が「4分音符を1拍」、分子が「1小節に3拍」を表します。"},{"id":"g_23","category":"theory","question":"交響曲の楽章数として、古典派以降もっとも一般的なのは？","answer":"4楽章","choices":["4楽章","2楽章","6楽章","1楽章"],"explanation":"速い楽章・ゆるやかな楽章・舞曲（メヌエットやスケルツォ）・速い終楽章の4楽章が基本形です。"},{"id":"g_24","category":"trivia","question":"指揮者が使う指揮棒は、一般に何と呼ばれる？","answer":"タクト","choices":["タクト","バトンマスター","スコア","メトロノーム"],"explanation":"ドイツ語の「タクトシュトック」に由来します。なお、指揮者用の全パートが載った楽譜は「スコア（総譜）」です。"}]},"quizzes/instruments":{"_説明":"楽器・楽器編成に関する問題（どの曲の練習でも出題）。","questions":[{"id":"g_1","category":"orch","question":"オーケストラが演奏前に音合わせ（チューニング）をするとき、基準の音を出す楽器は？","answer":"オーボエ","choices":["オーボエ","ピアノ","トランペット","コントラバス"],"explanation":"音程が安定し、よく通る音色のオーボエがA（ラ）の音を出すのが一般的です。"},{"id":"g_2","category":"orch","question":"オーケストラの弦楽器で、最も低い音域を受け持つのは？","answer":"コントラバス","choices":["コントラバス","チェロ","ヴィオラ","ファゴット"],"explanation":"弦楽器はヴァイオリン・ヴィオラ・チェロ・コントラバスの順に低くなります。"},{"id":"g_3","category":"orch","question":"コンサートマスターは、通常どのパートの首席奏者？","answer":"第1ヴァイオリン","choices":["第1ヴァイオリン","チェロ","オーボエ","ティンパニ"],"explanation":"第1ヴァイオリンの首席奏者がオーケストラ全体をまとめ、指揮者と団員をつなぎます。"},{"id":"g_4","category":"orch","question":"ペダルなどで音の高さを変えられる、オーケストラの代表的な打楽器は？","answer":"ティンパニ","choices":["ティンパニ","大太鼓","シンバル","トライアングル"],"explanation":"ティンパニは決まった音程を持つ太鼓で、ペダルで素早く音の高さを変えられます。"},{"id":"g_5","category":"orch","question":"木管五重奏（フルート・オーボエ・クラリネット・ファゴット＋もう1つ）に加わる金管楽器は？","answer":"ホルン","choices":["ホルン","トランペット","トロンボーン","テューバ"],"explanation":"ホルンは木管楽器ともよく溶け合う音色のため、木管五重奏の一員になります。"},{"id":"g_6","category":"orch","question":"書かれた音と実際に鳴る音の高さが異なる「移調楽器」はどれ？","answer":"クラリネット","choices":["クラリネット","フルート","ヴァイオリン","オーボエ"],"explanation":"B♭管のクラリネットは、楽譜のドを吹くと実際にはシ♭が鳴ります。"},{"id":"g_7","category":"orch","question":"ファゴットは何の仲間の楽器？","answer":"ダブルリードの木管楽器","choices":["ダブルリードの木管楽器","金管楽器","弦楽器","打楽器"],"explanation":"オーボエと同じく2枚のリードを振動させて音を出す、低音の木管楽器です。"}]},"quizzes/songs":{"_説明":"曲ごとの問題。キーは曲ID（data/songs の id）。answer は choices のどれか1つと同じ文字列にします。","questions":{"egmont":[{"id":"egmont_1","category":"bg","question":"序曲「エグモント」は、誰の戯曲『エグモント』のための音楽として作曲された？","answer":"ゲーテ","choices":["ゲーテ","シラー","シェイクスピア","レッシング"],"explanation":"ベートーヴェンはゲーテの戯曲『エグモント』の上演のために、序曲を含む付随音楽を作曲しました。"},{"id":"egmont_2","category":"bg","question":"主人公エグモント伯は、どの地域の人々のために圧政に立ち向かった人物？","answer":"ネーデルラント（オランダ）","choices":["ネーデルラント（オランダ）","スコットランド","ボヘミア","ポーランド"],"explanation":"16世紀、スペインの支配に抵抗したネーデルラントの貴族です。自由のために戦う英雄像がベートーヴェンの心をとらえました。"},{"id":"egmont_3","category":"form","question":"序曲「エグモント」の調は？（最後は明るい長調の「勝利」で終わる）","answer":"ヘ短調","choices":["ヘ短調","ハ短調","ニ短調","ト短調"],"explanation":"重々しいヘ短調で始まり、終結部ではヘ長調に転じて勝利を高らかに歌い上げます。"}],"figaro":[{"id":"figaro_1","category":"bg","question":"歌劇「フィガロの結婚」の原作の戯曲を書いたのは？","answer":"ボーマルシェ","choices":["ボーマルシェ","モリエール","ゴルドーニ","シラー"],"explanation":"フランスの劇作家ボーマルシェの戯曲が原作です。貴族を風刺する内容で、当時は上演が問題視されたこともありました。"},{"id":"figaro_2","category":"bg","question":"モーツァルトと組んで「フィガロの結婚」の台本を書いた人物は？","answer":"ロレンツォ・ダ・ポンテ","choices":["ロレンツォ・ダ・ポンテ","シカネーダー","メタスタージオ","ボーイト"],"explanation":"ダ・ポンテは「ドン・ジョヴァンニ」「コジ・ファン・トゥッテ」の台本も手がけ、モーツァルトの名コンビでした。"},{"id":"figaro_3","category":"term","question":"序曲に書かれた速度記号「Presto（プレスト）」の意味は？","answer":"非常に速く","choices":["非常に速く","ゆるやかに","歩くような速さで","だんだん遅く"],"explanation":"Prestoは「非常に速く」。弦楽器が小声でささやくように始まり、一気に駆け抜ける序曲です。"}],"tell":[{"id":"tell_1","category":"bg","question":"「ウィリアム・テル」は、ロッシーニにとってどんな作品？","answer":"最後に作曲したオペラ","choices":["最後に作曲したオペラ","最初に作曲したオペラ","唯一の喜劇オペラ","未完のまま残ったオペラ"],"explanation":"ロッシーニは37歳で「ウィリアム・テル」を発表したあと、新しいオペラを書きませんでした。"},{"id":"tell_2","category":"orch","question":"序曲の冒頭、夜明けの情景を独奏で奏でるのはどの楽器の奏者たち？","answer":"チェロ","choices":["チェロ","ホルン","フルート","トランペット"],"explanation":"5人の独奏チェロによる静かなアンサンブルで始まり、嵐・牧歌・スイス軍の行進へと続きます。"},{"id":"tell_3","category":"bg","question":"ウィリアム・テルは、どこの国の伝説的英雄？","answer":"スイス","choices":["スイス","オーストリア","イタリア","ドイツ"],"explanation":"息子の頭上のリンゴを弓で射抜いた逸話で知られる、スイス独立の伝説の英雄です。"}],"ruslan":[{"id":"ruslan_1","category":"bg","question":"歌劇「ルスランとリュドミラ」の原作となった叙事詩の作者は？","answer":"プーシキン","choices":["プーシキン","トルストイ","ゴーゴリ","ドストエフスキー"],"explanation":"ロシアの国民的詩人プーシキンの叙事詩が原作です。"},{"id":"ruslan_2","category":"life","question":"作曲者グリンカは、しばしば何と呼ばれる？","answer":"ロシア音楽の父","choices":["ロシア音楽の父","交響曲の父","ワルツ王","歌曲王"],"explanation":"ロシアの題材と民謡的な旋律を取り入れたオペラで、後のロシア音楽の流れをつくったことからそう呼ばれます。"}],"academic":[{"id":"academic_1","category":"bg","question":"ブラームスが「大学祝典序曲」を書いたきっかけは？","answer":"ブレスラウ大学から名誉博士号を贈られた","choices":["ブレスラウ大学から名誉博士号を贈られた","母校の創立記念式典","大学の音楽教授に就任した","学生オーケストラからの依頼"],"explanation":"名誉博士号の返礼として作曲され、1881年にブレスラウ大学で初演されました。"},{"id":"academic_2","category":"form","question":"曲の最後に堂々と登場する、有名な学生歌は？","answer":"ガウデアムス（いざ楽しまん）","choices":["ガウデアムス（いざ楽しまん）","蛍の光","歓喜の歌","ラ・マルセイエーズ"],"explanation":"当時の学生歌がいくつも引用され、最後に「ガウデアムス」が全オーケストラで華やかに歌われます。"},{"id":"academic_3","category":"trivia","question":"ブラームスが「大学祝典序曲」と同じ時期に書いた、対照的な性格の序曲は？","answer":"悲劇的序曲","choices":["悲劇的序曲","英雄序曲","謝肉祭序曲","祝典序曲「1812年」"],"explanation":"ブラームスは「一方は泣き、一方は笑う」と、2つの序曲を対にして語りました。"}],"meister":[{"id":"meister_1","category":"bg","question":"楽劇「ニュルンベルクのマイスタージンガー」で、物語の中心となる親方歌手ハンス・ザックスの本業は？","answer":"靴屋","choices":["靴屋","パン屋","鍛冶屋","仕立屋"],"explanation":"ハンス・ザックスは16世紀に実在した靴職人の詩人・歌手です。"},{"id":"meister_2","category":"form","question":"前奏曲の調は？","answer":"ハ長調","choices":["ハ長調","ニ長調","変ホ長調","ト長調"],"explanation":"輝かしいハ長調で始まり、劇中の主要な旋律がいくつも重ね合わされます。"},{"id":"meister_3","category":"term","question":"ワーグナーが多用した、人物や物・考えを表す短い旋律を何と呼ぶ？","answer":"ライトモティーフ（示導動機）","choices":["ライトモティーフ（示導動機）","カデンツァ","オスティナート","リトルネロ"],"explanation":"登場人物や思想に固有の動機を結びつけ、音楽で物語を語る手法です。"}],"freischutz":[{"id":"freischutz_1","category":"bg","question":"歌劇「魔弾の射手」の主人公マックスの職業は？","answer":"狩人（猟師）","choices":["狩人（猟師）","騎士","粉屋","船乗り"],"explanation":"射撃大会で勝つために、悪魔の力を借りた「魔弾」を手に入れてしまう若い狩人の物語です。"},{"id":"freischutz_2","category":"orch","question":"序曲の序奏で、深い森の雰囲気を描く有名な四重奏を奏でる楽器は？","answer":"ホルン","choices":["ホルン","トロンボーン","クラリネット","ファゴット"],"explanation":"4本のホルンによる穏やかな合奏は、ドイツの森を象徴する響きとして知られています。"},{"id":"freischutz_3","category":"hist","question":"「魔弾の射手」は、どの音楽様式を代表するオペラとされる？","answer":"ドイツ・ロマン派","choices":["ドイツ・ロマン派","イタリアのベルカント","フランスのグランド・オペラ","バロック・オペラ"],"explanation":"民間伝承・森・超自然を題材にし、ドイツ・ロマン派オペラの出発点とされます。"}],"hebrides":[{"id":"hebrides_1","category":"bg","question":"メンデルスゾーンが序曲「フィンガルの洞窟」を着想したのは、どこを旅したとき？","answer":"スコットランド","choices":["スコットランド","イタリア","スイス","アイルランド"],"explanation":"1829年、スコットランドのヘブリディーズ諸島を訪れた体験から生まれました。"},{"id":"hebrides_2","category":"form","question":"序曲「フィンガルの洞窟」の調は？","answer":"ロ短調","choices":["ロ短調","ニ長調","ハ短調","イ長調"],"explanation":"ロ短調の寄せては返す波のような動機が、曲全体を通して現れます。"}],"vltava":[{"id":"vltava_1","category":"form","question":"「モルダウ」は、スメタナの連作交響詩『わが祖国』の何曲目？","answer":"第2曲","choices":["第2曲","第1曲","第4曲","第6曲"],"explanation":"『わが祖国』は6曲からなり、「モルダウ」はその第2曲です。"},{"id":"vltava_2","category":"bg","question":"モルダウ（ヴルタヴァ）川が流れる、チェコの首都は？","answer":"プラハ","choices":["プラハ","ウィーン","ブダペスト","ワルシャワ"],"explanation":"源流から始まり、農村や婚礼の踊りを経て、プラハの街を流れていく様子が描かれます。"},{"id":"vltava_3","category":"orch","question":"曲の冒頭、川の2つの源流を表すのはどの楽器？","answer":"フルート","choices":["フルート","オーボエ","ホルン","ハープ"],"explanation":"2本のフルートが湧き出る水を描き、やがてクラリネットが加わって流れが合わさります。"}],"carnival":[{"id":"carnival_1","category":"bg","question":"序曲「謝肉祭」は、ドヴォルザークの3つの序曲からなる連作の1曲。連作の名前は？","answer":"自然と人生と愛","choices":["自然と人生と愛","四季","わが祖国","スラヴ舞曲"],"explanation":"「自然の中で」「謝肉祭」「オセロ」の3曲で、共通の「自然の動機」が使われています。"},{"id":"carnival_2","category":"form","question":"序曲「謝肉祭」の調は？","answer":"イ長調","choices":["イ長調","ハ短調","ニ短調","ヘ長調"],"explanation":"明るいイ長調で、タンバリンやトライアングルも加わり祭りのにぎわいを描きます。"}],"finlandia":[{"id":"finlandia_1","category":"bg","question":"「フィンランディア」が作曲された当時、フィンランドを支配していた国は？","answer":"ロシア帝国","choices":["ロシア帝国","スウェーデン王国","ドイツ帝国","デンマーク王国"],"explanation":"帝政ロシアの圧政が強まる中で作られ、フィンランドの人々の愛国心を象徴する曲になりました。"},{"id":"finlandia_2","category":"trivia","question":"中間部の祈るような旋律は、のちに何として親しまれている？","answer":"歌詞を付けた合唱曲（フィンランディア賛歌）","choices":["歌詞を付けた合唱曲（フィンランディア賛歌）","国際連合の公式歌","オリンピック賛歌","北欧の結婚行進曲"],"explanation":"後に歌詞が付けられ、「フィンランディア賛歌」として広く歌われています。"},{"id":"finlandia_3","category":"orch","question":"曲の冒頭、圧政を表す重苦しい和音を響かせるのは？","answer":"金管楽器","choices":["金管楽器","弦楽器のピッツィカート","木管楽器","ハープとチェレスタ"],"explanation":"金管楽器の重い和音で始まり、やがて木管・弦が祈りのような旋律で応えます。"}],"peergynt":[{"id":"peergynt_1","category":"bg","question":"「ペール・ギュント」は、誰の戯曲のための音楽？","answer":"イプセン","choices":["イプセン","ストリンドベリ","チェーホフ","アンデルセン"],"explanation":"ノルウェーの劇作家イプセンの依頼で、グリーグが劇の付随音楽を作曲しました。"},{"id":"peergynt_2","category":"form","question":"第1組曲の第1曲は？","answer":"朝","choices":["朝","オーセの死","アニトラの踊り","山の魔王の宮殿にて"],"explanation":"第1組曲は「朝」「オーセの死」「アニトラの踊り」「山の魔王の宮殿にて」の4曲です。"},{"id":"peergynt_3","category":"orch","question":"「朝」の有名な旋律を最初に奏でる楽器は？","answer":"フルート","choices":["フルート","ヴァイオリン","ホルン","クラリネット"],"explanation":"フルートとオーボエが旋律を受け渡しながら、少しずつ夜が明けていく様子を描きます。"}],"arlesienne":[{"id":"arlesienne_1","category":"bg","question":"「アルルの女」の原作の戯曲を書いたのは？","answer":"アルフォンス・ドーデ","choices":["アルフォンス・ドーデ","ヴィクトル・ユーゴー","メリメ","デュマ"],"explanation":"ドーデの戯曲の付随音楽をビゼーが作曲し、第2組曲はビゼーの没後に友人ギローが編みました。"} ices":["弦楽器だけ","弦楽器と木管楽器","弦楽器とハープ","オーケストラ全体"],"explanation":"弦楽合奏のために書かれ、弦楽器だけで豊かな響きを生み出します。"},{"id":"serenade_2","category":"form","question":"第2楽章は何の舞曲？","answer":"ワルツ","choices":["ワルツ","メヌエット","ポロネーズ","マズルカ"],"explanation":"優雅なワルツで、単独でもよく演奏されます。"},{"id":"serenade_3","category":"life","question":"チャイコフスキーが第1楽章を「敬意を表して」書いたと語った、敬愛する作曲家は？","answer":"モーツァルト","choices":["モーツァルト","ベートーヴェン","バッハ","ハイドン"],"explanation":"チャイコフスキーはモーツァルトを深く敬愛し、その様式への敬意を込めたと述べています。"}],"enigma":[{"id":"enigma_1","category":"bg","question":"エルガー「エニグマ変奏曲」の各変奏は、何を描いている？","answer":"作曲者の友人たちや妻の姿","choices":["作曲者の友人たちや妻の姿","イギリス各地の風景","四季の移り変わり","歴代の国王"],"explanation":"各変奏には友人たちのイニシャルなどが付けられ、それぞれの人柄が音楽で描かれています。"},{"id":"enigma_2","category":"form","question":"最も有名で、追悼の場でも演奏される第9変奏の名前は？","answer":"ニムロッド","choices":["ニムロッド","ドラベッラ","ロマンツァ","トロイト"],"explanation":"友人イェーガーを描いた変奏で、名前の由来は聖書の狩人ニムロデです。"},{"id":"enigma_3","category":"form","question":"「エニグマ変奏曲」の構成は？","answer":"主題と14の変奏","choices":["主題と14の変奏","主題と6の変奏","4つの楽章","序曲と3つの舞曲"],"explanation":"主題と14の変奏からなり、最後の変奏はエルガー自身を描いています。"}],"bolero":[{"id":"bolero_1","category":"bg","question":"「ボレロ」はもともと何のために作曲された？","answer":"バレエ（舞踊家イダ・ルビンシュタインの依頼）","choices":["バレエ（舞踊家イダ・ルビンシュタインの依頼）","オペラの間奏曲","映画音楽","軍楽隊の行進"],"explanation":"舞踊家イダ・ルビンシュタインのためのバレエ音楽として1928年に作曲されました。"},{"id":"bolero_2","category":"orch","question":"曲の最初から最後まで、同じリズムを刻み続ける楽器は？","answer":"小太鼓（スネアドラム）","choices":["小太鼓（スネアドラム）","ティンパニ","大太鼓","トライアングル"],"explanation":"小太鼓が一定のリズムを刻み続け、その上で旋律が楽器を替えながら繰り返されます。"},{"id":"bolero_3","category":"theory","question":"「ボレロ」の拍子は？","answer":"4分の3拍子","choices":["4分の3拍子","4分の4拍子","8分の6拍子","4分の2拍子"],"explanation":"スペインの舞曲ボレロにならった3拍子です。"},{"id":"bolero_4","category":"form","question":"「ボレロ」の大きな特徴は？","answer":"同じ旋律を繰り返しながら、楽器を増やし続けて大きく盛り上がる","choices":["同じ旋律を繰り返しながら、楽器を増やし続けて大きく盛り上がる","速さがどんどん上がっていく","途中で何度も曲調が変わる","最後は静かに消えていく"],"explanation":"速さはほぼ一定のまま、楽器の組み合わせと音量の変化だけで巨大なクレッシェンドを作ります。"}],"faune":[{"id":"faune_1","category":"bg","question":"「牧神の午後への前奏曲」が題材にした詩の作者は？","answer":"マラルメ","choices":["マラルメ","ボードレール","ランボー","ヴェルレーヌ"],"explanation":"フランスの詩人マラルメの詩『牧神の午後』の世界を音楽にしています。"},{"id":"faune_2","category":"orch","question":"曲の冒頭、けだるい旋律を独奏する楽器は？","answer":"フルート","choices":["フルート","オーボエ","クラリネット","ヴァイオリン"],"explanation":"フルート独奏の半音階的な旋律は、20世紀音楽の始まりとも言われます。"}],"macabre":[{"id":"macabre_1","category":"orch","question":"「死の舞踏」で独奏ヴァイオリンに施される特別な工夫は？","answer":"いちばん高い弦を半音低く調弦する","choices":["いちばん高い弦を半音低く調弦する","弓を使わず指ではじき続ける","弱音器を付けたまま弾く","弦を1本外して弾く"],"explanation":"最高弦（E線）をE♭に下げるスコルダトゥーラにより、不気味な響きの和音を生み出します。"},{"id":"macabre_2","category":"orch","question":"骸骨たちの骨がカタカタ鳴る様子を表す打楽器は？","answer":"シロフォン（木琴）","choices":["シロフォン（木琴）","グロッケンシュピール","カスタネット","タンバリン"],"explanation":"シロフォンの乾いた音が骨の音を表します。サン＝サーンスは後に「動物の謝肉祭」の「化石」でこの旋律を引用しました。"},{"id":"macabre_3","category":"form","question":"冒頭で真夜中を告げる時計の鐘を表すのは？","answer":"ハープが同じ音を12回鳴らす","choices":["ハープが同じ音を12回鳴らす","ティンパニの連打","チューブラーベルの和音","トランペットのファンファーレ"],"explanation":"ハープが12回同じ音を鳴らして真夜中を告げ、死神が登場します。"}],"hungarian5":[{"id":"hungarian5_1","category":"bg","question":"ブラームス「ハンガリー舞曲」の原曲の編成は？","answer":"ピアノ連弾","choices":["ピアノ連弾","弦楽四重奏","管弦楽","ヴァイオリンとピアノ"],"explanation":"もとはピアノ連弾曲集で、後にさまざまな編成に編曲されて親しまれています。"},{"id":"hungarian5_2","category":"bg","question":"ハンガリー舞曲が素材にした音楽は？","answer":"ハンガリーのロマ（ジプシー）楽団の音楽","choices":["ハンガリーのロマ（ジプシー）楽団の音楽","ハンガリーの宮廷音楽","ルネサンスの舞曲","ハンガリー国歌"],"explanation":"若きブラームスが演奏旅行で触れた、ロマの楽団が演奏するハンガリー風の音楽が素材です。"}],"pomp1":[{"id":"pomp1_1","category":"trivia","question":"「威風堂々」第1番の中間部の旋律に歌詞を付けた愛唱歌は？","answer":"希望と栄光の国","choices":["希望と栄光の国","ルール・ブリタニア","エルサレム","ゴッド・セイブ・ザ・キング"],"explanation":"戴冠式頌歌に転用され「希望と栄光の国」として、イギリスの第2の国歌とも呼ばれます。"},{"id":"pomp1_2","category":"bg","question":"「威風堂々（Pomp and Circumstance）」という題名の由来は？","answer":"シェイクスピア『オセロ』の台詞","choices":["シェイクスピア『オセロ』の台詞","イギリス国王の言葉","聖書の一節","エルガー自身の日記"],"explanation":"『オセロ』の台詞「誉れある戦の威風堂々たる様」から取られています。"}],"fledermaus":[{"id":"fledermaus_1","category":"trivia","question":"喜歌劇「こうもり」が、ウィーンなどで伝統的に上演される時期は？","answer":"大晦日（年末年始）","choices":["大晦日（年末年始）","復活祭","真夏の音楽祭","収穫祭"],"explanation":"ウィーン国立歌劇場では毎年大晦日に上演されるなど、年末年始の定番の演目です。"},{"id":"fledermaus_2","category":"hist","question":"「こうもり」のジャンル「喜歌劇（オペレッタ）」の特徴は？","answer":"台詞と歌が交互に進む、軽妙な娯楽作品","choices":["台詞と歌が交互に進む、軽妙な娯楽作品","全編が歌だけで進む悲劇","歌のない舞踊劇","宗教的な題材の合唱劇"],"explanation":"オペレッタは台詞を交えた軽い喜劇的な歌劇で、ウィーンで大いに栄えました。"}],"cavalleria":[{"id":"cavalleria_1","category":"bg","question":"「カヴァレリア・ルスティカーナ」の舞台は？","answer":"シチリアの村","choices":["シチリアの村","ヴェネツィアの宮殿","ローマの古代闘技場","ミラノの劇場"],"explanation":"復活祭の日のシチリアの村で起こる、愛と嫉妬の悲劇です。"},{"id":"cavalleria_2","category":"hist","question":"このオペラは、どの潮流を代表する作品？","answer":"ヴェリズモ（写実主義）","choices":["ヴェリズモ（写実主義）","ベルカント","バロック・オペラ","印象主義"],"explanation":"庶民の日常と激しい感情を写実的に描くヴェリズモ・オペラの代表作です。"}],"air":[{"id":"air_1","category":"bg","question":"「G線上のアリア」の原曲は？","answer":"管弦楽組曲第3番の「エア」","choices":["管弦楽組曲第3番の「エア」","ブランデンブルク協奏曲第3番","マタイ受難曲のアリア","無伴奏チェロ組曲第1番"],"explanation":"バッハの管弦楽組曲第3番 ニ長調の第2曲「エア（アリア）」が原曲です。"},{"id":"air_2","category":"trivia","question":"「G線上の」という呼び名の由来は？","answer":"ヴァイオリンのG線だけで弾けるように編曲されたから","choices":["ヴァイオリンのG線だけで弾けるように編曲されたから","作曲された町の頭文字","ト音記号で書かれているから","G公爵に献呈されたから"],"explanation":"19世紀にヴァイオリン奏者ヴィルヘルミが、G線1本で弾ける独奏曲に編曲したことに由来します。"},{"id":"air_3","category":"form","question":"原曲の調は？","answer":"ニ長調","choices":["ニ長調","ト長調","ハ長調","ヘ長調"],"explanation":"原曲はニ長調。ヴィルヘルミ編曲ではハ長調に移され、G線だけで弾けるようにしています。"}],"rosamunde":[{"id":"rosamunde_1","category":"trivia","question":"現在「ロザムンデ」序曲として演奏される曲は、もともと何の序曲？","answer":"劇付随音楽『魔法の竪琴』","choices":["劇付随音楽『魔法の竪琴』","交響曲「未完成」","歌曲集『冬の旅』","ミサ曲"],"explanation":"シューベルトの劇付随音楽『魔法の竪琴』の序曲が、のちに「ロザムンデ」の序曲として広まりました。"},{"id":"rosamunde_2","category":"bg","question":"『ロザムンデ』はどんな種類の作品のための音楽？","answer":"劇の付随音楽","choices":["劇の付随音楽","オペラ","バレエ","ミサ曲"],"explanation":"ヘルミーナ・フォン・シェジーの戯曲のための付随音楽で、間奏曲やバレエ音楽も有名です。"}],"hansel":[{"id":"hansel_1","category":"bg","question":"歌劇「ヘンゼルとグレーテル」の原作は？","answer":"グリム童話","choices":["グリム童話","アンデルセン童話","イソップ物語","ペロー童話"],"explanation":"グリム童話をもとに、作曲者の妹アーデルハイト・ヴェッテが台本を書きました。"},{"id":"hansel_2","category":"orch","question":"前奏曲の冒頭、穏やかな「夕べの祈り」の旋律を奏でる楽器は？","answer":"ホルン","choices":["ホルン","トランペット","オーボエ","ヴァイオリン"],"explanation":"ホルンの合奏で始まる旋律は、劇中で兄妹が歌う「夕べの祈り」です。"},{"id":"hansel_3","category":"life","question":"フンパーディンクが若い頃に助手を務めた大作曲家は？","answer":"ワーグナー","choices":["ワーグナー","ブラームス","ヴェルディ","リスト"],"explanation":"バイロイトで楽劇「パルジファル」の上演準備を手伝いました。"}],"adagio":[{"id":"adagio_1","category":"bg","question":"バーバー「弦楽のためのアダージョ」の原曲は？","answer":"弦楽四重奏曲の第2楽章","choices":["弦楽四重奏曲の第2楽章","交響曲の第3楽章","映画音楽","ピアノ独奏曲"],"explanation":"作曲者自身の弦楽四重奏曲の楽章を、弦楽合奏用に編曲したものです。"},{"id":"adagio_2","category":"bg","question":"「弦楽のためのアダージョ」を1938年に初演した指揮者は？","answer":"トスカニーニ","choices":["トスカニーニ","バーンスタイン","カラヤン","ストコフスキー"],"explanation":"トスカニーニがNBC交響楽団とラジオ放送で初演し、広く知られるようになりました。"},{"id":"adagio_3","category":"trivia","question":"バーバーはこの曲を、のちにどんな合唱曲に編曲した？","answer":"アニュス・デイ（神の小羊）","choices":["アニュス・デイ（神の小羊）","ハレルヤ","アヴェ・マリア","グローリア"],"explanation":"ラテン語のミサの一節「アニュス・デイ」に合わせた合唱曲に編曲しています。"}],"beet5":[{"id":"beet5_1","category":"form","question":"第5番冒頭の有名な動機のリズムは？","answer":"短い音3つと長い音1つ","choices":["短い音3つと長い音1つ","長い音3つと短い音1つ","短い音と長い音が交互","同じ長さの音が4つ"],"explanation":"「タタタ・ターン」という短い動機が、全曲を通して形を変えて現れます。"},{"id":"beet5_2","category":"form","question":"第3楽章から第4楽章へは、どのようにつながる？","answer":"切れ目なく続く","choices":["切れ目なく続く","長い休止をはさむ","第2楽章に戻ってから進む","独奏のカデンツァをはさむ"],"explanation":"暗い第3楽章から休みなく、輝かしいハ長調の第4楽章に突入します。"},{"id":"beet5_3","category":"orch","question":"第4楽章で新たに加わる楽器は？","answer":"トロンボーン","choices":["トロンボーン","ハープ","サクソフォン","チェレスタ"],"explanation":"トロンボーン、ピッコロ、コントラファゴットが加わり、勝利の響きを力強くします。"},{"id":"beet5_4","category":"trivia","question":"第5番が初演された同じ演奏会で、ほかに初演された交響曲は？","answer":"第6番「田園」","choices":["第6番「田園」","第3番「英雄」","第7番","第9番"],"explanation":"1808年12月22日のウィーンでの演奏会で、第5番と第6番「田園」が同時に初演されました。"}],"beet7":[{"id":"beet7_1","category":"trivia","question":"ワーグナーは交響曲第7番を何と評した？","answer":"舞踏の聖化","choices":["舞踏の聖化","運命の扉","英雄の生涯","田園の喜び"],"explanation":"リズムの躍動が全曲を貫くことから、ワーグナーは「舞踏の聖化」と呼びました。"},{"id":"beet7_2","category":"form","question":"初演時にアンコールされたという人気の第2楽章の速度表示は？","answer":"アレグレット","choices":["アレグレット","アダージョ","プレスト","ラルゴ"],"explanation":"「少し速く」を意味するアレグレット。同じリズムが繰り返される印象的な楽章です。"}],"beet3":[{"id":"beet3_1","category":"bg","question":"ベートーヴェンが交響曲第3番を当初献呈しようとしていた人物は？","answer":"ナポレオン","choices":["ナポレオン","ゲーテ","ハイドン","ルドルフ大公"],"explanation":"ナポレオンが皇帝に即位したと聞いて激怒し、献呈をとりやめたと伝えられています。"},{"id":"beet3_2","category":"form","question":"第2楽章は何？","answer":"葬送行進曲","choices":["葬送行進曲","ワルツ","メヌエット","ロンド"],"explanation":"「葬送行進曲」と題された、重く荘厳な楽章です。"},{"id":"beet3_3","category":"orch","question":"第3楽章のトリオで活躍する、当時としては珍しい編成は？","answer":"3本のホルン","choices":["3本のホルン","4本のトランペット","2台のハープ","6本のフルート"],"explanation":"当時の交響曲は2本が普通だったホルンを3本用い、狩りの角笛のように響かせます。"}],"mozart41":[{"id":"mozart41_1","category":"life","question":"交響曲第41番「ジュピター」は、モーツァルトにとってどんな作品？","answer":"最後に作曲した交響曲","choices":["最後に作曲した交響曲","最初に作曲した交響曲","未完のまま残った交響曲","唯一の短調の交響曲"],"explanation":"第41番はモーツァルトが書いた最後の交響曲です。"},{"id":"mozart41_2","category":"trivia","question":"「ジュピター」という愛称は誰が付けた？","answer":"モーツァルトの没後、ほかの人が付けた","choices":["モーツァルトの没後、ほかの人が付けた","モーツァルト本人","妻のコンスタンツェ","父のレオポルト"],"explanation":"モーツァルト自身の命名ではなく、後世に付けられた愛称です（興行師ザロモンによるとも伝えられます）。"},{"id":"mozart41_3","category":"form","question":"終楽章の主題「ド・レ・ファ・ミ」を、ほかの主題と重ね合わせる作曲技法は？","answer":"対位法（フーガ的な書法）","choices":["対位法（フーガ的な書法）","十二音技法","ミニマル・ミュージック","通奏低音"],"explanation":"複数の主題を同時に重ねる対位法の技が、終盤で見事に展開されます。"},{"id":"mozart41_4","category":"bg","question":"第39番・第40番・第41番の3曲は、どのくらいの期間で作曲された？","answer":"1788年の夏の約1か月半","choices":["1788年の夏の約1か月半","約10年","約3年","1日"],"explanation":"1788年の夏、わずか約6週間のうちに3つの交響曲が書き上げられました。"}],"schubert8":[{"id":"schubert8_1","category":"form","question":"「未完成」交響曲で完成しているのは何楽章まで？","answer":"第2楽章まで","choices":["第2楽章まで","第1楽章だけ","第3楽章まで","第4楽章の途中まで"],"explanation":"第2楽章までが完成した形で残され、第3楽章はスケッチのみが伝わります。"},{"id":"schubert8_2","category":"orch","question":"冒頭、低く神秘的な旋律を奏でる楽器は？","answer":"チェロとコントラバス","choices":["チェロとコントラバス","ホルンとファゴット","ヴァイオリン","トロンボーン"],"explanation":"チェロとコントラバスが弱音で始め、その上でオーボエとクラリネットが旋律を歌います。"},{"id":"schubert8_3","category":"trivia","question":"「未完成」が初演されたのはいつ頃？","answer":"作曲者の死から30年以上たってから","choices":["作曲者の死から30年以上たってから","作曲した翌年","作曲者の葬儀の日","20世紀に入ってから"],"explanation":"作曲は1822年ですが、楽譜は長く埋もれ、作曲者の死（1828年）から37年後の1865年にウィーンで初演されました。"}],"mendel4":[{"id":"mendel4_1","category":"bg","question":"交響曲第4番「イタリア」は、何をもとに書かれた？","answer":"イタリア旅行の印象","choices":["イタリア旅行の印象","イタリアの歌劇","ローマ帝国の歴史","イタリア人の友人の依頼"],"explanation":"若きメンデルスゾーンがイタリアを旅したときの明るい印象をもとにしています。"},{"id":"mendel4_2","category":"form","question":"終楽章に用いられている、イタリアの速い舞曲は？","answer":"サルタレロ","choices":["サルタレロ","メヌエット","ポロネーズ","ボレロ"],"explanation":"跳びはねるような舞曲サルタレロのリズムで、勢いよく駆け抜けます。"},{"id":"mendel4_3","category":"theory","question":"イ長調で始まるこの交響曲。終楽章はどの調で書かれている？","answer":"イ短調","choices":["イ短調","イ長調","ハ長調","ニ長調"],"explanation":"長調の交響曲でありながら、終楽章は同主調のイ短調で書かれ、短調のまま終わります。"}],"brahms1":[{"id":"brahms1_1","category":"bg","question":"ブラームスが交響曲第1番を完成させるまでにかかった期間は？","answer":"約20年","choices":["約20年","約1年","約3か月","約5年"],"explanation":"ベートーヴェンの偉大さを意識し、構想から完成まで20年以上を費やしました。"},{"id":"brahms1_2","category":"trivia","question":"指揮者ビューローは、この交響曲を何と呼んだ？","answer":"ベートーヴェンの第10交響曲","choices":["ベートーヴェンの第10交響曲","新しい第九","北ドイツの田園","ドイツ・レクイエム"],"explanation":"ベートーヴェンの後継となる交響曲だという意味を込めて、こう呼びました。"},{"id":"brahms1_3","category":"orch","question":"終楽章の序奏で、アルプホルンを思わせる旋律を朗々と吹く楽器は？","answer":"ホルン","choices":["ホルン","トランペット","オーボエ","トロンボーン"],"explanation":"ホルンの雄大な旋律のあと、ベートーヴェン「歓喜の歌」を思わせる主題が現れます。"}],"dvorak9":[{"id":"dvorak9_1","category":"bg","question":"交響曲第9番「新世界より」は、ドヴォルザークがどこに滞在していたときに作曲された？","answer":"アメリカ","choices":["アメリカ","イギリス","ロシア","フランス"],"explanation":"ニューヨークのナショナル音楽院の院長として招かれていたときに作曲されました。"},{"id":"dvorak9_2","category":"orch","question":"第2楽章の旋律（日本では「家路」として有名）を奏でる楽器は？","answer":"イングリッシュホルン","choices":["イングリッシュホルン","オーボエ","クラリネット","フルート"],"explanation":"イングリッシュホルンの温かく哀愁のある音色で、故郷への思いが歌われます。"},{"id":"dvorak9_3","category":"trivia","question":"「新世界より」でシンバルが鳴るのは、全曲を通じて何回？","answer":"1回だけ","choices":["1回だけ","1回も鳴らない","各楽 /* ---------- 汎用 ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mean = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0;
const stdev = arr => { if (arr.length < 2) return 0; const m = mean(arr); return Math.sqrt(mean(arr.map(v => (v - m) ** 2))); };
const sigmoid = x => 1 / (1 + Math.exp(-x));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const round1 = v => Math.round(v * 10) / 10;
function weightedPick(obj) {
  const entries = Object.entries(obj).filter(([, w]) => w > 0);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [k, w] of entries) { if ((r -= w) <= 0) return k; }
  return entries.length ? entries[entries.length - 1][0] : null;
}
function newId(prefix) { STATE.nextId = (STATE.nextId || 1) + 1; return prefix + STATE.nextId; }

/* ---------- 曲 ---------- */
const findSong = id => SONG_LIBRARY.find(s => s.id === id) || null;
const songsOfGenre = g => SONG_LIBRARY.filter(s => s.genre === g);
const genreName = g => (GENRES.find(x => x.id === g) || {}).name || '';
function songRequirements(song) {
  const req = {};
  if (song.strings) Object.entries(song.strings).forEach(([k, v]) => { if (v) req[k] = v; });
  Object.entries(song.winds || {}).forEach(([k, v]) => { if (v) req[k] = v; });
  return req;
}
const songPlayers = song => Object.values(songRequirements(song)).reduce((s, v) => s + v, 0);
function songSections(song) {
  const req = songRequirements(song);
  return SECTIONS.filter(s => s.insts.some(i => req[i])).map(s => s.id);
}
function difficultyLabel(d) { return d <= 40 ? '初級' : d <= 60 ? '中級' : d <= 80 ? '上級' : '最高難度'; }
function songParam(id) {
  if (!STATE.songParams[id]) STATE.songParams[id] = { base: 0, underst: 0, expr: 0, performed: 0 };
  return STATE.songParams[id];
}
function songLongBonus(id) {
  const p = STATE.songParams[id]; if (!p) return 0;
  const sum = p.base + p.underst + p.expr;
  return CONFIG.songParam.bonusMax * (1 - Math.exp(-sum / CONFIG.songParam.bonusScale));
}

// 編成不足（楽器単位）
function shortageOf(song) {
  const have = countByInst();
  const req = songRequirements(song);
  const sc = CONFIG.concert.shortage;
  const items = []; let penalty = 0;
  for (const [inst, need] of Object.entries(req)) {
    const lack = Math.max(0, need - have[inst]);
    if (!lack) continue;
    const kind = INST[inst].kind;
    const per = kind === 'string' ? sc.perStringPlayer : kind === 'perc' ? sc.perPercPlayer : sc.perWindPlayer;
    const missing = have[inst] === 0;
    penalty += lack * per + (missing ? sc.missingInstrument : 0);
    items.push({ inst, need, have: have[inst], lack, missing });
  }
  return { items, penalty };
}
function formatInstrumentation(song) {
  const parts = [];
  const w = song.winds || {};
  for (const g of [['Fl', 'Ob', 'Cl', 'Fg'], ['Hr', 'Tp', 'Tb', 'Tuba'], ['Perc']]) {
    const s = g.filter(i => w[i]).map(i => `${INST[i].abbr} ${w[i]}`).join(', ');
    if (s) parts.push(s);
  }
  if (song.strings) { const s = song.strings; parts.push(`弦五部 (${s.Vn1}-${s.Vn2}-${s.Va}-${s.Vc}-${s.Cb})`); }
  return parts;
}

/* ---------- 資金 ---------- */
function spend(c, label, amount) {
  if (amount > 0 && STATE.funds < amount) return false;
  STATE.funds -= amount;
  if (amount) c.ledger.push({ label, amount: -amount });
  return true;
}

/* =========================================================

const activeConcert = () => STATE.concertPrograms[STATE.activeConcertId];

/* ---------- 新規ゲーム ---------- */
function newGame(name) {
  STATE = {

    orchestraName: name || '星霜フィルハーモニー管弦楽団',
    funds: CONFIG.initialFunds,

    songParams: {},

/* =========================================================
 * 保存・読み込み（セーブデータの版の移行を含む）
 * ========================================================= */
/* ---------- 保存・読み込み ---------- */
function save() {
  try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(STATE)); } catch (e) { /* ストレージ不可 */ }
}
function migrate(s) {
  if (!s || typeof s !== 'object' || !s.concertPrograms) return null;
  // v1（3曲構成・練習で成長）は構造が大きく異なるため引き継がない
  if ((s.version || 1) < 2) return null;
  if (!s.songParams) s.songParams = {};
  // v2 → v3：募集を演奏会から切り離す
  if (s.version < 3) {
    const order = (s.concertOrder || []).map(id => s.concertPrograms[id]).filter(Boolean);
    const cur = s.concertPrograms[s.activeConcertId];
    s.recruit = emptyRecruit();
    if (cur && cur.recruit) s.recruit = { candidates: cur.recruit.candidates || [], hired: cur.recruit.hired || [], rerolls: cur.recruit.rerolls || 0 };
    for (const c of order) {
      delete c.recruit;
      if (c.phase === 'recruit') c.phase = 'selection';   // 募集工程にいた演奏会は選曲から再開
    }
    s.ledger = s.ledger || [];
    s.version = 3;
    s._needCandidates = !s.recruit.candidates.length;
  }
  if (!s.recruit) s.recruit = emptyRecruit();
  // v3 → v4：Timp を Perc に統一／外見・首席・指揮者を追加
  if (s.version < 4) {
    for (const m of [...(s.members || []), ...((s.recruit && s.recruit.candidates) || [])]) if (m.inst === 'Timp') m.inst = 'Perc';
    s.version = 4;
    s._needV4 = true;
  }
  // v4 → v5：会場選択・選曲の段階を「演奏会の準備（setup）」に統合。決定済みの内容は引き継ぐ
  if (s.version < 5) {
    for (const c of Object.values(s.concertPrograms)) {
      if (c.phase === 'hall' || c.phase === 'selection') { c.phase = 'setup'; c.started = !!(c.hallId || c.songId); }
      if (!('conductorId' in c)) c.conductorId = c.phase === 'done' || c.phase === 'result' ? (c.result && c.result.conductorId) || null : s.conductorId || null;
    }
    s.version = 5;
  }
  if (!s.ledger) s.ledger = [];
  if (s.reputation == null) s.reputation = CONFIG.initialReputation;
  return s;
}
let LOAD_NOTE = '';
function load() {
  try {
    const raw = localStorage.getItem(CONFIG.SAVE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    const s = migrate(parsed);
    if (!s || !s.concertPrograms[s.activeConcertId]) {
      if (parsed && (parsed.version || 1) < 2) LOAD_NOTE = 'ゲームの仕組みが新しくなったため、以前のセーブデータは引き継げません。新しく楽団を始めてください。';
      return false;
    }
    STATE = s;
    if (STATE._needCandidates) { delete STATE._needCandidates; generateRecruitCandidates(); }
    if (STATE._needV4 || !STATE.conductors || !STATE.conductors.length) {
      delete STATE._needV4;
      STATE.conductors = [makeConductor(ORIGINAL_CONDUCTORS.find(o => o.founder))];
      STATE.conductorId = STATE.conductors[0].id;
    }
    if (!STATE.conductorMarket) generateConductorCandidates();
    if (!activeConductor()) STATE.conductorId = STATE.conductors[0].id;
    ensureLooks();

    ensureQuizState();

}
function resetSave() { try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) {} }

if (typeof module !== 'undefined') module.exports = {};

/* ---------- 練習クイズの記録 ----------
 * クイズの回答は、その演奏会の既存の「楽曲理解度」（c.perf.mastery.underst）を上げる（新しい数値は作らない）。
 * STATE.quiz = { count: 通常練習の回数（出題タイミング用）, streak: 連続正解数, best: 最高連続正解数,
 *               songs: { 曲ID: { asked: [出題済みの問題ID], answered, correct } },
 *               pending: 出題中の問題（回答前に再起動しても続きから出す）, history: 直近の回答 }
 * 古いセーブデータには無いので、読み込み時に安全な初期値で補う（セーブの版は変えない） */
function ensureQuizState() {
  const q = STATE.quiz = (STATE.quiz && typeof STATE.quiz === 'object') ? STATE.quiz : {};
  const num = (v, d = 0) => Number.isFinite(v) ? v : d;
  q.count = Math.max(0, Math.floor(num(q.count))); q.streak = Math.max(0, num(q.streak)); q.best = Math.max(q.streak, num(q.best));
  q.songs = (q.songs && typeof q.songs === 'object') ? q.songs : {};
  for (const [id, s] of Object.entries(q.songs)) {
    if (!s || typeof s !== 'object') { delete q.songs[id]; continue; }
    delete s.und;   // 以前の版で使っていた独自の理解度（今は既存の楽曲理解度に一本化）
    s.asked = Array.isArray(s.asked) ? s.asked : []; s.answered = num(s.answered); s.correct = num(s.correct);
  }
  q.pending = (q.pending && typeof q.pending === 'object' && q.pending.qid && Array.isArray(q.pending.order)) ? q.pending : null;
  q.history = Array.isArray(q.history) ? q.history.slice(-50) : [];
  return q;
}

// 管打楽器の首席によるソロの出来（音楽表現の評価へ）
function principalSoloBonus(song) {
  const req = songRequirements(song);
  const ps = Object.keys(req).filter(i => INST[i].kind !== 'string').map(principalOf).filter(Boolean);
  if (!ps.length) return 0;
  return (mean(ps.map(m => (m.abilities.tone + m.abilities.expr) / 2)) - 55) * CONFIG.principal.soloWeight;

/* =========================================================
 * 団員（能力・外見・首席奏者・セクション基礎能力・募集・採用・除籍）
 * ========================================================= */
/* ---------- 団員 ---------- */
function rankFromAvg(avg) {
  for (const [r, t] of CONFIG.rankThresholds) if (avg >= t) return r;
  return 'E';
}

const memberPotAvg = m => mean(ABILITIES.map(a => m.potential[a.id]));
const memberRank = m => rankFromAvg(memberAvg(m));

function randomName() {
  const used = new Set((STATE?.members || []).map(m => m.name));
  for (let i = 0; i < 30; i++) { const n = pick(NAME_FAMILY) + ' ' + pick(NAME_GIVEN); if (!used.has(n)) return n; }
  return pick(NAME_FAMILY) + ' ' + pick(NAME_GIVEN);
}

/* ---------- 外見（3Dモデル用。IDから決定的に生成し、保存して固定する） ---------- */
function hashStr(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
